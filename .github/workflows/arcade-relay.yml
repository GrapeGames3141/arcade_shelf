name: Deploy Arcade Relay

on:
  workflow_dispatch:
    inputs:
      workers_free_confirmed:
        description: Confirm Cloudflare account 3aed6802cc84d155b5f7940960ebd115 is on Workers Free before deployment.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arcade-relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require Workers Free confirmation
        if: ${{ inputs.workers_free_confirmed != true }}
        run: |
          echo "::error::An account administrator must explicitly confirm this exact account is on Workers Free."
          exit 1
      - name: Check out the release
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker upload without publishing
        working-directory: services/arcade-relay
        env:
          CLOUDFLARE_ACCOUNT_ID: 3aed6802cc84d155b5f7940960ebd115
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.166.0 deploy --dry-run --outdir dist
      - name: Publish the relay
        working-directory: services/arcade-relay
        env:
          CLOUDFLARE_ACCOUNT_ID: 3aed6802cc84d155b5f7940960ebd115
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.166.0 deploy
