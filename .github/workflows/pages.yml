name: Publish arcade to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the games
        uses: actions/checkout@v4
      - name: Check lobby JavaScript
        run: |
          node --check arcade.js
      - name: Test Pages packaging
        run: python3 -m unittest discover -s tools -p 'test_build_pages.py'
      - name: Prepare playable site
        run: python3 tools/build-pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload playable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages
      - name: Publish arcade
        id: deployment
        uses: actions/deploy-pages@v5
