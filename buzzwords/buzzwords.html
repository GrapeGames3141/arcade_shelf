<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buzz Words</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="Buzz Words: a spelling game for kids. Hear the word, see the picture, and tap the honeycomb letters to spell it. Earn stars and stickers and dress up your buddy.">
<style>
  :root { --ink:#24325a; --soft:#5a6a94; --paper:#fffaf0; --sun:#ffc93c; --pink:#ff6fa5; --mint:#3fd0a4; --sky:#58b7ff; --grape:#8f6bff; --line:rgba(36,50,90,.14); }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; overflow:hidden; background:#9fd8ff; color:var(--ink);
    font:600 16px/1.3 "Trebuchet MS", "Avenir Next Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .hud { position:fixed; pointer-events:none; z-index:2; }
  /* screens */
  .screen { position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto; }
  .screen[hidden] { display:none; }
  .card { width:min(640px,100%); max-height:100%; overflow:auto; background:rgba(255,250,240,.96); border:6px solid #fff; border-radius:32px; padding:20px 22px 22px;
    box-shadow:0 10px 0 rgba(36,50,90,.18), 0 20px 50px rgba(36,50,90,.25); text-align:center; }
  h1.logo { margin:6px 0 2px; font-size:clamp(52px,14vw,104px); line-height:.95; font-weight:900; letter-spacing:.02em; color:#fff;
    -webkit-text-stroke:3px var(--grape); text-shadow:0 6px 0 var(--grape), 0 14px 30px rgba(143,107,255,.45); }
  h1.logo span:nth-child(odd) { color:#ffe066; } h1.logo span:nth-child(3n) { color:#7ee0ff; } h1.logo span:nth-child(4n) { color:#ff9ccc; }
  .tag { color:var(--soft); margin:8px 0 16px; font-size:17px; }
  h2 { margin:0 0 10px; font-size:30px; font-weight:900; color:var(--grape); }
  .big { border:0; border-radius:999px; padding:16px 40px; font-size:28px; font-weight:900; color:#fff; background:linear-gradient(#56e0b8,#22b58a);
    box-shadow:0 7px 0 #158766, 0 12px 24px rgba(34,181,138,.35); text-shadow:0 2px 0 rgba(0,0,0,.18); }
  .big:active { transform:translateY(5px); box-shadow:0 2px 0 #158766; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .pill { border:3px solid #fff; border-radius:999px; padding:10px 18px; font-size:18px; font-weight:800; background:linear-gradient(#fff,#eaf3ff); box-shadow:0 5px 0 rgba(36,50,90,.15); display:inline-flex; gap:7px; align-items:center; }
  .pill:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(36,50,90,.15); }
  .pill.pink { background:linear-gradient(#ff9cc6,#ff6fa5); color:#fff; } .pill.sun { background:linear-gradient(#ffe27a,#ffc23c); } .pill.sky { background:linear-gradient(#8fd3ff,#58b7ff); color:#fff; }
  .wallet { display:flex; justify-content:center; gap:10px; margin-top:4px; }
  .wallet .chip { box-shadow:0 3px 0 rgba(36,50,90,.12); font-size:17px; }
  /* settings */
  .ops { display:grid; gap:10px; margin:6px 0 4px; }
  .op { display:flex; align-items:center; gap:10px; background:#fff; border-radius:20px; padding:10px 12px; border:3px solid var(--line); text-align:left; }
  .op.on { border-color:var(--mint); background:#effff9; }
  .op .sym { width:46px; height:46px; flex:none; border-radius:14px; display:grid; place-items:center; font-size:30px; font-weight:900; color:#fff; }
  .op .nm { flex:1; min-width:0; font-size:19px; font-weight:900; } .op .nm small { display:block; font-size:12.5px; color:var(--soft); font-weight:700; }
  .tog { width:58px; height:34px; border-radius:999px; border:0; background:#d4dbe9; position:relative; flex:none; padding:0; transition:background .2s; }
  .tog::after { content:""; position:absolute; left:4px; top:4px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2); transition:left .2s; }
  .tog.on { background:var(--mint); } .tog.on::after { left:28px; }
  .lvls { display:flex; gap:5px; flex-wrap:wrap; }
  .lv { border:3px solid var(--line); border-radius:999px; padding:5px 11px; font-size:14px; font-weight:800; background:#fff; color:var(--soft); }
  .lv.on { border-color:transparent; color:#fff; background:var(--sky); } .lv.on[data-l="1"] { background:#ffad33; } .lv.on[data-l="2"] { background:var(--pink); }
  .op:not(.on) .lvls { opacity:.45; }
  .opts { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; color:var(--soft); font-size:15px; align-items:center; }
  .seg { display:inline-flex; border-radius:999px; overflow:hidden; border:3px solid var(--line); }
  .seg button { border:0; background:#fff; padding:5px 12px; font-weight:800; color:var(--soft); }
  .seg button.on { background:var(--grape); color:#fff; }
  /* shop */
  .tabs { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  .tab { border:3px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; font-weight:900; font-size:15px; color:var(--soft); }
  .tab.on { background:var(--grape); color:#fff; border-color:transparent; }
  .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .item { background:#fff; border:3px solid var(--line); border-radius:22px; padding:8px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .item.eq { border-color:var(--mint); background:#effff9; }
  .item img { width:100%; max-width:120px; aspect-ratio:1; border-radius:16px; background:linear-gradient(#e8f6ff,#fff); }
  .item b { font-size:16px; } .item small { font-size:12.5px; color:var(--soft); font-weight:700; min-height:2.4em; }
  .item .lvbar { display:flex; gap:4px; } .item .lvbar i { width:16px; height:8px; border-radius:4px; background:#dde3ee; } .item .lvbar i.f { background:var(--mint); }
  .buy { border:0; border-radius:999px; padding:7px 14px; font-weight:900; font-size:15px; color:#fff; background:linear-gradient(#ffb94d,#ff8f1f); box-shadow:0 4px 0 #d36d06; }
  .buy:disabled { filter:grayscale(.7) opacity(.6); }
  .buy.use { background:linear-gradient(#8fd3ff,#3fa4f5); box-shadow:0 4px 0 #2a7fc4; } .buy.got { background:#b7c2d6; box-shadow:none; }
  /* results */
  .stars3 { display:flex; justify-content:center; gap:6px; margin:6px 0 6px; }
  .stars3 canvas { width:84px; height:84px; transition:transform .45s cubic-bezier(.3,1.7,.5,1); transform:scale(0); }
  .stars3 canvas.in { transform:scale(1); } .stars3 canvas:nth-child(2).in { transform:scale(1.2) translateY(-8px); }
  .loot { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:8px 0; }
  .loot .chip { font-size:20px; }
  .sticker { font-size:64px; line-height:1; filter:drop-shadow(0 4px 0 rgba(36,50,90,.18)); animation:pop .6s cubic-bezier(.3,1.7,.5,1); }
  @keyframes pop { from { transform:scale(0) rotate(-30deg); } to { transform:none; } }
  .book { display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:8px; }
  .book div { aspect-ratio:1; border-radius:18px; background:#fff; border:3px dashed var(--line); display:grid; place-items:center; font-size:40px; }
  .book div.got { border-style:solid; border-color:#ffe27a; background:#fffbe8; }
  .book div:not(.got) { filter:grayscale(1) opacity(.25); }
  .note { color:var(--soft); font-size:14px; margin-top:10px; }
  .x { position:absolute; }
  @media (max-width:520px) { .card { padding:14px 12px 16px; border-radius:26px; } .big { font-size:24px; padding:14px 30px; } .chip { font-size:15px; padding:4px 10px 4px 6px; } .rbtn { width:42px; height:42px; } }

  /* spelling board */
  #board { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:70px 12px 14px; gap:clamp(10px,2.2vh,22px); pointer-events:none; }
  #board[hidden] { display:none !important; }
  #pic { position:relative; pointer-events:auto; width:clamp(150px,30vh,260px); aspect-ratio:1; border-radius:36px; background:radial-gradient(circle at 50% 38%, #fffdf5, #fff1c9); border:7px solid #fff;
    box-shadow:0 8px 0 rgba(36,50,90,.16), 0 16px 40px rgba(36,50,90,.2); display:grid; place-items:center; cursor:pointer; transition:transform .25s; }
  #pic .emo { font-size:clamp(92px,19vh,170px); line-height:1; filter:drop-shadow(0 6px 4px rgba(0,0,0,.18)); font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif; }
  #pic.bump { transform:scale(1.08) rotate(-3deg); } #pic.wiggle { animation:shake .4s; }
  #say { position:absolute; right:-14px; bottom:-14px; width:62px; height:62px; border-radius:50%; border:4px solid #fff; background:linear-gradient(#8fd3ff,#3fa4f5); color:#fff; font-size:28px; box-shadow:0 5px 0 #2a7fc4; display:grid; place-items:center; padding:0; }
  #say:active { transform:translateY(4px); box-shadow:0 1px 0 #2a7fc4; }
  #say.talk { animation:talk .6s infinite; } @keyframes talk { 50% { transform:scale(1.12); } }
  #slots { display:flex; gap:clamp(5px,1.4vw,12px); justify-content:center; flex-wrap:nowrap; pointer-events:auto; }
  .slot { width:var(--ts); height:calc(var(--ts) * 1.12); border-radius:18px; background:rgba(255,255,255,.75); border:4px dashed rgba(36,50,90,.25); display:grid; place-items:center;
    font-size:calc(var(--ts) * .62); font-weight:900; color:var(--ink); text-transform:lowercase; position:relative; transition:background .2s, transform .2s; }
  .slot .ghost { color:rgba(36,50,90,.18); }
  .slot.next { border-color:var(--sun); background:#fffbe6; animation:glow 1.2s infinite; }
  @keyframes glow { 50% { box-shadow:0 0 0 6px rgba(255,201,60,.35); } }
  .slot.full { border-style:solid; border-color:#fff; background:linear-gradient(#fff,#fff4d6); box-shadow:0 5px 0 rgba(36,50,90,.15); }
  .slot.full.pop { animation:pop .35s cubic-bezier(.3,1.7,.5,1); }
  #tiles { display:flex; flex-wrap:wrap; gap:clamp(6px,1.4vw,12px); justify-content:center; max-width:min(720px,96vw); pointer-events:auto; margin-top:auto; padding-bottom:4px; }
  .tile { width:var(--tt); height:calc(var(--tt) * 1.08); border:0; padding:0; background:none; position:relative; font-size:calc(var(--tt) * .56); font-weight:900; color:#5a3a06; text-transform:lowercase;
    filter:drop-shadow(0 5px 0 var(--tile-sh,#c98a10)) drop-shadow(0 8px 10px rgba(36,50,90,.18)); transition:transform .15s, opacity .2s; }
  .tile::before { content:""; position:absolute; inset:0; clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%); background:var(--tile-bg,linear-gradient(#ffe48a,#ffbf2e)); }
  .tile::after { content:""; position:absolute; inset:9%; clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%); background:rgba(255,255,255,.28); }
  .tile span { position:relative; z-index:1; top:-2%; } .tile:active { transform:translateY(4px) scale(.96); }
  .tile.used { opacity:0; pointer-events:none; transform:scale(.4); }
  .tile.no { animation:shake .4s; } .tile.hint { animation:hint 1s infinite; } @keyframes hint { 50% { transform:translateY(-8px) scale(1.08); } }
  .flyer { position:fixed; z-index:6; pointer-events:none; display:grid; place-items:center; font-weight:900; color:#5a3a06; transition:left .32s cubic-bezier(.5,0,.3,1), top .32s cubic-bezier(.5,0,.3,1), transform .32s; }
  #hud { position:fixed; left:10px; right:10px; top:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; z-index:3; pointer-events:none; }
  #hud[hidden] { display:none !important; }
  .chip { pointer-events:auto; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.86); border:3px solid #fff; border-radius:999px; padding:5px 12px 5px 8px; box-shadow:0 4px 0 rgba(36,50,90,.18); font-size:18px; font-weight:800; }
  .chip i { font-style:normal; font-size:20px; }
  .rbtn { pointer-events:auto; width:48px; height:48px; border-radius:50%; border:3px solid #fff; background:linear-gradient(#fff,#e9f2ff); box-shadow:0 4px 0 rgba(36,50,90,.2); font-size:22px; display:grid; place-items:center; padding:0; }
  .rbtn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(36,50,90,.2); }
  #dots { display:flex; gap:6px; align-self:center; }
  #dots b { width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.7); border:2px solid #fff; box-shadow:0 2px 0 rgba(36,50,90,.15); }
  #dots b.ok { background:var(--mint); } #dots b.miss { background:#ffb14a; } #dots b.now { background:var(--sun); transform:scale(1.25); }
  #praise { position:fixed; z-index:4; pointer-events:none; left:50%; top:46%; transform:translate(-50%,-50%) scale(.6); font-size:clamp(34px,9vw,72px); font-weight:900; color:#fff; opacity:0; transition:opacity .2s, transform .35s cubic-bezier(.3,1.6,.5,1);
    text-shadow:0 4px 0 var(--grape), 0 0 24px rgba(143,107,255,.6); -webkit-text-stroke:2px var(--grape); white-space:nowrap; }
  #praise.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #praise.oops { text-shadow:0 4px 0 #e8743b; -webkit-text-stroke:2px #e8743b; font-size:clamp(26px,6vw,44px); }
  .hintbtn { pointer-events:auto; }
  @media (pointer:fine) { #tiles { margin-top:clamp(18px,5vh,60px); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div style="display:flex;gap:8px"><button class="rbtn" id="bPause" title="Pause">⏸</button><div class="chip"><i>⭐</i><span id="hStars">0</span></div></div>
  <div id="dots"></div>
  <div style="display:flex;gap:8px"><button class="rbtn hintbtn" id="bHint" title="Hint">💡</button></div>
</div>
<div id="board" hidden>
  <div id="pic"><span class="emo" id="emo"></span><button id="say" title="Hear the word again">🔊</button></div>
  <div id="slots"></div>
  <div id="tiles"></div>
</div>
<div id="praise"></div>

<div id="sTitle" class="screen">
  <div class="card">
    <h1 class="logo"><span>B</span><span>u</span><span>z</span><span>z</span> <span>W</span><span>o</span><span>r</span><span>d</span><span>s</span></h1>
    <div class="tag">Hear it, see it, spell it!</div>
    <div class="wallet"><div class="chip"><i>⭐</i><span class="wStars">0</span></div><div class="chip"><i>💎</i><span class="wGems">0</span></div><div class="chip"><i>📒</i><span class="wStick">0</span></div></div>
    <div class="row" style="margin-top:18px"><button class="big" id="bPlay">▶ Play</button></div>
    <div class="row">
      <button class="pill sun" id="bShop">🛍️ Shop</button>
      <button class="pill pink" id="bBook">📒 Stickers</button>
      <button class="pill sky" id="bSettings">⚙️ Grown-ups</button>
    </div>
    <div class="note" id="nowNote"></div>
  </div>
</div>

<div id="sSettings" class="screen" hidden>
  <div class="card">
    <h2>Pick the words</h2>
    <div class="ops" id="ops"></div>
    <div class="opts">
      <span>Words per round <span class="seg" id="segN"><button data-n="5">5</button><button data-n="8">8</button><button data-n="12">12</button></span></span>
      <span>Extra letters <span class="seg" id="segX"><button data-x="0">None</button><button data-x="2">2</button><button data-x="4">4</button></span></span>
    </div>
    <div class="opts">
      <label><button class="tog" id="tGhost"></button> Show the word to copy</label>
      <label><button class="tog" id="tVoice"></button> Voice</label>
      <label><button class="tog" id="tNames"></button> Say each letter</label>
    </div>
    <div class="opts">
      <label><button class="tog" id="tSound"></button> Sound</label>
      <label><button class="tog" id="tMusic"></button> Music</label>
      <span>Voice speed <span class="seg" id="segR"><button data-r="0">Slow</button><button data-r="1">Normal</button></span></span>
    </div>
    <div class="row"><button class="big" id="bSetDone">✓ Done</button></div>
    <div class="note" id="voiceNote">Turn on any mix of word sizes. Each word is picked from what's on.</div>
  </div>
</div>

<div id="sShop" class="screen" hidden>
  <div class="card">
    <h2>Shop</h2>
    <div class="wallet" style="margin-bottom:10px"><div class="chip"><i>⭐</i><span class="wStars">0</span></div><div class="chip"><i>💎</i><span class="wGems">0</span></div></div>
    <div class="tabs" id="tabs"></div>
    <div class="items" id="items"></div>
    <div class="row"><button class="big" id="bShopDone">✓ Back</button></div>
  </div>
</div>

<div id="sBook" class="screen" hidden>
  <div class="card">
    <h2>Sticker Book</h2>
    <div class="note" id="bookCount" style="margin:0 0 10px"></div>
    <div class="book" id="book"></div>
    <div class="row"><button class="big" id="bBookDone">✓ Back</button></div>
  </div>
</div>

<div id="sPause" class="screen" hidden>
  <div class="card">
    <h2>Paused</h2>
    <div class="row"><button class="big" id="bResume">▶ Keep going</button></div>
    <div class="row"><button class="pill" id="bQuit">🏠 Home</button><button class="pill sky" id="bPauseSet">⚙️ Grown-ups</button></div>
  </div>
</div>

<div id="sResult" class="screen" hidden>
  <div class="card">
    <h2 id="rTitle">Round complete!</h2>
    <div class="stars3" id="rStars"></div>
    <div class="note" id="rLine" style="margin-top:0"></div>
    <div class="loot" id="rLoot"></div>
    <div id="rWords" class="note"></div>
    <div id="rSticker"></div>
    <div class="row"><button class="big" id="bNext">▶ Next round</button></div>
    <div class="row"><button class="pill sun" id="bRShop">🛍️ Shop</button><button class="pill" id="bRHome">🏠 Home</button></div>
  </div>
</div>
<script>
"use strict";
// ============================================================================
// Buzz Words — a spelling game for kids. Canvas 2D background, DOM board, built-in speech.
// ============================================================================
const Q = new URLSearchParams(location.search), TEST = Q.has('test');
const TAU = Math.PI * 2, clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------------------
// Words with pictures
// ---------------------------------------------------------------------------
const WORDS = [
  [['cat', '🐱'], ['dog', '🐶'], ['pig', '🐷'], ['cow', '🐮'], ['fox', '🦊'], ['bee', '🐝'], ['owl', '🦉'], ['bat', '🦇'], ['ant', '🐜'], ['hen', '🐔'], ['ram', '🐏'],
   ['sun', '☀️'], ['bus', '🚌'], ['bed', '🛏️'], ['egg', '🥚'], ['box', '📦'], ['car', '🚗'], ['key', '🔑'], ['map', '🗺️'], ['web', '🕸️'], ['cap', '🧢'], ['pie', '🥧'], ['ice', '🧊'], ['hat', '🎩'], ['bow', '🎀'], ['jet', '✈️']],
  [['frog', '🐸'], ['fish', '🐟'], ['duck', '🦆'], ['bear', '🐻'], ['lion', '🦁'], ['goat', '🐐'], ['crab', '🦀'], ['deer', '🦌'], ['swan', '🦢'], ['bird', '🐦'],
   ['moon', '🌙'], ['star', '⭐'], ['tree', '🌳'], ['cake', '🍰'], ['milk', '🥛'], ['corn', '🌽'], ['kite', '🪁'], ['ship', '🚢'], ['boat', '⛵'], ['bell', '🔔'],
   ['book', '📖'], ['shoe', '👟'], ['sock', '🧦'], ['drum', '🥁'], ['rain', '🌧️'], ['snow', '❄️'], ['ring', '💍'], ['leaf', '🍁'], ['rose', '🌹'], ['fire', '🔥'], ['gift', '🎁'], ['door', '🚪'], ['tent', '⛺'], ['bike', '🚲'], ['ball', '⚽'], ['pear', '🍐']],
  [['apple', '🍎'], ['horse', '🐴'], ['tiger', '🐯'], ['zebra', '🦓'], ['snake', '🐍'], ['mouse', '🐭'], ['sheep', '🐑'], ['panda', '🐼'], ['koala', '🐨'], ['whale', '🐳'], ['shark', '🦈'],
   ['train', '🚆'], ['truck', '🚚'], ['house', '🏠'], ['clock', '⏰'], ['bread', '🍞'], ['grape', '🍇'], ['lemon', '🍋'], ['pizza', '🍕'], ['robot', '🤖'], ['heart', '❤️'], ['cloud', '☁️'],

    const grad = id === 'rainbow' ? (() => { const gg = g.createLinearGradient(40, 40, 160, 160); ['#ff8a8a', '#ffd27a', '#9af08a', '#7ac8ff', '#c79bff'].forEach((c2, i) => gg.addColorStop(i / 4, c2)); return gg; })() : (() => { const m = st[0].match(/#([0-9a-f]{6})/gi); const gg = g.createLinearGradient(0, 40, 0, 160); gg.addColorStop(0, m[0]); gg.addColorStop(1, m[1]); return gg; })();
    const hex = (dy) => { g.beginPath(); [[.25, .03], [.75, .03], [1, .5], [.75, .97], [.25, .97], [0, .5]].forEach(([x, y]) => g.lineTo(30 + x * 140, 30 + dy + y * 140)); g.closePath(); };
    g.fillStyle = st[1]; hex(10); g.fill(); g.fillStyle = grad; hex(0); g.fill(); g.fillStyle = st[2]; g.font = '900 86px "Trebuchet MS",system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('a', 100, 96); }

function buildShop() {
  const tabs = $('tabs'); tabs.innerHTML = '';

  const box = $('items'); box.innerHTML = '';
  for (const id in SHOP[shopTab].items) {
    const it = SHOP[shopTab].items[id], el = document.createElement('div'); el.className = 'item';
    const own = S.owned[shopTab][id], using = S.equip[shopTab] === id; if (using) el.classList.add('eq');
    const price = it.gems ? `💎 ${it.gems}` : `⭐ ${it.cost}`, can = it.gems ? S.gems >= it.gems : S.stars >= it.cost;
    const btn = using ? '<button class="buy got" disabled>Using</button>' : own ? '<button class="buy use">Use</button>' : `<button class="buy" ${can ? '' : 'disabled'}>${price}</button>`;
    el.innerHTML = `<img src="${iconFor(shopTab, id)}" alt=""><b>${it.name}</b><small>${it.desc}</small>${btn}`;
    el.querySelector('.buy').onclick = () => { if (using) return; if (!own) { if (!can) return; if (it.gems) S.gems -= it.gems; else S.stars -= it.cost; S.owned[shopTab][id] = 1; sfx('buy'); } else sfx('click'); S.equip[shopTab] = id; save(); buildShop(); updWallet(); };
    box.appendChild(el);
  }
}
function buildBook() { const n = Object.keys(S.stickers).length; $('bookCount').textContent = `${n} of ${STICKERS.length} collected. Finish a round to earn a new one!`; $('book').innerHTML = STICKERS.map(k => `<div class="${S.stickers[k] ? 'got' : ''}">${S.stickers[k] ? k : '?'}</div>`).join(''); }

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
$('bPlay').onclick = () => { sfx('click'); startRound(); };
$('bShop').onclick = () => { audioInit(); sfx('click'); buildShop(); show('sShop'); };
$('bBook').onclick = () => { audioInit(); sfx('click'); buildBook(); show('sBook'); };
$('bSettings').onclick = () => { audioInit(); sfx('click'); buildSettings(); show('sSettings'); };
let settingsFrom = 'sTitle';
$('bSetDone').onclick = () => { sfx('click'); if (settingsFrom === 'sPause') { settingsFrom = 'sTitle'; show('sPause'); } else show('sTitle'); };
$('bShopDone').onclick = () => { sfx('click'); show('sTitle'); };
$('bBookDone').onclick = () => { sfx('click'); show('sTitle'); };
$('bPause').onclick = () => { if (G.mode !== 'play') return; sfx('click'); G.mode = 'paused'; if (SPEECH) SPEECH.cancel(); show('sPause'); };
$('bResume').onclick = () => { sfx('click'); G.mode = 'play'; show(null); sayWord(false); };
$('bQuit').onclick = () => { sfx('click'); G.round = null; if (SPEECH) SPEECH.cancel(); show('sTitle'); };
$('bPauseSet').onclick = () => { sfx('click'); settingsFrom = 'sPause'; buildSettings(); show('sSettings'); };
$('bNext').onclick = () => { sfx('click'); startRound(); };
$('bRShop').onclick = () => { sfx('click'); buildShop(); show('sShop'); };
$('bRHome').onclick = () => { sfx('click'); show('sTitle'); };
$('pic').addEventListener('click', () => { if (G.mode === 'play') sayWord(false); });
$('say').addEventListener('click', e => { e.stopPropagation(); if (G.mode === 'play') sayWord(false); });
$('bHint').onclick = () => { if (G.mode === 'play' && !G.busy) showHint(true); };
window.addEventListener('keydown', e => {
  if (G.mode !== 'play' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (/^[a-z]$/.test(k)) { const t = [...document.querySelectorAll('.tile:not(.used)')].find(x => x.dataset.l === k) || [...document.querySelectorAll('.tile:not(.used)')][0]; if (t) { if (t.dataset.l === k) tapTile(t); else { const fake = { dataset: { l: k }, classList: { contains: () => false, remove() {}, add() {} } }; tapTile(fake); } } }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); sayWord(false); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play' && !TEST) { G.mode = 'paused'; if (SPEECH) SPEECH.cancel(); show('sPause'); } });
window.addEventListener('resize', resize);
window.BW = {
  get G() { return G; }, get S() { return S; }, WORDS, startRound, endRound, show, buildShop, buildSettings, buildBook, equip(c, id) { S.equip[c] = id; },
  state() { const R = G.round; return { mode: G.mode, word: G.word, pos: G.pos, stars: S.stars, round: R && { i: R.i, n: R.n, res: R.res.join(','), earned: R.earned }, tiles: [...document.querySelectorAll('.tile:not(.used)')].map(t => t.dataset.l).join('') }; },
  tapLetter(l) { const t = [...document.querySelectorAll('.tile:not(.used)')].find(x => x.dataset.l === l); if (t) tapTile(t); return !!t; },
  spellAll() { for (const l of G.word) this.tapLetter(l); },
};
load(); resize(); seedAmbient(); updWallet();
requestAnimationFrame(frame);
