<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Critter Puzzles</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Critter Puzzles: 100 cute animal jigsaw puzzles for kids, in easy, medium and hard.">
<style>
  :root { --ink:#3d2f4a; --soft:#7a6a8a; --paper:#fffaf2; --pink:#ff7eb0; --sun:#ffc94a; --mint:#4fd1a5; --sky:#6cc4ff; --grape:#9a7bff; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; overflow:hidden; background:#bfe6ff; color:var(--ink);
    font:700 16px/1.3 "Trebuchet MS","Avenir Next Rounded","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  button,a.btn { font:inherit; color:inherit; cursor:pointer; border:0; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  .sky { background:radial-gradient(circle at 20% 10%,#fff6c9 0,transparent 35%),linear-gradient(#9fdcff,#d9f1ff 60%,#c4efb4 60%,#9fdc86); }

  /* title */
  #sTitle { align-items:center; justify-content:center; gap:18px; padding:20px; text-align:center; }
  #sTitle h1 { margin:0; font-size:clamp(40px,9vw,84px); line-height:1; color:#fff; letter-spacing:.01em;
    text-shadow:0 4px 0 #ff7eb0,0 8px 0 #9a7bff,0 14px 24px rgba(61,47,74,.25); }
  #sTitle p { margin:0; font-size:clamp(16px,3.4vw,22px); color:var(--ink); }
  #heroWrap { width:min(78vw,420px,calc((100vh - 250px) * 1.333)); min-width:160px; aspect-ratio:4/3; border-radius:22px; border:6px solid #fff; overflow:hidden; box-shadow:0 10px 0 rgba(61,47,74,.12),0 16px 40px rgba(61,47,74,.2); background:#fff; }
  #hero { width:100%; height:100%; display:block; }
  .big { min-width:200px; padding:14px 30px; border-radius:999px; font-size:24px; color:#fff; background:linear-gradient(#ff9cc5,#ff6aa3);
    box-shadow:0 6px 0 #d94c86,0 10px 18px rgba(61,47,74,.25); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .big:active { transform:translateY(4px); box-shadow:0 2px 0 #d94c86; }
  .big.alt { background:linear-gradient(#8fe7c7,#3fc796); box-shadow:0 6px 0 #2a9a72,0 10px 18px rgba(61,47,74,.25); }
  .big.plain { background:linear-gradient(#fff,#efe8ff); color:var(--ink); box-shadow:0 6px 0 #cfc2f0,0 10px 18px rgba(61,47,74,.18); }
  #sTitle .row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }

  /* gallery */
  #sGal { background:linear-gradient(#cdeeff,#fff3e0); }
  .bar { display:flex; align-items:center; gap:10px; padding:10px 12px; padding-top:max(10px,env(safe-area-inset-top)); flex-wrap:wrap; }
  .rb { width:48px; height:48px; border-radius:50%; background:#fff; box-shadow:0 4px 0 rgba(61,47,74,.15); font-size:22px; display:inline-flex; align-items:center; justify-content:center; flex:none; text-decoration:none; }
  .rb:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(61,47,74,.15); }
  .grow { flex:1; }
  #galTitle { font-size:22px; }
  #progress { font-size:15px; color:var(--soft); }
  .seg { display:flex; background:#fff; border-radius:999px; padding:4px; box-shadow:0 4px 0 rgba(61,47,74,.12); }
  .seg button { padding:8px 14px; border-radius:999px; background:transparent; font-size:16px; line-height:1.1; text-align:center; }
  .seg button small { display:block; font-size:11px; color:var(--soft); font-weight:700; }
  .seg button.on { background:var(--sun); box-shadow:inset 0 -3px 0 rgba(0,0,0,.08); }
  .seg button.on small { color:var(--ink); }
  #grid { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 12px 24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; align-content:start; }
  .card { position:relative; background:#fff; border-radius:16px; padding:6px; box-shadow:0 5px 0 rgba(61,47,74,.12); text-align:left; }
  .card:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(61,47,74,.12); }
  .card canvas { width:100%; aspect-ratio:4/3; display:block; border-radius:11px; background:#eef6ff; }
  .card .nm { display:block; padding:5px 4px 2px; font-size:13px; line-height:1.2; }
  .card .stars { position:absolute; top:10px; right:10px; background:rgba(255,255,255,.92); border-radius:999px; padding:2px 7px; font-size:13px; }
  .card .num { position:absolute; top:10px; left:10px; background:rgba(61,47,74,.6); color:#fff; border-radius:999px; padding:1px 8px; font-size:12px; }

  /* play */
  #sPlay { background:linear-gradient(#d4f0ff,#fff4e4); }
  #cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #playBar { position:absolute; left:0; right:0; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:8px 10px; padding-top:max(8px,env(safe-area-inset-top)); pointer-events:none; }
  #playBar > * { pointer-events:auto; }
  #pTitle { background:rgba(255,255,255,.88); border-radius:999px; padding:8px 16px; font-size:17px; box-shadow:0 4px 0 rgba(61,47,74,.12); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46vw; pointer-events:none !important; }
  #pCount { background:rgba(255,255,255,.88); border-radius:999px; padding:8px 12px; font-size:15px; box-shadow:0 4px 0 rgba(61,47,74,.12); pointer-events:none !important; }
  .rb.on { background:var(--sun); }

  /* win */
  #win { position:fixed; left:50%; bottom:max(18px,env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:5; background:#fff; border-radius:24px; padding:14px 18px; text-align:center;
    box-shadow:0 8px 0 rgba(61,47,74,.12),0 16px 40px rgba(61,47,74,.25); width:min(94vw,460px); animation:pop .45s cubic-bezier(.2,1.6,.4,1); }
  #win h2 { margin:0 0 2px; font-size:30px; color:var(--pink); }
  #win p { margin:0 0 12px; font-size:17px; }
  #win .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  #win .big { min-width:0; font-size:19px; padding:11px 20px; }
  @keyframes pop { from { transform:translateX(-50%) scale(.4); opacity:0; } to { transform:translateX(-50%) scale(1); opacity:1; } }
  #pCount { white-space:nowrap; }
  @media (max-width:560px) { #pTitle { display:none; } #playBar { gap:6px; } }
  @media (max-height:460px) { #win { padding:10px 14px; } #win h2 { font-size:24px; } #win p { margin-bottom:8px; } }
</style>
</head>
<body>

<section id="sTitle" class="screen sky">
  <h1>Critter Puzzles</h1>
  <div id="heroWrap"><canvas id="hero"></canvas></div>
  <p>100 cute animal puzzles to put together!</p>
  <div class="row">
    <button class="big" id="bPlay">▶ Play</button>
    <a class="big plain" href="../index.html" data-arcade-home>🏠 Arcade Shelf</a>
  </div>
</section>

<section id="sGal" class="screen" hidden>
  <div class="bar">
    <button class="rb" id="bGalBack" aria-label="Back">⬅</button>
    <div class="grow"><div id="galTitle">Pick a puzzle</div><div id="progress"></div></div>
    <div class="seg" id="diffSeg">
      <button data-d="0">Easy<small>6 pieces</small></button>
      <button data-d="1">Medium<small>12 pieces</small></button>
      <button data-d="2">Hard<small>24 pieces</small></button>
    </div>
    <button class="rb" id="bSurprise" aria-label="Surprise me" title="Surprise me">🎲</button>
  </div>
  <div id="grid"></div>
</section>

<section id="sPlay" class="screen" hidden>
  <canvas id="cv"></canvas>
  <div id="playBar">
    <button class="rb" id="bBack" aria-label="Back to the puzzles">⬅</button>
    <div id="pTitle"></div>
    <div class="grow"></div>
    <div id="pCount"></div>
    <button class="rb" id="bPeek" aria-label="Peek at the picture" title="Peek at the picture">👀</button>
    <button class="rb" id="bHint" aria-label="Faint picture on the board" title="Faint picture on the board">🖼️</button>
    <button class="rb" id="bSound" aria-label="Sound" title="Sound">🔊</button>
  </div>
  <div id="win" hidden>
    <h2>You did it! 🎉</h2>
    <p id="winName"></p>
    <div class="row"><button class="big" id="bNextPz">Next puzzle ▶</button><button class="big plain" id="bPick">Pick another</button></div>
  </div>
</section>

<script>
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const TEST = /[?&]test\b/.test(location.search);
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------------------
// Save
// ---------------------------------------------------------------------------
const KEY = 'critterpuzzles.v1';
let S = { diff: 0, done: {}, hint: true, sound: true };
try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) S = Object.assign(S, d); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const DIFFS = [{ n: 'Easy', c: 3, r: 2 }, { n: 'Medium', c: 4, r: 3 }, { n: 'Hard', c: 6, r: 4 }];

// ---------------------------------------------------------------------------
// Drawing helpers (pictures are drawn in a 400 x 300 space)
// ---------------------------------------------------------------------------
const OL = '#4a3530';
let C = null;   // current context
function E(x, y, rx, ry, rot = 0) { C.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); }
function fillE(col, x, y, rx, ry, rot = 0, line = 0) { C.beginPath(); E(x, y, rx, ry, rot); C.fillStyle = col; C.fill(); if (line) { C.lineWidth = line; C.strokeStyle = OL; C.stroke(); } }
function shape(col, path, line = 3.2) { C.beginPath(); path(); C.fillStyle = col; C.fill(); if (line) { C.lineWidth = line; C.strokeStyle = OL; C.lineJoin = 'round'; C.lineCap = 'round'; C.stroke(); } }
function poly(pts) { C.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) C.lineTo(pts[i], pts[i + 1]); C.closePath(); }
function tube(col, path, w) { C.lineCap = 'round'; C.lineJoin = 'round'; C.beginPath(); path(); C.strokeStyle = OL; C.lineWidth = w + 6.4; C.stroke(); C.beginPath(); path(); C.strokeStyle = col; C.lineWidth = w; C.stroke(); }
function line(col, w, path) { C.beginPath(); path(); C.strokeStyle = col; C.lineWidth = w; C.lineCap = 'round'; C.lineJoin = 'round'; C.stroke(); }
function grad(y0, y1, a, b) { const g = C.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function cloud(x, y, s, col = '#fff') { C.fillStyle = col; C.beginPath(); for (const [dx, dy, r] of [[-22, 4, 14], [-6, -6, 18], [14, -2, 16], [28, 6, 11], [0, 8, 14]]) { C.moveTo(x + dx * s + r * s, y + dy * s); C.arc(x + dx * s, y + dy * s, r * s, 0, TAU); } C.fill(); }
function flower(x, y, s, col, mid = '#ffd84a') { C.fillStyle = col; for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; C.beginPath(); C.arc(x + Math.cos(a) * 4.2 * s, y + Math.sin(a) * 4.2 * s, 3.6 * s, 0, TAU); C.fill(); } C.fillStyle = mid; C.beginPath(); C.arc(x, y, 2.8 * s, 0, TAU); C.fill(); }
function star(x, y, r, col) { C.fillStyle = col; C.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; C.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } C.closePath(); C.fill(); }
function twinkle(x, y, r, col) { C.fillStyle = col; C.beginPath(); C.moveTo(x, y - r); C.quadraticCurveTo(x, y, x + r, y); C.quadraticCurveTo(x, y, x, y + r); C.quadraticCurveTo(x, y, x - r, y); C.quadraticCurveTo(x, y, x, y - r); C.fill(); }
function heart(x, y, s, col) { C.fillStyle = col; C.beginPath(); C.moveTo(x, y + 6 * s); C.bezierCurveTo(x - 9 * s, y - 1 * s, x - 5 * s, y - 8 * s, x, y - 4 * s); C.bezierCurveTo(x + 5 * s, y - 8 * s, x + 9 * s, y - 1 * s, x, y + 6 * s); C.fill(); }
function butterfly(x, y, s, col) { C.save(); C.translate(x, y); C.scale(s, s); fillE(col, -6, -4, 7, 6, -.4); fillE(col, 6, -4, 7, 6, .4); fillE(col, -5, 5, 5, 4, .4); fillE(col, 5, 5, 5, 4, -.4); fillE('#4a3530', 0, 0, 1.6, 7); C.restore(); }
function bird(x, y, s, col = '#5b8fd6') { C.save(); C.translate(x, y); C.scale(s, s); fillE(col, 0, 0, 9, 7); fillE(col, -7, -3, 5, 5); fillE('#ffb347', -12.5, -2, 3, 1.6); fillE('#222', -8, -4, 1.2, 1.2); fillE('rgba(255,255,255,.5)', 2, -1, 5, 3, -.4); C.restore(); }

// ---------------------------------------------------------------------------
// The animals. Each is drawn with its head centred at (0, 0), head radius
// about 50 and feet resting at about y = 100.
// ---------------------------------------------------------------------------
const A = [
  { id: 'kitten', name: 'Kitten', kind: 'm', fur: ['#f5a35c', '#b9b4c4', '#f7efe3', '#4b4650'], belly: '#fff4e6', ear: 'pointy', nose: 'tri', noseCol: '#f08da0', tail: 'cat', marks: ['tabby', 'tabby', null, null], whisk: 1 },
  { id: 'puppy', name: 'Puppy', kind: 'm', fur: ['#e0a96b', '#f4e3c8', '#9a6845', '#ffffff'], earCol: ['#a86f3f', '#d9a66b', '#6e4529', '#5b4a42'], belly: '#fff4e6', muzzle: '#fff4e6', ear: 'floppy', nose: 'oval', tail: 'wag', marks: [null, null, null, 'patch'] },
  { id: 'bunny', name: 'Bunny', kind: 'm', fur: ['#ffffff', '#e8d2bf', '#cbbdb2', '#f8e4ef'], belly: '#ffffff', ear: 'long', nose: 'tri', noseCol: '#f590a8', tail: 'puff', whisk: 1 },
  { id: 'bear', name: 'Bear Cub', kind: 'm', fur: ['#a8754f', '#c9925e', '#8a5f42', '#b9835a'], belly: '#ecd0a8', muzzle: '#ecd0a8', ear: 'round', nose: 'oval', tail: 'none' },
  { id: 'panda', name: 'Panda', kind: 'm', fur: ['#fbfbf6'], limb: '#2f2a2b', belly: '#ffffff', ear: 'round', earCol: ['#2f2a2b'], nose: 'oval', tail: 'none', marks: ['panda'] },
  { id: 'fox', name: 'Fox', kind: 'm', fur: ['#f28a3e', '#f39a54', '#e9773a', '#f2a04e'], limb: '#6b4430', belly: '#fff8ef', ear: 'pointy', earIn: '#5b3b2d', nose: 'oval', tail: 'fox', marks: ['fox'] },
  { id: 'raccoon', name: 'Raccoon', kind: 'm', fur: ['#a09ca6'], limb: '#5c5560', belly: '#dedae2', ear: 'pointy', earIn: '#e7e3ea', nose: 'oval', tail: 'ring', marks: ['mask'] },
  { id: 'koala', name: 'Koala', kind: 'm', fur: ['#a9aeb8'], belly: '#ebe6df', ear: 'koala', nose: 'big', tail: 'none' },
  { id: 'piglet', name: 'Piglet', kind: 'm', fur: ['#ffc4d1'], belly: '#ffd8e1', ear: 'pig', nose: 'pig', tail: 'curl' },
  { id: 'calf', name: 'Calf', kind: 'm', fur: ['#ffffff', '#f3e4cf'], belly: '#ffffff', muzzle: '#ffc6cf', ear: 'cow', nose: 'cow', tail: 'tuft', marks: ['cow', 'cowbrown'] },
  { id: 'lamb', name: 'Lamb', kind: 'm', fur: ['#f3dcc3'], wool: '#fffaf1', belly: '#fffaf1', ear: 'lamb', nose: 'small', tail: 'puff' },
  { id: 'lion', name: 'Lion Cub', kind: 'm', fur: ['#f4c467'], mane: '#de8a34', belly: '#fff1cf', muzzle: '#fff1cf', ear: 'round', nose: 'tri', noseCol: '#a35f4a', tail: 'lion' },
  { id: 'tiger', name: 'Tiger Cub', kind: 'm', fur: ['#f59b3c'], belly: '#fffaf2', muzzle: '#fffaf2', ear: 'round', nose: 'tri', noseCol: '#f08da0', tail: 'tiger', marks: ['stripes'], whisk: 1 },
  { id: 'monkey', name: 'Monkey', kind: 'm', fur: ['#8d5b3d'], face: '#f2cfa5', belly: '#f2cfa5', ear: 'monkey', nose: 'dots', tail: 'monkey', marks: ['monkey'] },
  { id: 'mouse', name: 'Mouse', kind: 'm', fur: ['#c8c3c0', '#e2cdb8'], belly: '#ffffff', ear: 'mouse', nose: 'tri', noseCol: '#f590a8', tail: 'mouse', whisk: 1 },
  { id: 'owl', name: 'Owlet', kind: 'owl', fur: ['#b07d54', '#9d8a7a'], belly: '#f3dfbf' },
  { id: 'penguin', name: 'Penguin', kind: 'penguin', fur: ['#3c4458'] },
  { id: 'chick', name: 'Chick', kind: 'chick', fur: ['#ffe066'] },
  { id: 'duckling', name: 'Duckling', kind: 'duck', fur: ['#ffd94f'] },
  { id: 'frog', name: 'Frog', kind: 'frog', fur: ['#7dd05c', '#9ad65a'] },
  { id: 'elephant', name: 'Elephant', kind: 'm', fur: ['#aab9cf'], belly: '#c5d1e2', ear: 'elephant', nose: 'trunk', tail: 'tuft' },
  { id: 'giraffe', name: 'Giraffe', kind: 'm', fur: ['#f7c95e'], belly: '#fff0c9', muzzle: '#fff0c9', ear: 'deer', nose: 'dots', tail: 'tuft', marks: ['giraffe'], neck: 1 },
  { id: 'turtle', name: 'Turtle', kind: 'turtle', fur: ['#93d57b'], shell: '#4f9e5a', shell2: '#a7da7d' },
  { id: 'hedgehog', name: 'Hedgehog', kind: 'm', fur: ['#f1d6b8'], spikes: '#8a6347', belly: '#fbead6', ear: 'round', earCol: ['#d9b48e'], nose: 'oval', tail: 'none' },
  { id: 'fawn', name: 'Fawn', kind: 'm', fur: ['#cd8d59'], belly: '#f8e7d2', muzzle: '#f8e7d2', ear: 'deer', nose: 'oval', tail: 'puff', tailCol: '#fff6ea', marks: ['fawn'] },
];

const pick = (arr, k) => arr ? arr[k % arr.length] : undefined;

function eyes(style, y = 4, dx = 19, sz = 1) {
  if (style === 'happy') { for (const s of [-1, 1]) line('#2a1f1d', 3.4, () => { C.arc(s * dx, y + 3, 7 * sz, Math.PI * 1.1, Math.PI * 1.9); }); return; }
  for (const s of [-1, 1]) {
    if (style === 'wink' && s === 1) { line('#2a1f1d', 3.4, () => { C.moveTo(s * dx - 7, y + 1); C.quadraticCurveTo(s * dx, y - 5, s * dx + 7, y + 1); }); continue; }
    fillE('#2a1f1d', s * dx, y, 7.5 * sz, 9.5 * sz);
    fillE('#fff', s * dx - 2.5 * sz, y - 3.5 * sz, 3 * sz, 3 * sz);
    fillE('#fff', s * dx + 2.5 * sz, y + 3.5 * sz, 1.4 * sz, 1.4 * sz);
  }
}
function cheeks(y = 18, dx = 33) { fillE('rgba(255,120,150,.38)', -dx, y, 9, 6); fillE('rgba(255,120,150,.38)', dx, y, 9, 6); }
function smile(y = 25, open = false) {
  if (open) { shape('#e5587a', () => { C.moveTo(-7, y - 1); C.quadraticCurveTo(0, y + 12, 7, y - 1); C.closePath(); }, 2.4); return; }
  line(OL, 2.6, () => { C.moveTo(-8, y - 2); C.quadraticCurveTo(-4, y + 3, 0, y - 1); C.quadraticCurveTo(4, y + 3, 8, y - 2); });
}

function drawMammal(a, k, pose) {
  const fur = pick(a.fur, k), limb = a.limb || fur, earCol = pick(a.earCol, k) || fur, mark = pick(a.marks, k);
  const hy = a.neck ? -38 : 0;   // giraffes hold their heads up on a neck
  // --- behind the body: tail, spikes, mane
  const tailCol = a.tailCol || fur;
  switch (a.tail) {
    case 'cat': tube(fur, () => { C.moveTo(28, 84); C.bezierCurveTo(70, 90, 76, 50, 62, 30); }, 11); break;
    case 'wag': tube(fur, () => { C.moveTo(30, 74); C.quadraticCurveTo(58, 66, 60, 44); }, 10); break;
    case 'puff': fillE(tailCol, 40, 84, 13, 12, 0, 3.2); break;
    case 'fox': case 'ring': {
      C.save(); C.translate(52, 66); C.rotate(-.7);
      fillE(a.tail === 'fox' ? fur : '#a09ca6', 0, 0, 18, 36, 0, 3.2);
      if (a.tail === 'fox') { C.save(); C.beginPath(); E(0, 0, 18, 36); C.clip(); fillE('#fff8ef', 0, -30, 20, 14); C.restore(); C.beginPath(); E(0, 0, 18, 36); C.lineWidth = 3.2; C.strokeStyle = OL; C.stroke(); }
      else { C.save(); C.beginPath(); E(0, 0, 18, 36); C.clip(); for (const y of [-24, -8, 8]) fillE('#4f4954', 0, y, 22, 5); C.restore(); C.beginPath(); E(0, 0, 18, 36); C.lineWidth = 3.2; C.strokeStyle = OL; C.stroke(); }
      C.restore(); break;
    }
    case 'tiger': tube(fur, () => { C.moveTo(28, 86); C.bezierCurveTo(66, 92, 74, 60, 66, 40); }, 10); line('#3a2a26', 3, () => { C.moveTo(60, 84); C.lineTo(66, 76); C.moveTo(68, 66); C.lineTo(76, 62); C.moveTo(68, 50); C.lineTo(76, 50); }); break;

// ---------------------------------------------------------------------------
// The 100 puzzles: 25 animals, each in four different places.
// ---------------------------------------------------------------------------
const PUZ = [];
for (let k = 0; k < 4; k++) for (let a = 0; a < A.length; a++) {
  let si = (a * 5 + k * 3) % SCENES.length;
  const sc = SCENES[si];
  const r = rng(a * 977 + k * 131 + 7);
  const buddy = (k === 2 || (k === 3 && a % 3 === 0)) ? (a + 7 + k * 3) % A.length : -1;
  PUZ.push({ a, k, si, buddy, title: sc.title(A[a].name), seed: a * 31 + k * 1013 + 1,
    pose: { prop: sc.props[(a + k) % sc.props.length], eyes: ['open', 'open', 'happy', 'open', 'wink'][(a + k * 2) % 5], open: (a + k) % 3 === 0, tilt: (r() - .5) * .16, wave: (a + k) % 4 === 1 && sc.props[(a + k) % sc.props.length] !== 'balloon', flip: false, flop: (a + k) % 2 === 1 },
    x: buddy >= 0 ? 168 + (r() - .5) * 20 : 200 + (r() - .5) * 60 });
}
function drawPuzzle(ctx, idx, W, H) {
  const p = PUZ[idx]; C = ctx; C.save(); C.scale(W / 400, H / 300);
  const ground = SCENES[p.si].draw(rng(p.seed));
  const s = 1.22;
  // soft shadow under the feet
  fillE('rgba(40,30,60,.16)', p.x, ground + 2, 58 * s, 9 * s);
  if (p.buddy >= 0) { const bx = p.x < 200 ? 300 : 100, bs = .7; fillE('rgba(40,30,60,.16)', bx, ground + 2, 50 * bs, 8 * bs); drawAnimal(p.buddy, p.k + 1, bx, ground - 98 * bs, bs, { prop: 'none', eyes: 'happy', open: true, tilt: -.06, wave: true, flip: bx < 200 }); }
  drawAnimal(p.a, p.k, p.x, ground - 98 * s, s, p.pose);
  C.restore();
}

let heroIdx = 0;
{ const opts = [9 * 0 + 4, 2, 25 + 11, 50 + 17, 0]; heroIdx = opts[(Math.random() * opts.length) | 0]; }

document.querySelectorAll('#diffSeg button').forEach(b => b.onclick = () => { S.diff = +b.dataset.d; save(); document.querySelectorAll('#diffSeg button').forEach(x => x.classList.toggle('on', x === b)); });

// ---------------------------------------------------------------------------
// The jigsaw

const cv = $('cv'), ctx = cv.getContext('2d');
let G = null;   // current puzzle
let VW = 0, VH = 0, DPR = 1;

function startPuzzle(i) {

function layout(scatter) {

    const r = G.rnd, pw2 = G.cw + G.pad * 2, ph2 = G.ch + G.pad * 2;

    const n = G.pieces.length, cols = Math.max(1, Math.round(Math.sqrt(n * tray.w / Math.max(1, tray.h)))), rows = Math.ceil(n / cols);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// the outline of one piece, in its own coordinates (cell top-left at 0,0)
function piecePath(p, P = new Path2D()) {

function buildPiece(p) {

let dirty = true;
const hitCtx = document.createElement('canvas').getContext('2d');
function hit(p, x, y) {

cv.addEventListener('pointerdown', e => {

});

  const hx = G.board.x + p.cx * G.cw, hy = G.board.y + p.cy * G.ch, tol = G.m * (S.diff === 0 ? .5 : .38);

}
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

function placePiece(p) {
  p.placed = true; const hx = G.board.x + p.cx * G.cw, hy = G.board.y + p.cy * G.ch;
  p.anim = { x0: p.x, y0: p.y, t: 0 }; sfx.snap();

}
function updateCount() { if (!G) return; const n = G.pieces.filter(p => p.placed).length; $('pCount').textContent = `🧩 ${n}/${G.pieces.length}`; }

function win() {
  if (!G || G.done) return; G.done = true;
  const prev = S.done[G.i]; S.done[G.i] = Math.max(prev === undefined ? -1 : prev, S.diff); save();
  sfx.win(); say(`You did it! ${PUZ[G.i].title}!`);
  for (let k = 0; k < 140; k++) G.confetti.push({ x: VW / 2 + (Math.random() - .5) * VW * .6, y: -20 - Math.random() * VH * .5, vx: (Math.random() - .5) * 120, vy: 80 + Math.random() * 160, r: Math.random() * TAU, vr: (Math.random() - .5) * 8, c: ['#ff6fa5', '#ffd84a', '#6cc4ff', '#4fd1a5', '#9a7bff'][k % 5], s: 5 + Math.random() * 5 });
  G.winT = 0;

}
function sparkle(x, y, n) { for (let k = 0; k < n; k++) { const a = Math.random() * TAU, v = 60 + Math.random() * 90; G.confetti.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, r: 0, vr: 0, c: ['#fff6a0', '#ffffff', '#ffd84a'][k % 3], s: 4 + Math.random() * 3, star: true, life: .7 }); } }

function roundRect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
let last = performance.now();
function frame(now) {

function draw() {
  const g = ctx, B = G.board;

  g.save(); g.shadowColor = 'rgba(61,47,74,.18)'; g.shadowBlur = 18; g.shadowOffsetY = 6; roundRect(g, B.x - 8, B.y - 8, B.w + 16, B.h + 16, 18); g.fillStyle = '#fff'; g.fill(); g.restore();
  roundRect(g, B.x, B.y, B.w, B.h, 6); g.fillStyle = '#f1ecf7'; g.fill();
  if (S.hint || G.done) { g.globalAlpha = G.done ? 1 : .22; g.drawImage(G.pic, B.x, B.y, B.w, B.h); g.globalAlpha = 1; }
  // faint slots

}
