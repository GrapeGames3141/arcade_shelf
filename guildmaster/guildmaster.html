<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heroes Sold Separately</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700;800;900&family=Grenze+Gotisch:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  /* Paper-puppet guild hall: dark stage, pinned parchment notices, oxblood curtains, brass tacks. One-column phone layout. */
  --stage: #17110f;
  --wood: #2b1d17;
  --wood-2: #3a281f;
  --parch: #efe1c0;
  --parch-2: #e2cfa4;
  --parch-ink: #2a1d14;
  --curtain: #8f2433;
  --brass: #d6a54a;
  --good: #3f8f6e;
  --bad: #b8382c;
  --light: #f3e7cf;
  --muted: #b9a585;
  --font-display: 'Grenze Gotisch', 'UnifrakturCook', Georgia, serif;
  --font-letter: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --font-ui: 'Alegreya Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stage);
  background-image:
    radial-gradient(120% 70% at 50% 0%, rgba(214, 165, 74, .10), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px),
    linear-gradient(var(--wood), var(--stage));
  color: var(--light);
  font-family: var(--font-ui);
  font-size: calc(16px * var(--ts, 1));
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
#top {
  flex: none; padding: max(10px, env(safe-area-inset-top)) 16px 8px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center;
  background: linear-gradient(#211613, rgba(33,22,19,.92)); border-bottom: 1px solid rgba(214,165,74,.25); position: relative; z-index: 3;
}
#top .tl { min-width: 0; }
#top .guild { font-family: var(--font-display); font-size: 25px; line-height: 1; color: var(--brass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .rank { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
#top .stats { display: flex; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,.35); border: 1px solid rgba(214,165,74,.3); font-size: calc(14px * var(--ts, 1)); font-weight: 700; white-space: nowrap; }
.chip.gold b { color: #f2c75a; }
.chip.debt { border-color: var(--bad); color: #ff9a8a; animation: pulse 1.2s infinite; }
.coin { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe7a0, #c9922e 70%); box-shadow: inset 0 0 0 1px #7a5418; flex: none; }
.renownbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: calc(12px * var(--ts, 1)); color: var(--muted); }
.renownbar .bar { flex: 1; height: 6px; background: rgba(0,0,0,.45); border-radius: 3px; overflow: hidden; border: 1px solid rgba(214,165,74,.2); }
.renownbar .bar i { display: block; height: 100%; background: linear-gradient(90deg, #8f2433, var(--brass)); transition: width .6s; }
.iconbtn { background: none; border: 1px solid rgba(214,165,74,.3); border-radius: 8px; width: 34px; height: 30px; display: grid; place-items: center; color: var(--muted); padding: 0; }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 16px 24px; -webkit-overflow-scrolling: touch; }
#nav {
  flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: #1b1210; border-top: 1px solid rgba(214,165,74,.25);
  padding-bottom: env(safe-area-inset-bottom); position: relative; z-index: 3;
}
#nav button { background: none; border: 0; padding: 9px 2px 8px; font-size: calc(11px * var(--ts, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); position: relative; }
#nav button b { display: block; font-family: var(--font-display); font-size: calc(19px * var(--ts, 1)); letter-spacing: 0; text-transform: none; color: var(--light); font-weight: 400; line-height: 1.1; }
#nav button[aria-current="page"] { color: var(--brass); }
#nav button[aria-current="page"] b { color: var(--brass); }
#nav button[aria-current="page"]::before { content: ''; position: absolute; top: -1px; left: 25%; right: 25%; height: 2px; background: var(--brass); }
#nav .dot { position: absolute; top: 8px; right: 22%; width: 8px; height: 8px; border-radius: 50%; background: var(--curtain); box-shadow: 0 0 0 2px #1b1210; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.05; }
.phase-head { margin: 2px 0 14px; }
.phase-head .eyebrow { font-size: calc(12px * var(--ts, 1)); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.phase-head h2 { font-size: calc(34px * var(--ts, 1)); color: var(--light); }
.phase-head p { margin: 4px 0 0; color: var(--muted); font-size: calc(15px * var(--ts, 1)); max-width: 60ch; }
.sect { margin: 22px 0 10px; font-size: calc(12px * var(--ts, 1)); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.sect::after { content: ''; flex: 1; height: 1px; background: rgba(214,165,74,.2); }

.howto { background: rgba(214,165,74,.1); border: 1px dashed rgba(214,165,74,.45); border-radius: 10px; padding: 10px 12px; margin-bottom: 18px; font-size: calc(14px * var(--ts, 1)); }
.howto b { color: var(--brass); font-size: calc(12px * var(--ts, 1)); letter-spacing: .12em; text-transform: uppercase; }
.howto ol { margin: 6px 0; padding-left: 20px; } .howto li { margin: 2px 0; } .howto span { color: var(--muted); font-size: calc(13px * var(--ts, 1)); }
/* ---- pinned notices ---- */
.notices { display: flex; flex-direction: column; gap: 16px; }
.notice {
  position: relative; background: var(--parch); color: var(--parch-ink); border-radius: 3px; padding: 14px 14px 12px 64px;
  box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 8px 18px rgba(0,0,0,.45), 0 2px 3px rgba(0,0,0,.4);
  background-image: radial-gradient(130% 90% at 30% 10%, rgba(255,250,235,.6), transparent 60%), linear-gradient(transparent 85%, rgba(120,80,30,.12));
  transform: rotate(var(--tilt, 0deg)); transition: transform .2s;
}
.notice::before { /* brass tack */
  content: ''; position: absolute; top: -6px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--brass) 55%, #6d4b16); box-shadow: 0 2px 2px rgba(0,0,0,.5);
}
.notice.open { transform: rotate(0deg); }
.notice.dim { opacity: .62; }
.notice .head { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; color: inherit; }
.seal {
  position: absolute; left: 12px; top: 14px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-size: calc(21px * var(--ts, 1)); color: rgba(255,255,255,.88); background: var(--seal, #8f2433);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), inset 2px 3px 4px rgba(255,255,255,.25), 0 2px 3px rgba(0,0,0,.35);
}
.notice h3 { font-size: calc(23px * var(--ts, 1)); color: #2a140e; padding-right: 4px; }
.notice .from { font-size: calc(13px * var(--ts, 1)); color: #6a5236; margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: calc(13px * var(--ts, 1)); padding: 2px 8px; border-radius: 4px; background: rgba(42,29,20,.08); border: 1px solid rgba(42,29,20,.18); color: #3a2a1c; font-weight: 700; }
.tag img { width: 20px; height: 20px; border-radius: 3px; margin: -2px 0 -2px -4px; }
.tag.offer { background: #2a1d14; color: #f2c75a; border-color: #2a1d14; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 8px; height: 8px; border-radius: 2px; background: rgba(42,29,20,.18); transform: rotate(45deg); }
.pips i.on { background: #a8342e; }
.pips.unknown i.on { background: #c98a5a; }
.job .pips i { background: rgba(255,255,255,.14); } .job .pips i.on { background: #e0604a; } .job .pips.unknown i.on { background: #e0a070; }
.letter { font-family: var(--font-letter); font-style: italic; font-size: calc(18px * var(--ts, 1)); line-height: 1.45; margin: 12px 0 8px -50px; padding: 12px 4px 0; border-top: 1px dashed rgba(42,29,20,.3); color: #2e1e12; }
.letter .sig { display: block; text-align: right; margin-top: 4px; font-size: calc(16px * var(--ts, 1)); }
.terms { margin-left: -50px; display: flex; flex-direction: column; gap: 12px; }
.terms label { font-size: calc(12px * var(--ts, 1)); letter-spacing: .1em; text-transform: uppercase; color: #6a5236; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.terms label b { letter-spacing: 0; text-transform: none; font-size: calc(14px * var(--ts, 1)); color: #2a1d14; }
input[type=range] { width: 100%; accent-color: var(--curtain); height: 28px; }
.split { display: flex; justify-content: space-between; font-size: calc(14px * var(--ts, 1)); color: #4a3626; margin-top: -4px; }
.split b { color: #2a1d14; }
.interest { display: flex; flex-wrap: wrap; gap: 6px; }
.face { position: relative; width: 38px; height: 38px; }
.face img { width: 38px; height: 38px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(42,29,20,.35); display: block; }
.face .b { position: absolute; right: -4px; bottom: -4px; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font-size: calc(12px * var(--ts, 1)); font-weight: 900; color: #fff; box-shadow: 0 0 0 2px var(--parch); }
.face.eager .b { background: #c23a5a; } .face.yes .b { background: var(--good); } .face.maybe .b { background: #c9922e; } .face.no .b { background: #6a5a4a; }
.face.no img { filter: grayscale(.8) brightness(.85); }
.quotes { flex-basis: 100%; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font-size: calc(14px * var(--ts, 1)); color: #3a2a1c; }
.quotes p { margin: 0; padding: 5px 8px; background: rgba(63,143,110,.12); border-radius: 4px; }
.quotes p.nah { background: rgba(168,52,46,.1); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.pbtn { border: 1.5px solid #2a1d14; background: transparent; color: #2a1d14; border-radius: 6px; padding: 7px 11px; font-size: calc(14px * var(--ts, 1)); font-weight: 700; min-height: 40px; }
.pbtn.on { background: #2a1d14; color: var(--parch); }
.pbtn:disabled { opacity: .45; cursor: not-allowed; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid #2a1d14; border-radius: 6px; overflow: hidden; }
.stepper button { border: 0; background: none; width: 36px; height: 38px; font-size: calc(18px * var(--ts, 1)); font-weight: 900; color: #2a1d14; }
.stepper span { min-width: 92px; text-align: center; font-size: calc(14px * var(--ts, 1)); font-weight: 700; }
.hint { font-size: calc(13px * var(--ts, 1)); color: #6a5236; font-style: italic; }
.actions { display: flex; gap: 8px; }
.actions .big { flex: 1; }
.big { min-height: 48px; border-radius: 8px; border: 0; font-weight: 800; font-size: calc(16px * var(--ts, 1)); letter-spacing: .02em; padding: 10px 16px; }
.big.ink { background: #2a1d14; color: var(--parch); }
.big.red { background: var(--curtain); color: #fff3e6; box-shadow: 0 3px 0 #5a1420; }
.big.brass { background: var(--brass); color: #2a1406; box-shadow: 0 3px 0 #8a6420; }
.big.ghost { background: transparent; border: 1.5px solid currentColor; }
.big:disabled { opacity: .45; cursor: not-allowed; }
.big:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }

.stamp {
  position: absolute; right: 10px; top: 10px; font-family: var(--font-display); font-size: calc(22px * var(--ts, 1)); letter-spacing: .06em; padding: 1px 10px 3px;
  border: 3px double currentColor; border-radius: 6px; transform: rotate(-11deg); opacity: .85; pointer-events: none; text-transform: uppercase;
  -webkit-mask-image: radial-gradient(circle at 30% 40%, #000 60%, rgba(0,0,0,.6) 61%, #000 75%); animation: stampIn .35s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp.posted { color: #2f7a58; } .stamp.binned { color: #a8342e; } .stamp.scouted { color: #2e5a8a; right: auto; left: 70px; top: auto; bottom: 8px; font-size: calc(16px * var(--ts, 1)); transform: rotate(4deg); }
@keyframes stampIn { from { transform: scale(2.2) rotate(-25deg); opacity: 0; } to { transform: scale(1) rotate(-11deg); opacity: .85; } }

.cta { position: sticky; bottom: -24px; margin: 18px -16px -24px; padding: 18px 16px 16px; background: linear-gradient(rgba(23,17,15,0), rgba(23,17,15,.97) 34%); z-index: 2; }
.cta .big { width: 100%; }
.cta .sub { text-align: center; font-size: calc(13px * var(--ts, 1)); color: var(--muted); margin-top: 6px; }

/* ---- board reactions ---- */
.job { background: rgba(239,225,192,.06); border: 1px solid rgba(214,165,74,.22); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.job h3 { font-size: calc(22px * var(--ts, 1)); color: var(--light); }
.job .meta { font-size: calc(13px * var(--ts, 1)); color: var(--muted); margin-top: 2px; }
.party { display: flex; gap: 6px; margin: 10px 0 6px; flex-wrap: wrap; }
.party .slot { width: 46px; height: 46px; border-radius: 50%; border: 2px dashed rgba(214,165,74,.35); display: grid; place-items: center; color: var(--muted); font-size: calc(12px * var(--ts, 1)); }
.party img { width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 0 0 2px var(--brass); animation: popIn .4s both; }
@keyframes popIn { from { transform: scale(.3); opacity: 0; } }
.react { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; margin-top: 10px; }
.anim .react { animation: rise .45s both; }
.react img { width: 40px; height: 40px; border-radius: 50%; }
.react .bub { background: var(--parch); color: var(--parch-ink); border-radius: 4px 12px 12px 12px; padding: 7px 10px; font-size: calc(15px * var(--ts, 1)); position: relative; }
.react .bub .who { font-weight: 800; font-size: calc(13px * var(--ts, 1)); display: flex; justify-content: space-between; gap: 6px; color: #5a3a22; }
.react .bub .why { font-weight: 700; font-size: calc(11px * var(--ts, 1)); letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: rgba(42,29,20,.1); }
.react.no .bub { background: #d9c8a8; opacity: .92; }
.react.flip .bub { box-shadow: 0 0 0 2px var(--brass); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.levers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lever { background: rgba(0,0,0,.25); border: 1px solid rgba(214,165,74,.3); border-radius: 8px; padding: 9px 10px; text-align: left; color: var(--light); min-height: 56px; }
.lever b { display: block; font-size: calc(15px * var(--ts, 1)); }
.lever span { font-size: calc(12px * var(--ts, 1)); color: var(--muted); }
.lever:disabled { opacity: .4; }
.sweeten { margin-top: 8px; width: 100%; background: transparent; border: 1.5px dashed var(--brass); color: var(--brass); border-radius: 8px; padding: 8px; font-weight: 800; font-size: calc(14px * var(--ts, 1)); }
.toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); background: var(--parch); color: var(--parch-ink); padding: 8px 14px; border-radius: 6px; font-weight: 800; box-shadow: 0 8px 20px rgba(0,0,0,.5); z-index: 50; animation: toast 2.8s both; max-width: min(92vw, 480px); text-align: center; font-size: calc(15px * var(--ts, 1)); pointer-events: none; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* ---- theatre ---- */
.stagebox { position: relative; border-radius: 10px; overflow: hidden; background: #000; box-shadow: 0 10px 28px rgba(0,0,0,.6), 0 0 0 2px #4a2a1a, 0 0 0 5px #24140e; }
.stagebox canvas { display: block; width: 100%; }
.hud { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 10px; }
.hud .col { display: flex; flex-direction: column; gap: 5px; }
.hud .col.mons { text-align: right; }
.unit { font-size: calc(13px * var(--ts, 1)); }
.unit .nm { display: flex; justify-content: space-between; gap: 6px; }
.unit .nm span { color: var(--muted); font-size: calc(12px * var(--ts, 1)); }
.unit .hp { height: 6px; background: rgba(0,0,0,.5); border-radius: 3px; overflow: hidden; margin-top: 2px; }
.unit .hp i { display: block; height: 100%; background: var(--good); transition: width .25s; }
.unit.low .hp i { background: #d68a2a; } .unit.out { opacity: .45; } .mons .unit .hp i { background: var(--curtain); }
.captions { margin-top: 10px; min-height: 92px; background: rgba(239,225,192,.05); border-left: 3px solid var(--brass); padding: 8px 12px; border-radius: 0 8px 8px 0; display: flex; flex-direction: column; gap: 4px; }
.captions p { margin: 0; font-family: var(--font-letter); font-size: calc(17px * var(--ts, 1)); line-height: 1.35; color: var(--muted); }
.captions p:first-child { color: var(--light); }
.captions p.twist { color: #f2c75a; }
.controls { display: flex; gap: 6px; margin-top: 10px; }
.controls button { flex: 1; min-height: 40px; background: rgba(0,0,0,.3); border: 1px solid rgba(214,165,74,.3); border-radius: 8px; color: var(--light); font-weight: 700; font-size: calc(14px * var(--ts, 1)); }
.controls button[aria-pressed="true"] { background: var(--brass); color: #2a1406; }
.intervene { position: absolute; inset: 0; background: rgba(15,10,8,.82); display: flex; flex-direction: column; justify-content: center; padding: 12px; gap: 8px; animation: rise .3s both; }
.intervene h3 { font-size: calc(24px * var(--ts, 1)); color: var(--brass); }
.intervene p { margin: 0 0 4px; font-size: calc(14px * var(--ts, 1)); color: var(--muted); }
.intervene .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.intervene button { background: var(--parch); color: var(--parch-ink); border: 0; border-radius: 6px; padding: 7px 8px; text-align: left; min-height: 52px; }
.intervene button b { display: block; font-size: calc(14px * var(--ts, 1)); }
.intervene button span { font-size: calc(12px * var(--ts, 1)); color: #6a5236; }
.intervene button:disabled { opacity: .5; }
.verdict { margin-top: 14px; position: relative; background: var(--parch); color: var(--parch-ink); border-radius: 4px; padding: 16px 14px 14px; box-shadow: 0 8px 18px rgba(0,0,0,.45); }
.verdict .stamp { position: static; display: inline-block; font-size: calc(30px * var(--ts, 1)); margin-bottom: 8px; transform: rotate(-4deg); animation-name: stampIn2; }
@keyframes stampIn2 { from { transform: scale(2.4) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-4deg); opacity: .9; } }
.stamp.win { color: #2f7a58; } .stamp.lose { color: #a8342e; } .stamp.extract { color: #8a6420; }
.verdict ul { margin: 6px 0 0; padding-left: 18px; font-size: calc(15px * var(--ts, 1)); }
.verdict li { margin: 3px 0; }

/* ---- ledger & evening ---- */
.ledger { background: var(--parch); color: var(--parch-ink); border-radius: 4px; padding: 14px; box-shadow: 0 8px 18px rgba(0,0,0,.45); font-size: calc(15px * var(--ts, 1)); }
.ledger h3 { font-size: calc(24px * var(--ts, 1)); margin-bottom: 6px; }
.ledger .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dotted rgba(42,29,20,.25); font-variant-numeric: tabular-nums; }
.ledger .row.total { border-bottom: 0; border-top: 2px solid #2a1d14; margin-top: 4px; font-weight: 800; font-size: calc(17px * var(--ts, 1)); }
.plus { color: #2f7a58; font-weight: 800; } .minus { color: #a8342e; font-weight: 800; }
.feed { display: flex; flex-direction: column; gap: 6px; font-size: calc(14px * var(--ts, 1)); }
.feed .line { background: rgba(239,225,192,.05); border-radius: 6px; padding: 7px 10px; display: flex; gap: 8px; justify-content: space-between; }
.feed .line em { color: var(--muted); font-style: italic; }
.feed .line .num { color: #f2c75a; white-space: nowrap; }
.card { background: rgba(239,225,192,.07); border: 1px solid rgba(214,165,74,.25); border-radius: 10px; padding: 14px; }
.card.drama { background: var(--parch); color: var(--parch-ink); border: 0; box-shadow: 0 8px 18px rgba(0,0,0,.45); }
.card.drama p { font-family: var(--font-letter); font-size: calc(18px * var(--ts, 1)); margin: 0 0 12px; line-height: 1.4; }
.card.drama .choices { display: flex; flex-direction: column; gap: 8px; }

  ex: ['With {partner}? My ex? Absolutely not.', "I'd rather fight the {threat} with my bare hands than share a cart with {partner}."]
});
const WHY_EXTRA = { grudge: 'Revenge', couple: 'Partner', ex: 'Ex' };

const RETURN_LINES = ['', 'SECOND REQUEST. Did you lose my letter? I suspect you lost my letter. ', 'THIRD AND FINAL REQUEST. I have now written to you more often than to my own mother. '];

const EULOGIES = [
  { label: 'Heartfelt (20g for flowers)', cost: 20, epitaph: 'They were the best of us. Mostly.', text: 'Not a dry eye in the hall. Pip cries loudest. Everyone feels a little better.', fx: 'heartfelt' },
  { label: 'Honest', epitaph: 'Died doing something stupid. Bravely.', text: 'You tell it exactly as it happened. The bards love it. Renown +2.', fx: 'honest' },
  { label: 'Roast them', epitaph: 'Never once paid for a round.', text: 'You roast them mercilessly. The brave and the drunk howl with laughter. The pious are appalled.', fx: 'roast' },
  { label: 'Skip it', epitaph: 'Gone. Unremarked. Like a sock in the laundry.', text: 'No funeral. The heroes notice. They talk about it. Morale drops.', fx: 'skip' }

/* ===================== RULES & SIMULATION (no DOM) ===================== */
const TH = 35; // acceptance threshold

function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pickH = (arr, key) => arr[Math.floor(hrand(key) * arr.length) % arr.length];

/* RNG lives in state so saves are reproducible */
function R(S) { const f = mulberry(S.seed); const v = f(); S.seed = (S.seed + 0x9E3779B1 + Math.floor(v * 1e9)) >>> 0; return v; }

function rankIndex(renown) { let r = 0; RANKS.forEach((k, i) => { if (renown >= k.at) r = i; }); return r; }
function examReady(S) { return S.rank < RANKS.length - 1 && S.renown >= RANKS[S.rank + 1].at && !(S.flags.examCooldown > S.day); }

/* ---------- heroes ---------- */
function makeHero(S, def) {
  const h = {
    id: S.nextId++, name: def.name, cls: def.cls, traits: def.traits.slice(), fear: def.fear, bio: def.bio, look: Object.assign({}, def.look),
    lvl: 1, xp: 0, gear: 0, gold: 15 + Math.floor(R(S) * 30), morale: 55 + Math.floor(R(S) * 15), status: 'ready', wound: 0, away: 0, hp: 0,
    rel: {}, heat: {}, since: {}, scars: [], titles: [], nick: null, grudge: null,
    st: { missions: 0, wins: 0, downs: 0, kills: 0, fled: 0, earned: 0 }, hist: [], joined: S.day
  };
  h.hp = heroMax(h);
  return h;
}
function fixHero(h) {
  h.heat = h.heat || {}; h.since = h.since || {}; h.scars = h.scars || []; h.titles = h.titles || []; if (h.nick === undefined) h.nick = null; if (h.grudge === undefined) h.grudge = null; h.away = h.away || 0;
}
function sfx(h, k) { let v = 0; (h.scars || []).forEach(id => { const f = SCARS[id] && SCARS[id].fx[k]; if (typeof f === 'number') v += f; else if (f) v = true; }); return v; }
function heroMax(h) { return Math.round(CLASSES[h.cls].hp + (h.lvl - 1) * 9 + h.gear * 5 + sfx(h, 'hp')); }
function heroAtk(h) { return CLASSES[h.cls].atk + (h.lvl - 1) * 1.4 + h.gear * 1.6 + sfx(h, 'atk'); }
function heroDef(h) { return CLASSES[h.cls].def + (h.lvl - 1) * 0.6 + h.gear * 1.3 + sfx(h, 'def'); }
function heroPower(h) { return 0.6 + 0.55 * h.lvl + 0.3 * h.gear; }
function has(h, t) { return h.traits.includes(t); }
function xpNeed(h) { return 60 * h.lvl; }
function alive(S) { return S.heroes.filter(h => h.status !== 'dead' && h.status !== 'gone'); }
function byName(S, n) { return S.heroes.find(h => h.name === n); }
function label(h) { if (!h.nick) return h.name; return h.nick.pre ? `${h.nick.t} ${h.name}` : `${h.name} ${h.nick.t}`; }
function setRel(a, b, kind) {
  if (kind === 'crush') { a.rel[b.name] = 'crush'; return; }
  a.rel[b.name] = kind; b.rel[a.name] = kind;
}
const LOVE = ['couple', 'married'];
function addXp(S, h, n, notes) {
  h.xp += n; let ups = 0;
  while (h.xp >= xpNeed(h)) {
    h.xp -= xpNeed(h); h.lvl++; ups++;
    if (h.lvl === SIG_LEVEL && notes) notes.push(`${h.name} learned a signature move: ${sigOf(h).name}. Will not shut up about it.`);
  }
  if (ups) { h.hp = Math.min(heroMax(h), h.hp + 9 * ups); if (notes) notes.push(`${h.name} reached level ${h.lvl}. Insufferable about it.`); }
  return ups;
}
function giveTitle(S, h, title, notes, why) {
  if (h.titles.some(t => t.t === title.t)) return;
  h.titles.push(title); h.nick = title;
  const msg = `${h.name} is now known as ${label(h)}${why ? '. ' + why : '.'}`;
  hist(h, S, `Earned the name "${title.t}".`);
  if (notes) notes.push(msg);
  note(S, msg, 'good');
}
function addScar(S, h, by, notes) {
  if (h.scars.length >= 2) return null;
  let id = SCAR_BY[by];
  if (!id || h.scars.includes(id)) { const pool = ['eye', 'limp', 'scar'].filter(x => !h.scars.includes(x)); if (!pool.length) return null; id = rpick(S, pool); }
  const sc = SCARS[id];
  const before = heroMax(h);
  h.scars.push(id); h.nick = { t: sc.t, pre: !!sc.pre, scar: id };
  h.hp = clamp(h.hp + (heroMax(h) - before), 1, heroMax(h));
  const msg = `${h.name} is now ${label(h)}: ${sc.name.toLowerCase()}. ${sc.desc}`;
  hist(h, S, `${sc.name}. Now called "${sc.t}".`);

}
function note(S, text, kind) { S.log.unshift({ day: S.day, text, kind: kind || 'info' }); if (S.log.length > 220) S.log.length = 220; }
function hist(h, S, text) { h.hist.unshift(`Day ${S.day}: ${text}`); if (h.hist.length > 14) h.hist.length = 14; }

/* ---------- new game & saves ---------- */
function newGame(seed) {
  const S = {
    v: 3, seed: (seed || (Date.now() & 0xffffffff)) >>> 0, day: 1, gold: 300, renown: 0, rank: 0, phase: 'morning', nextId: 1, nextPid: 1,
    heroes: [], recruitsUsed: [], petitions: [], recent: [], hall: { tavern: 1, smithy: 1, yard: 0, infirmary: 0, board: 1 },
    clients: {}, returns: [], chainQ: [], log: [], flags: { romanceQ: [], funeralQ: [] }, stats: { wins: 0, losses: 0, deaths: 0, earned: 0, days: 0 }, debtNights: 0,
    today: null, missionIdx: 0, evening: null, won: false
  };
  START_HEROES.forEach(d => S.heroes.push(makeHero(S, d)));
  START_RELATIONS.forEach(([a, b, k]) => setRel(byName(S, a), byName(S, b), k));
  startDay(S);
  note(S, 'You inherit the guild. Nobody threw a party. Nobody showed up to the one you threw.', 'big');
  return S;
}
function migrate(S) {
  if (!S) return null;
  if (S.v === 2) {
    S.v = 3; S.rank = Math.min(3, rankIndex(S.renown)); S.clients = {}; S.returns = []; S.chainQ = [];
    S.flags = S.flags || {}; S.won = !!S.won;
  }
  if (S.v !== 3) return null;
  S.flags.romanceQ = S.flags.romanceQ || []; S.flags.funeralQ = S.flags.funeralQ || [];
  S.clients = S.clients || {}; S.returns = S.returns || []; S.chainQ = S.chainQ || [];
  S.heroes.forEach(fixHero);
  if (S.today) { S.today.payouts = S.today.payouts || 0; S.today.costs = S.today.costs || 0; S.today.queue = S.today.queue || []; }
  return S;
}

/* ---------- petitions ---------- */
function scoutCost(S, p) { return Math.round((8 + 5 * p.danger) * (1 - 0.2 * (S.hall.board - 1))); }
const POTION_PRICE = 10;
function cutGold(p) { return Math.round(p.offer * p.cutPct / 100); }
function client(S, name) { return S.clients[name] || (S.clients[name] = { done: 0, snub: 0, fail: 0 }); }

function petitionWeight(S, p, season) {
  let w = 1;
  if (season.id === 'slime' && p.threat === 'Slime') w *= 4;
  if (season.id === 'moon' && (p.threat === 'Wolf' || p.threat === 'Werewolf')) w *= 3;
  if (season.id === 'moon' && p.id === 'gerald') w *= 3;
  if (season.id === 'festival' && (p.src === 'Villagers' || ['maypole', 'lanterns', 'bard', 'bardduel'].includes(p.id))) w *= 3;
  if (season.id === 'tax' && p.src === 'The Crown') w *= 3;
  return w;
}
function startDay(S) {
  S.phase = 'morning';
  S.today = { posted: [], reactions: [], parties: {}, queue: [], results: [], speech: false, round: false, payouts: 0, costs: 0, income: 0 };
  S.missionIdx = 0; S.evening = null;
  const rank = S.rank, season = seasonOf(S.day);
  const n = 3 + S.hall.board;
  const chosen = [];
  // pinned: exam, chain chapters and repeat letters that are due
  if (examReady(S)) chosen.push({ t: EXAMS[S.rank], exam: true });
  S.chainQ.filter(c => c.day <= S.day).slice(0, 2).forEach(c => { chosen.push({ t: PETITIONS.find(p => p.id === c.id), returns: c.count || 0 }); });
  S.chainQ = S.chainQ.filter(c => !chosen.some(x => x.t && x.t.id === c.id));
  S.returns.filter(r => r.day <= S.day).slice(0, 2).forEach(r => { const t = PETITIONS.find(p => p.id === r.id); if (t && !chosen.some(x => x.t.id === t.id)) chosen.push({ t, returns: r.count }); });
  S.returns = S.returns.filter(r => !chosen.some(x => x.t.id === r.id));
  if (S.flags.treasure) { chosen.push({ t: PETITIONS.find(p => p.id === 'treasure') }); S.flags.treasure = false; }
  const cap = S.day === 1 ? 2 : S.day === 2 ? 3 : 5;
  const ok = p => !p.special && (p.minRank || 0) <= rank && p.danger <= cap && !(S.clients[p.client] && S.clients[p.client].offended) && !chosen.some(x => x.t.id === p.id);
  let pool = PETITIONS.filter(p => ok(p) && !S.recent.includes(p.id));
  if (pool.length < n) { S.recent = S.recent.slice(-4); pool = PETITIONS.filter(p => ok(p) && !S.recent.includes(p.id)); }
  const target = Math.max(n, chosen.length + 2);
  let guard = 0;
  while (chosen.length < target && pool.length && guard++ < 200) {
    const p = wpick(S, pool, x => petitionWeight(S, x, season));
    const deadly = chosen.filter(c => c.t.danger >= 4).length;
    if (p.danger >= 4 && (deadly >= 1 || (S.day < 3 && R(S) < 0.6))) continue;
    if (!chosen.some(c => c.t.id === p.id)) chosen.push({ t: p });
  }
  if (season.id === 'slime' && !chosen.some(c => c.t.threat === 'Slime')) { const sl = PETITIONS.filter(p => ok(p) && p.threat === 'Slime'); if (sl.length) chosen.push({ t: rpick(S, sl) }); }

}
function makePetition(S, t, o) {
  o = o || {};

  const cl = S.clients[t.client];
  let mult = (1 + 0.12 * (S.hall.board - 1)) * (1 + 0.07 * rank);
  if (cl && cl.done) mult *= 1 + 0.08 * Math.min(4, cl.done);
  if (o.returns) mult *= Math.pow(0.85, o.returns);
  if (season.id === 'tax' && t.src === 'The Crown') mult *= 1.3;
  if (t.exam) mult = 1 + 0.12 * (S.hall.board - 1);
  const p = Object.assign({}, t, { uid: S.nextPid++, offer: Math.round(t.offer * mult / 5) * 5, status: 'new', cutPct: 60, potions: 0, downplay: false, scouted: false, returns: o.returns || 0 });
  if (o.returns) p.letter = RETURN_LINES[Math.min(2, o.returns)] + t.letter;
  const ch = chainOf(t.id); if (ch) { p.chain = ch.key; p.chapter = ch.i + 1; p.chapters = ch.n; }
  p.regular = cl ? cl.done : 0;
  p.actualThreat = t.threat; p.actualDanger = t.danger;
  if (t.exam || (ch && ch.i > 0)) return p; // exams and later chapters are exactly as described
  if (t.twist && R(S) < t.twist.chance) { p.actualThreat = t.twist.threat; p.actualDanger = clamp(t.danger + t.twist.dd, 1, 5); }
  else { const r = R(S); if (r < 0.2) p.actualDanger = clamp(t.danger + 1, 1, 5); else if (r < 0.3) p.actualDanger = clamp(t.danger - 1, 1, 5); }

}
function perceived(p) {

  return { threat: base.threat, danger: Math.max(1, base.danger - (p.downplay ? 1 : 0)) };
}
function expectedSize(p) { return Math.max(1, Math.min(p.cap, perceived(p).danger)); }
function perHead(p) { return Math.round(cutGold(p) / expectedSize(p)); }

/* letters you ignored come back, angrier and cheaper */
function processSnubs(S) {
  const out = [];
  S.petitions.forEach(p => {
    if (p.status !== 'binned' && p.status !== 'expired') return;
    if (p.exam) return;
    const cl = client(S, p.client); cl.snub++;
    if (p.chain) { S.chainQ.push({ id: p.id, day: S.day + 3, count: Math.min(2, p.returns + 1) }); return; }
    if (p.special) return;
    if (p.returns >= 2) {
      cl.offended = true; S.renown = Math.max(0, S.renown - 2);
      const m = `${p.client} has given up on you after three letters and is telling everyone at the market. Renown −2.`;
      out.push(m); note(S, m, 'bad');
    } else if (R(S) < 0.45 && !S.returns.some(r => r.id === p.id)) {
      S.returns.push({ id: p.id, count: p.returns + 1, day: S.day + 2 });
    }
  });
  return out;
}

/* ---------- hero decisions ---------- */
function evaluate(S, h, p, partyNames) {
  const pv = perceived(p);
  const per = perHead(p);
  const fair = 18 + 14 * h.lvl;
  const parts = [];
  const grudge = h.grudge && h.grudge === pv.threat;
  let pay = (per / fair - 1) * 50;
  if (has(h, 'Greedy')) pay *= pay > 0 ? 1.7 : 1.5;
  if (has(h, 'Arrogant') && pay < 0) pay *= 1.3;
  if (grudge && pay < 0) pay *= 0.4;
  parts.push(['pay', pay]);
  parts.push(['glory', p.renown * 1.6 * (has(h, 'Brave') ? 1.6 : 1) * (has(h, 'Arrogant') ? 1.2 : 1) * (has(h, 'Cowardly') ? 0.6 : 1)]);
  const comfort = 1 + heroPower(h);
  let dm = 1;
  if (has(h, 'Cowardly')) dm = 2.0; if (has(h, 'Brave')) dm = Math.min(dm, 0.55); if (has(h, 'Reckless')) dm = Math.min(dm, 0.35); if (has(h, 'Lucky')) dm *= 0.85;
  parts.push(['danger', -(Math.max(0, pv.danger - comfort) * 22 * dm + pv.danger * 3)]);
  if (pv.threat === h.fear) parts.push(['fear', has(h, 'Brave') ? -40 : -58]);
  if (grudge) parts.push(['grudge', 30]);
  if (has(h, 'Lazy')) parts.push(['lazy', -(12 + (p.type === 'Explore' ? 8 : 0) + pv.danger * 2)]);
  if (has(h, 'Arrogant') && pv.danger <= 2 && p.renown < 8) parts.push(['arrogant', -16]);
  if (p.perk === 'flirty' && has(h, 'Romantic')) parts.push(['flirty', 18]);
  if (p.perk === 'booze' && has(h, 'Drunkard')) parts.push(['booze', 22]);
  if ((p.perk === 'undead' || MONSTERS[pv.threat].undead) && has(h, 'Pious')) parts.push(['undead', 18]);
  if ((p.perk === 'mystery' || p.type === 'Explore') && has(h, 'Curious')) parts.push(['curious', p.perk === 'mystery' ? 17 : 8]);
  if (seasonOf(S.day).id === 'festival') parts.push(['lazy', -5]);
  parts.push(['morale', (h.morale - 55) * 0.35]);
  const r = h.hp / heroMax(h);
  if (r < 0.75) parts.push(['hurt', -(0.75 - r) * 90]);
  (partyNames || []).forEach(n => {
    const k = h.rel[n];
    if (k === 'rival') parts.push(['rival', -75, n]);
    if (k === 'ex') parts.push(['ex', -55, n]);
    if (k === 'crush') parts.push(['crush', 24, n]);
    if (LOVE.includes(k)) parts.push(['couple', 30, n]);
    if (k === 'friend') parts.push(['friend', has(h, 'Loyal') ? 20 : 12, n]);
  });
  const noise = (hrand(`${S.day}|${h.id}|${p.uid}`) - 0.5) * 14;
  const score = 32 + noise + parts.reduce((a, b) => a + b[1], 0);
  return { score, parts, per, pv };
}
function mood(score) { return score >= 58 ? 'eager' : score >= TH ? 'yes' : score >= 22 ? 'maybe' : 'no'; }

function reasonKey(ev, accepted) {
  const parts = ev.parts.slice();
  if (accepted) {
    const pos = parts.filter(x => x[1] > 0 && x[0] !== 'morale').sort((a, b) => b[1] - a[1]);
    const top = pos[0];
    if (!top || top[1] < 7) return { key: 'general' };
    const map = { pay: 'pay', glory: 'glory', flirty: 'flirty', booze: 'booze', undead: 'undead', curious: 'curious', crush: 'crush', friend: 'friend', grudge: 'grudge', couple: 'couple' };
    return { key: map[top[0]] || 'general', who: top[2] };
  }
  const neg = parts.filter(x => x[1] < 0).sort((a, b) => a[1] - b[1]);
  const top = neg[0];
  if (!top || top[1] > -8) return { key: 'refuse' };
  const map = { pay: 'lowpay', danger: 'danger', fear: 'fear', lazy: 'lazy', arrogant: 'arrogant', hurt: 'hurt', morale: 'morale', rival: 'rival', ex: 'ex' };
  return { key: map[top[0]] || 'refuse', who: top[2] };
}
function quipFor(S, h, p, ev, accepted) {
  const rk = reasonKey(ev, accepted);
  const own = HERO_QUIPS[h.name] && HERO_QUIPS[h.name][rk.key];
  const pool = own && hrand(`own${S.day}${h.id}${rk.key}`) < 0.7 ? own : (QUIPS[rk.key] || QUIPS.general);
  const text = fill(pickH(pool, `${S.day}|${h.id}|${p ? p.uid : 0}|${rk.key}`), {
    gold: ev.per, threat: mname(ev.pv.threat), client: p ? p.client : '', crush: rk.who || '', rival: rk.who || '', friend: rk.who || '', partner: rk.who || ''
  });
  return { key: rk.key, text };
}

function readyHeroes(S) { return S.heroes.filter(h => h.status === 'ready'); }
function formParties(S) {
  const posted = S.petitions.filter(p => p.status === 'posted');
  const heroes = readyHeroes(S);
  const parties = {}; posted.forEach(p => { parties[p.uid] = []; });
  const assigned = new Map();
  const pairs = [];
  heroes.forEach(h => posted.forEach(p => { const ev = evaluate(S, h, p, []); if (ev.score >= TH) pairs.push({ h, p, ev }); }));
  pairs.sort((a, b) => b.ev.score - a.ev.score);
  pairs.forEach(({ h, p }) => {
    if (assigned.has(h.id)) return;
    const party = parties[p.uid];
    if (party.length >= p.cap) return;
    if (party.find(o => h.rel[o.name] === 'rival' || h.rel[o.name] === 'ex')) return;
    party.push(h); assigned.set(h.id, { p });
  });
  heroes.forEach(h => {
    if (assigned.has(h.id)) return;
    let best = null;
    posted.forEach(p => {
      const party = parties[p.uid];
      if (party.length >= p.cap || party.length === 0) return;
      const ev = evaluate(S, h, p, party.map(o => o.name));
      if (ev.score >= TH && (!best || ev.score > best.ev.score)) best = { p, ev };
    });
    if (best) { parties[best.p.uid].push(h); assigned.set(h.id, best); }
  });
  const reactions = heroes.map(h => {
    const a = assigned.get(h.id);
    if (a) {
      const party = parties[a.p.uid].filter(o => o !== h).map(o => o.name);
      const ev = evaluate(S, h, a.p, party);
      return Object.assign({ hid: h.id, pid: a.p.uid, ok: true, score: ev.score }, quipFor(S, h, a.p, ev, true));
    }
    let best = null;
    posted.forEach(p => { const ev = evaluate(S, h, p, parties[p.uid].map(o => o.name)); if (!best || ev.score > best.ev.score) best = { p, ev }; });
    if (!best) return { hid: h.id, pid: null, ok: false, key: 'refuse', text: 'Nothing posted. Back to the tavern.', score: 0 };
    return Object.assign({ hid: h.id, pid: best.p.uid, ok: false, score: best.ev.score }, quipFor(S, h, best.p, best.ev, false));
  });
  const out = {}; Object.keys(parties).forEach(k => { out[k] = parties[k].map(h => h.id); });
  return { parties: out, reactions };
}

/* ---------- missions ---------- */
function makeMon(kind, mult, i) {
  const m = MONSTERS[kind];

function monsterTurn(S, M, m, ev, R3) {
  const mk = MONSTERS[m.kind];
  if (m.stun > 0) { m.stun--; ev.push({ t: 'cap', text: `The ${m.name.toLowerCase()} is still seeing stars.` }); return; }
  const targets = targetable(M);
  if (!targets.length) return;
  if (m.kind === 'Dragon' && R3 === 0) {
    const list = targets.map(t => { const d = dmgRoll(S, m.atk * 0.6, t.def, 1); t.hp = Math.max(0, t.hp - d); return { dst: t.key, n: d, hp: t.hp, t }; });
    ev.push({ t: 'breath', src: m.key, list: list.map(({ dst, n, hp }) => ({ dst, n, hp })), text: NARR.breath[0] });
    list.forEach(({ t }) => { if (t.hp <= 0) downHero(S, M, t, 'Dragon', ev); });
    return;
  }
  if ((mk.special === 'raise' || mk.special === 'summon') && R3 === 0 && M.mons.filter(x => x.alive).length < 4) {
    const kind = mk.special === 'raise' ? 'Skeleton' : 'Goblin';
    const nm = makeMon(kind, 0.75 + 0.1 * M.danger, M.nextKey++);
    M.mons.push(nm);
    ev.push({ t: 'summon', src: m.key, mon: { key: nm.key, kind, name: nm.name, hp: nm.hp, maxhp: nm.maxhp }, text: kind === 'Skeleton' ? rpick(S, ['The necromancer waves a hand and a skeleton climbs out of the floor. It looks embarrassed.', 'The necromancer raises another skeleton. Admission is extra.']) : rpick(S, ['The Goblin King bangs his saucepan. Another goblin answers the call.', 'The Goblin King summons a loyal subject. The subject wants dental.']) });
    return;
  }
  if (mk.special === 'song' && M.round % 2 === 0) {
    const song = rpick(S, ['despair', 'diss', 'lullaby']);
    const deaf = targets.filter(t => scarHas(t, 'nosong'));
    if (song === 'despair') {
      ev.push({ t: 'song', src: m.key, text: 'The bard plays "Ballad of Your Inevitable Failure". Everyone hits a bit softer.' });
      targets.forEach(t => { if (!scarHas(t, 'nosong')) t.buff = Math.max(0.6, t.buff - 0.2); });
      if (deaf.length) ev.push({ t: 'cap', text: `${deaf.map(x => x.name).join(' and ')} can't hear a thing. Bliss.` });
    } else if (song === 'diss') {
      const t = rpick(S, targets);
      ev.push({ t: 'song', src: m.key, dst: t.key, text: `The bard performs a diss track about ${t.name}. It rhymes "${t.name}" with "smells". Devastating.` });
      if (!scarHas(t, 'nosong') && !hasT(t, 'Brave') && R(S) < 0.35) { t.fled = true; ev.push({ t: 'flee', who: t.key, text: `${t.name} runs off in tears.` }); }
    } else {
      const t = rpick(S, targets);
      ev.push({ t: 'song', src: m.key, dst: t.key, text: `The bard plays a lullaby. ${scarHas(t, 'nosong') ? `${t.name} can't hear it.` : `${t.name} has a little nap.`}` });
      if (!scarHas(t, 'nosong')) t.stuck = 1;
    }
    return;
  }
  const swings = mk.special === 'frenzy' ? 2 : 1;
  for (let s = 0; s < swings; s++) {
    const tg = targetable(M); if (!tg.length) return;
    const war = tg.find(t => t.cls === 'Warrior');
    let tgt = war && R(S) < 0.55 ? war : rpick(S, tg);
    let mult = 1, text = null, extra = null, style = 'melee';
    if (m.kind === 'Ogre' && R3 === 2) { mult = 1.8; text = rpick(S, NARR.ogreSmash); }
    if (mk.caster) { style = 'magic'; text = `The necromancer flings a bolt of grave-light at {b}. ${'{n}'} damage.`; }
    if (mk.special === 'steal' && !scarHas(tgt, 'nosteal') && R(S) < 0.2) { const n = 5 + Math.floor(R(S) * 12); M.stolen[tgt.id] = (M.stolen[tgt.id] || 0) + n; extra = { t: 'cap', text: fill(NARR.steal[0], { b: tgt.name, n }) }; mult = 0.6; }
    if (mk.special === 'spook' && R(S) < 0.22) {
      ev.push({ t: 'spook', src: m.key, dst: tgt.key, text: fill(NARR.spook[0], { b: tgt.name }) });
      if (scarHas(tgt, 'nospook')) { ev.push({ t: 'cap', text: `${tgt.name} has seen worse. ${tgt.name} yawns.` }); return; }
      if (!hasT(tgt, 'Brave') && !hasT(tgt, 'Pious') && R(S) < (hasT(tgt, 'Cowardly') ? 0.85 : 0.4)) { tgt.fled = true; ev.push({ t: 'flee', who: tgt.key, text: fill(rpick(S, NARR.flee), { a: tgt.name }) }); }
      return;
    }
    if (mk.special === 'engulf' && !scarHas(tgt, 'noengulf') && R(S) < 0.2) { tgt.stuck = 1; mult = 1.2; text = fill(rpick(S, NARR.engulf), { b: tgt.name }); }
    if (mk.special === 'charm' && !scarHas(tgt, 'nocharm') && R(S) < (hasT(tgt, 'Romantic') ? 0.5 : hasT(tgt, 'Pious') ? 0.08 : 0.25)) {
      tgt.charmed = 1; ev.push({ t: 'charm', src: m.key, dst: tgt.key, text: fill(rpick(S, NARR.charm), { b: tgt.name }) }); return;
    }
    const d = dmgRoll(S, m.atk, tgt.def, mult);
    const shown = M.guard && M.guard !== tgt.key ? M.heroes.find(x => x.key === M.guard) : tgt;
    const txt = M.guard && shown !== tgt ? `${shown.name} takes the hit meant for ${tgt.name}. Still asleep, possibly.` : text ? fill(text, { b: tgt.name, n: d }) : fill(rpick(S, (NARR.by[m.kind] && R(S) < 0.6) ? NARR.by[m.kind] : NARR.monHit), { a: m.name.toLowerCase(), b: tgt.name, n: d });
    const hit = hitHero(S, M, m, tgt, d, ev, { style, text: txt });
    if (extra) ev.push(extra);
    if (d > hit.maxhp * 0.16 && hit.hp > 0 && R(S) < 0.35) ev.push({ t: 'bark', who: hit.key, text: rpick(S, (BARKS[hit.name] && R(S) < 0.4) ? BARKS[hit.name] : BARKS.hurt) });
  }
}
function checkEnd(S, M, ev) {
  if (M.done) return;
  const party = M.heroes.filter(h => !h.fled).map(h => h.name).join(', ') || 'Nobody';
  if (M.mons.every(m => !m.alive)) { M.done = true; M.result = 'win'; ev.push({ t: 'end', result: 'win', text: fill(rpick(S, NARR.win), { party }) }); }
  else if (!standing(M).length) { M.done = true; M.result = 'lose'; ev.push({ t: 'end', result: 'lose', text: rpick(S, NARR.lose) }); }
  else if (M.round >= 14) { M.done = true; M.result = 'lose'; ev.push({ t: 'end', result: 'lose', text: NARR.stalemate[0] }); }
}

function interventionCosts(M) { return { pigeon: 12 + 6 * M.danger, teleport: 15 + 7 * M.danger }; }
function intervene(S, M, choice) {
  M.intervened = true; M.pending = false;
  const c = interventionCosts(M); const ev = [];
  if (choice === 'pigeon') {
    S.gold -= c.pigeon; S.today.costs += c.pigeon;
    ev.push({ t: 'cap', text: 'A pigeon arrives carrying potions and an attitude. It drops them on everyone. Mostly on their heads.' });
    M.heroes.forEach(h => {
      if (h.fled) return;
      if (h.down) { h.down = false; h.hp = Math.round(h.maxhp * 0.25); ev.push({ t: 'revive', who: h.key, hp: h.hp, text: `${h.name} gets back up, smelling of pigeon.` }); }
      else { const n = Math.round(h.maxhp * 0.35); h.hp = Math.min(h.maxhp, h.hp + n); ev.push({ t: 'heal', src: h.key, dst: h.key, n, hp: h.hp, potion: true }); }
    });
  } else if (choice === 'teleport') {
    S.gold -= c.teleport; S.today.costs += c.teleport;
    M.done = true; M.result = 'extract';
    ev.push({ t: 'cap', text: 'The teleport scroll works! Everyone lands in the guild hall. One of them lands in the soup.' });
    ev.push({ t: 'end', result: 'extract', text: 'Mission abandoned. Bodies intact. Pride less so.' });
  } else if (choice === 'speech') {
    if (R(S) < 0.55) {
      standing(M).forEach(h => { h.buff = Math.min(1.8, h.buff + 0.3); });
      ev.push({ t: 'cap', text: "You bellow something inspiring from the back row. Nobody heard the words, but the tone was perfect. Everyone hits harder." });
      standing(M).forEach(h => ev.push({ t: 'bark', who: h.key, text: rpick(S, ['FOR THE GUILD!', "What'd they say?", 'YEAH! ...Yeah?', 'Inspired! Probably!']) }));
    } else {
      const coward = standing(M).sort((a, b) => (hasT(b, 'Cowardly') ? 1 : 0) - (hasT(a, 'Cowardly') ? 1 : 0))[0];
      ev.push({ t: 'cap', text: `You yell "DON'T RETREAT!" ${coward ? coward.name + ' only hears the last word.' : ''}` });
      if (coward && !scarHas(coward, 'noflee')) { coward.fled = true; ev.push({ t: 'flee', who: coward.key, text: `${coward.name} retreats, as instructed. Sort of.` }); }
    }
  } else {
    if (R(S) < 0.12) { standing(M).forEach(h => { h.buff = Math.min(1.8, h.buff + 0.15); }); ev.push({ t: 'cap', text: 'You pour a drink and stare. Your silent judgment somehow inspires them.' }); }
    else ev.push({ t: 'cap', text: 'You pour yourself a drink and watch. Bravely. From a great distance.' });
  }
  checkEnd(S, M, ev);
  return ev;
}

function autoResolve(S, M, p, events) {
  let guard = 0;
  while (!M.done && guard++ < 40) { const ev = stepMission(S, M, p); if (events) events.push(...ev); if (M.pending) { M.pending = false; M.intervened = true; } }
}

const LOOT = ['a jewelled goblet', "a duke's monogrammed undergarments", 'a cursed (but valuable) spoon', 'a sack of teeth (gold ones)', 'a small painting of a large horse', 'a love letter worth blackmail money', 'an ornate helmet with a mouse living in it'];

function settleMission(S, p, M) {
  const party = M.heroes.map(mh => ({ mh, h: S.heroes.find(h => h.id === mh.id) }));
  const out = { pid: p.uid, title: p.title, client: p.client, result: M.result, lines: [], payout: 0, net: 0, renown: 0, deaths: [], wounded: [], ups: [], rankUp: null };
  const notes = [];
  party.forEach(({ mh, h }) => { h.hp = Math.max(0, Math.round(mh.hp)); h.st.missions++; });
  const stay = party.filter(x => !x.mh.fled);
  const fled = party.filter(x => x.mh.fled);
  const lied = p.downplay && p.actualDanger >= p.danger;
  const cl = client(S, p.client);
  if (M.result === 'win') {
    const cut = cutGold(p);
    S.gold += p.offer; S.today.income += p.offer;
    const recips = stay.length ? stay : party;
    const share = Math.floor(cut / recips.length);
    recips.forEach(({ h }) => { h.gold += share; h.st.earned += share; h.st.wins++; });
    S.gold -= share * recips.length; S.today.payouts += share * recips.length;
    out.payout = share * recips.length; out.net = p.offer - out.payout;
    S.renown += p.renown; out.renown = p.renown; S.stats.wins++; S.stats.earned += out.net;
    cl.done++;
    out.lines.push(`${p.client} pays ${p.offer}g. Heroes take ${out.payout}g (${share}g each). The guild keeps ${out.net}g.`);
    if (cl.done === 3) out.lines.push(`${p.client} is now a regular. Their letters will pay better.`);
    if (fled.length) out.lines.push(`${fled.map(x => x.h.name).join(' and ')} fled, so their share went to the people who stayed. Cowards' tax.`);
    if (R(S) < 0.25) {
      const v = Math.round((10 + R(S) * 30) * p.actualDanger / 2) * 2;
      const item = rpick(S, LOOT); const each = Math.floor(v / recips.length);
      recips.forEach(({ h }) => { h.gold += each; });
      out.lines.push(`They also found ${item} and sold it for ${v}g. The guild was not consulted.`);
    }
    stay.forEach(({ mh, h }) => {
      addXp(S, h, 15 * p.actualDanger + 4 * mh.kills, notes); h.morale = clamp(h.morale + 12, 0, 100); h.st.kills += mh.kills; hist(h, S, `Won "${p.title}".`);
      if (h.grudge && M.mons.some(m => m.kind === h.grudge)) { const g = h.grudge; h.grudge = null; h.morale = clamp(h.morale + 15, 0, 100); giveTitle(S, h, { t: g === 'GoblinKing' ? 'Kingbane' : mname(g) + 'bane' }, notes, `Revenge on the ${mname(g).toLowerCase()} is sweet.`); }
      if (M.threat === 'Dragon' && mh.kills > 0) giveTitle(S, h, { t: 'Dragonbane' }, notes);
      if (M.chickened === h.id) giveTitle(S, h, { t: 'the Chickenmancer' }, notes, 'Nobody knows how it works, including them.');
    });
    fled.forEach(({ h }) => { addXp(S, h, 6, notes); h.morale = clamp(h.morale - 8, 0, 100); h.st.fled++; hist(h, S, `Fled from "${p.title}". The others won't let it go.`); });
    if (p.downplay && p.actualDanger > p.danger - 1) { stay.forEach(({ h }) => { h.morale = clamp(h.morale - 6, 0, 100); }); out.lines.push('They noticed you downplayed the danger. They won anyway, but they noticed.'); }
    // chains
    if (p.chain) {
      const C = CHAINS[p.chain];
      if (p.chapter < p.chapters) { S.chainQ.push({ id: C.steps[p.chapter], day: S.day + 1, count: 0 }); out.lines.push(`${C.name}: chapter ${p.chapter + 1} of ${p.chapters} arrives tomorrow.`); note(S, `${C.name} continues. Chapter ${p.chapter + 1} arrives tomorrow.`, 'big'); }
      else { out.lines.push(`${C.name} is finally over.`); stay.forEach(({ h }) => giveTitle(S, h, C.title, notes, `For finishing ${C.name}.`)); }
    }
    // exams
    if (p.exam) {
      S.rank = p.exam; out.rankUp = RANKS[S.rank].name;
      out.lines.push(p.exam === 4 ? 'The King lowers his telescope and nods. The Royal Charter is yours.' : `Exam passed. The guild is now "${RANKS[S.rank].name}". Fancier clients will start writing in.`);
      note(S, p.exam === 4 ? 'The guild passed the Royal Charter Trial!' : `Exam passed: the guild is now "${RANKS[S.rank].name}".`, 'big');
      if (p.exam === 4) stay.forEach(({ h }) => giveTitle(S, h, { t: 'the Charterbearer' }, notes));
    }
  } else {
    S.stats.losses++; cl.fail++;
    const loss = M.result === 'extract' ? 1 : Math.ceil(p.renown / 3);
    S.renown = Math.max(0, S.renown - loss); out.renown = -loss;
    out.lines.push(M.result === 'extract' ? `Mission abandoned. ${p.client} is "disappointed but not surprised".` : `Failed. ${p.client} pays nothing and tells everyone at the market.`);
    party.forEach(({ mh, h }) => { addXp(S, h, 8 * p.actualDanger, notes); h.morale = clamp(h.morale - 10, 0, 100); if (mh.fled) h.st.fled++; hist(h, S, `Failed "${p.title}".`); });
    if (lied) { party.forEach(({ h }) => { h.morale = clamp(h.morale - 12, 0, 100); }); S.renown = Math.max(0, S.renown - 2); out.renown -= 2; out.lines.push('Word gets out that you downplayed the danger. The heroes are livid. So are the bards.'); }
    if (p.chain) { S.chainQ.push({ id: p.id, day: S.day + 2, count: Math.min(2, p.returns + 1) }); out.lines.push(`${CHAINS[p.chain].name} isn't over. ${p.client} will write again.`); }
    if (p.exam) { S.flags.examCooldown = S.day + 2; S.renown = Math.max(0, S.renown - 3); out.renown -= 3; out.lines.push('Exam failed. The examiner writes something long and unkind. You can retake it in two days.'); }
  }
  // flee count title
  party.forEach(({ h }) => { if (h.st.fled >= 5) giveTitle(S, h, { t: 'the Swift' }, notes, 'It is not a compliment.'); });
  // stolen gold and personal loot
  party.forEach(({ h }) => { const n = M.stolen[h.id]; if (n) h.gold = Math.max(0, h.gold - n); const l = M.loot[h.id]; if (l) { h.gold += l; out.lines.push(`${h.name} pocketed ${l}g of "found" goods on the side.`); } });
  // the fallen, the scarred and the grudging
  const clericUp = M.heroes.some(x => x.cls === 'Cleric' && !x.down && !x.fled);
  party.forEach(({ mh, h }) => {
    if (mh.down) {
      h.st.downs++;
      let dc = 0.08 + 0.045 * p.actualDanger - (clericUp ? 0.08 : 0) - (has(h, 'Lucky') ? 0.12 : 0);
      dc = M.result === 'extract' ? 0 : clamp(dc, 0.02, 0.3);
      const by = M.downBy[h.id];
      if (R(S) < dc) {
        h.status = 'dead'; h.hp = 0; out.deaths.push(h.name); S.stats.deaths++;
        h.died = { day: S.day, job: p.title, by: by ? mname(by) : 'friendly fire' };
        hist(h, S, `Died on "${p.title}".`);
        note(S, `${h.name} died on "${p.title}". The guild hangs a slightly crooked portrait.`, 'bad');
        S.flags.funeralQ.push(h.id);
        alive(S).forEach(o => {
          const k = o.rel[h.name];
          o.morale = clamp(o.morale - (k ? 20 : 6), 0, 100);
          if (LOVE.includes(k)) { o.morale = clamp(o.morale - 15, 0, 100); o.rel[h.name] = 'late'; if (by) o.grudge = by; hist(o, S, `Lost ${h.name}. Swore revenge.`); }
        });
      } else {
        h.status = 'wounded'; h.wound = Math.max(1, 1 + (p.actualDanger >= 4 ? 1 : 0) + (R(S) < 0.4 ? 1 : 0) - (S.hall.infirmary >= 2 ? 1 : 0));
        h.hp = Math.max(h.hp, Math.round(heroMax(h) * 0.1)); out.wounded.push(`${h.name} (${h.wound}d)`);
        if (R(S) < 0.5) addScar(S, h, by, notes);
        if (by && !h.grudge) { h.grudge = by; notes.push(`${h.name} now holds a grudge against ${MONSTERS[by].plural.toLowerCase()}.`); }
      }
    } else if (h.hp < heroMax(h) * 0.25) { h.status = 'wounded'; h.wound = 1; out.wounded.push(`${h.name} (1d)`); }
  });
  fled.forEach(({ h }) => { if (h.status !== 'dead' && !h.grudge && M.result !== 'win') { h.grudge = M.threat; } });
  // romance
  const pairs = [];
  party.forEach((x, i) => party.slice(i + 1).forEach(y => pairs.push([x, y])));
  pairs.forEach(([x, y]) => {
    const a = x.h, b = y.h; if (a.status === 'dead' || b.status === 'dead') return;
    const RQ = S.flags.romanceQ;
    const queued = RQ.some(q => (q.a === a.id && q.b === b.id) || (q.a === b.id && q.b === a.id));
    if (M.result === 'win') {
      [[a, b], [b, a]].forEach(([u, v]) => { if (u.rel[v.name] === 'crush') { u.heat[v.name] = (u.heat[v.name] || 0) + 1; if (u.heat[v.name] >= 2 && !queued) RQ.push({ type: 'confess', a: u.id, b: v.id }); } });
      const pk = [a.id, b.id].sort().join('-');
      if (a.rel[b.name] === 'couple' && !queued && !(S.flags.wed || []).includes(pk) && S.day - (a.since[b.name] || S.day) >= 4) { RQ.push({ type: 'wedding', a: a.id, b: b.id }); S.flags.wed = (S.flags.wed || []).concat(pk); }
    }
    if (LOVE.includes(a.rel[b.name]) && !queued && !RQ.some(q => q.a === a.id || q.b === a.id)) {
      const abandoned = (x.mh.fled && !y.mh.fled) || (y.mh.fled && !x.mh.fled);
      if ((abandoned && R(S) < 0.6) || (M.result !== 'win' && R(S) < 0.35)) RQ.push({ type: 'breakup', a: (x.mh.fled ? a : b).id, b: (x.mh.fled ? b : a).id, abandoned });
    }
  });
  out.ups = notes;
  note(S, `${M.result === 'win' ? 'Success' : M.result === 'extract' ? 'Abandoned' : 'Failure'}: "${p.title}" with ${party.map(x => x.h.name).join(', ')}.`, M.result === 'win' ? 'good' : 'bad');
  p.status = 'done';
  return out;
}

/* ---------- evening ---------- */
const PRICES = { tavern: 8, infirmary: 14, yard: 18 };
function gearPrice(h) { return 35 + 22 * h.gear; }
function margin(S, key, price) { return Math.round(price * (0.3 + 0.1 * S.hall[key]) * (key === 'tavern' && seasonOf(S.day).id === 'festival' ? 2 : 1)); }
const SPEND_QUIPS = {
  tavern: ['Mostly on "communion".', 'Sang. Was asked to stop. Sang louder.', 'Tipped generously. Flirted worse.', 'Started a fight with a coat rack. Won.', 'Drank to forget. Forgot why.'],
  smithy: ['Bought a bigger sword. Compensating, probably.', 'New armour. Very shiny. Squeaks.', 'Had the blade sharpened and the ego polished.'],
  yard: ['Beat up a dummy. The dummy will remember.', 'Practised a heroic pose for an hour.', 'Sparred. Lost to a scarecrow. Learned humility. Briefly.'],
  infirmary: ['The nun said "hold still" eleven times.', 'Stitched up. Complained throughout.', 'Got a lollipop. Did not deserve it.']
};
function upkeep(S) { const lv = Object.values(S.hall).reduce((a, b) => a + b, 0); return Math.round((15 + 5 * alive(S).length + 5 * lv - (S.flags.broom > 0 ? 8 : 0)) * (seasonOf(S.day).id === 'tax' ? 1.25 : 1)); }

function runEvening(S) {
  const E = { hall: [], hallIncome: 0, upkeep: 0, notes: [], leavers: [], event: null, recruit: null, eventDone: false, funerals: [], snubs: [] };
  E.snubs = processSnubs(S);
  const onMission = new Set();
  Object.values(S.today.parties || {}).forEach(ids => ids.forEach(id => onMission.add(id)));
  const festival = seasonOf(S.day).id === 'festival';
  alive(S).forEach(h => {
    if (h.status === 'away') { h.away--; if (h.away <= 0) { h.status = 'ready'; h.morale = clamp(h.morale + 15, 0, 100); E.notes.push(`${h.name} is back from honeymoon. Tanned. Smug.`); } return; }
    if (h.status === 'wounded') { h.wound--; h.hp = Math.min(heroMax(h), h.hp + Math.round(heroMax(h) * (0.2 + 0.08 * S.hall.infirmary))); if (h.wound <= 0) { h.status = 'ready'; h.hp = Math.max(h.hp, Math.round(heroMax(h) * 0.55)); } }
    else if (!onMission.has(h.id)) { h.hp = Math.min(heroMax(h), h.hp + Math.round(heroMax(h) * 0.3)); h.morale += (55 - h.morale) * 0.25; if (has(h, 'Lazy')) h.morale += 4; }
    else { h.hp = Math.min(heroMax(h), h.hp + Math.round(heroMax(h) * 0.12)); }
    if (festival) h.morale += 5;
  });
  alive(S).forEach(h => {
    if (h.status === 'away') return;
    let buys = 0;

    ${out.renown ? `<li>Renown ${out.renown > 0 ? '+' : ''}${out.renown}.</li>` : ''}
    ${out.deaths.map(d => `<li style="color:#a8342e;font-weight:800">${esc(d)} died. The guild will hang a portrait. Slightly crooked.</li>`).join('')}
    ${out.wounded.length ? `<li>Wounded: ${esc(out.wounded.join(', '))}.</li>` : ''}
    ${out.ups.map(u => `<li style="color:#2f7a58">${esc(u)}</li>`).join('')}</ul>
    <div style="margin-top:12px"><button class="big ${last ? 'brass' : 'red'}" style="width:100%" data-act="${last ? 'toevening' : 'nexttale'}">${last ? 'Night falls →' : 'Next tale →'}</button></div></div>`;
  SFX.stamp();
  if (out.rankUp) setTimeout(() => { toast(GAME.S.rank >= RANKS.length - 1 ? 'The Royal Charter is yours!' : `Rank up: ${out.rankUp}!`); SFX.win(); }, 600);
  setTimeout(() => slot.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
}

/* ---------------- evening ---------------- */
function toEvening() {
  const S = GAME.S;
  S.phase = 'evening';
  S.petitions.forEach(p => { if (p.status === 'new') p.status = 'expired'; });
  if (!S.evening) runEvening(S);
  GAME.mNode = null; GAME.M = null; GAME.settled = null; GAME.tab = 'today';
  save(); render(); $('#main').scrollTop = 0;
}
function funeralCard(f) {

    ${f.done ? `<div class="res">${esc(f.text)} <em>Epitaph: \u201c${esc(h.epitaph)}\u201d</em></div>` : `<div class="choices">${EULOGIES.map((e, i) => `<button class="big ghost" data-act="funeral" data-id="${h.id}" data-i="${i}" ${e.cost && S.gold < e.cost ? 'disabled' : ''}>${esc(e.label)}</button>`).join('')}</div>`}</div>`;
}
function renderEvening() {

      <div class="row"><span>Hall takings (your cut of their vices)</span><span class="plus">+${E.hallIncome}g</span></div>

    ${res.length ? `<div class="sect">Today's tales</div><div class="feed">${res.map(r => `<div class="line"><span>${r.result === 'win' ? '✓' : '✗'} ${esc(r.title)}</span><span class="num">${r.result === 'win' ? '+' + r.net + 'g' : '0g'} · ${r.renown >= 0 ? '+' : ''}${r.renown} renown</span></div>`).join('')}</div>` : ''}
    ${news.length ? `<div class="sect">Guild news</div><ul class="news">${news.map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join('')}</ul>` : ''}

/* ---------------- end screens ---------------- */
function renderEnd() {

  return `<div class="phase-head"><div class="eyebrow">Day ${S.day}</div><h2>The guild has fallen</h2><p>${why}</p></div>

function statsBlock(S) {

    <div class="statgrid"><div><b>${Math.round(h.hp)}/${heroMax(h)}</b>HP</div><div><b>${heroAtk(h).toFixed(0)}</b>Attack</div><div><b>${heroDef(h).toFixed(0)}</b>Defence</div><div><b>${h.morale}</b>Mood</div>
      <div><b>${h.xp}/${xpNeed(h)}</b>XP</div><div><b>${h.gear}</b>Gear</div><div><b>${h.gold}g</b>Purse</div><div><b>${h.st.wins}/${h.st.missions}</b>Wins</div></div>

    ${h.titles.length ? `<h4>Titles earned</h4><p style="margin:0;font-size:calc(14px * var(--ts, 1))">${h.titles.map(t => esc(t.t)).join(' · ')}</p>` : ''}

    ${rels.length ? `<h4>Entanglements</h4><ul>${rels.join('')}</ul>` : ''}

    <h4>Record</h4><p style="margin:0;font-size:calc(14px * var(--ts, 1))">${h.st.kills} kills · ${h.st.downs} times knocked flat · fled ${h.st.fled} times · earned ${h.st.earned}g</p>
    ${canRes ? `<button class="big brass close" data-act="resurrect" data-id="${h.id}" ${S.gold < resurrectCost(h) ? 'disabled' : ''}>Resurrect (${resurrectCost(h)}g)</button>` : ''}

/* ---------------- hall ---------------- */
function renderHall() {

    <p>Heroes spend their wages here, and you take a cut. Pay them well and the money comes home. Upkeep tonight: <b class="num">${upkeep(S)}g</b>.</p></div>
    ${canBuild ? '' : '<div class="warn" style="margin-bottom:12px">The builders refuse to work while the heroes are out. Union rules. Come back in the morning or evening.</div>'}
    ${Object.entries(FACILITIES).map(([k, f]) => {
      const lv = S.hall[k], max = lv >= f.max, cost = max ? 0 : upgradeCost(S, k);
      return `<div class="fac"><div class="top"><div><div class="kind">${f.kind}</div><h3>${esc(f.name)}</h3></div><div class="lv">${Array.from({ length: f.max }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</div></div>

function memorialWall(S) {

/* ---------------- modal ---------------- */
function openModal(html) { const o = $('#overlay'); o.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; o.hidden = false; }
function closeModal() { const o = $('#overlay'); o.hidden = true; o.innerHTML = ''; }

/* ---------------- actions ---------------- */
const ACT = {
  tab(d) { GAME.tab = d.tab; SFX.click(); render(); $('#main').scrollTop = 0; },
  mute() { SFX.toggle(); renderTop(); },
  newgame() {
    SFX.unlock(); SFX.paper();
    GAME.S = newGame(); GAME.title = null; GAME.tab = 'today'; GAME.open = null; GAME.mNode = null; save();
    render();
    openModal(`<h2>A letter on the desk</h2><div class="lettertext">${esc(INTRO_LETTER)}</div><button class="big red close" data-act="close">Take the keys</button>`);
  },
  continue() { SFX.unlock(); SFX.click(); GAME.S = loadSave(); GAME.title = null; GAME.tab = 'today'; render(); },
  close() { closeModal(); },
  settings() { SFX.click(); settingsModal(); },
  setts(d) { SETTINGS.ts = +d.v; applySettings(); settingsModal(); if (GAME.theatre && GAME.S && GAME.S.phase === 'missions') GAME.theatre.resize(); },
  setrm() { SETTINGS.reduced = !SETTINGS.reduced; applySettings(); settingsModal(); },
  mute2() { SFX.toggle(); renderTop(); settingsModal(); },
  funeral(d) { resolveFuneral(GAME.S, +d.id, +d.i); SFX.paper(); save(); render(); },
  toggle(d) { const id = +d.pid; GAME.open = GAME.open === id ? null : id; SFX.paper(); render(); const n = $('#n-' + id); if (n && GAME.open) n.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  scout(d) {
    const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid), c = scoutCost(S, p);
    if (p.scouted || S.gold < c) return;
    S.gold -= c; S.today.costs += c; p.scouted = true; SFX.stamp();
    if (p.actualThreat !== p.threat) toast(`Scout: it's not ${an(p.threat)} ${p.threat}. It's ${an(p.actualThreat)} ${p.actualThreat.toUpperCase()}.`);
    save(); render();
  },
  pot(d) { const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid); p.potions = clamp(p.potions + (+d.d), 0, 3); SFX.click(); save(); render(); },
  downplay(d) { const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid); p.downplay = !p.downplay; SFX.click(); save(); render(); },
  post(d) {
    const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid);
    const cost = p.potions * POTION_PRICE; if (S.gold < cost) return;
    S.gold -= cost; S.today.costs += cost; p.status = 'posted'; SFX.stamp(); GAME.open = null; save(); render();
  },
  unpost(d) { const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid); S.gold += p.potions * POTION_PRICE; S.today.costs -= p.potions * POTION_PRICE; p.status = 'new'; SFX.paper(); save(); render(); },
  bin(d) {
    const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid);
    if (p.status === 'binned') { p.status = 'new'; render(); return; }
    p.status = 'binned'; SFX.stamp(); GAME.open = null; toast(fill(pickH(CLIENT_SNUBS, 'snub' + p.uid), { client: p.client })); save(); render();
  },
  opendoors() { SFX.paper(); enterBoard(); },
  dayoff() { GAME.S.today.parties = {}; note(GAME.S, 'The guild took the day off. The heroes call it a "wellness day".', 'info'); toEvening(); },
  sweeten(d) {
    const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid);
    p.cutPct = Math.min(150, p.cutPct + 15); SFX.coin();
    reform(`Nobody bites at ${p.cutPct}%. They can smell desperation.`);
  },
  round() {
    const S = GAME.S, n = readyHeroes(S).length, c = 4 * n;
    if (S.today.round || S.gold < c) return;
    S.gold -= c; S.today.costs += c; S.today.round = true;
    readyHeroes(S).forEach(h => { h.morale = clamp(h.morale + (has(h, 'Drunkard') ? 22 : 11), 0, 100); });
    SFX.coin(); reform('A round is bought. Spirits rise. Decisions do not change.');
  },
  speech() {
    const S = GAME.S; if (S.today.speech) return; S.today.speech = true;
    if (R(S) < 0.55) { readyHeroes(S).forEach(h => { h.morale = clamp(h.morale + 13, 0, 100); }); toast('A rousing speech! Someone at the back started a slow clap. It caught on.'); }
    else { readyHeroes(S).forEach(h => { h.morale = clamp(h.morale - 6, 0, 100); }); toast(pickH(['You compare them to "a family". Several wince.', 'You mispronounce "valour". Twice. Morale dips.', 'Mid-speech, you call Brenna "Brendan". Morale dips.'], 'sp' + S.day)); }
    reform();
  },
  sendoff() { SFX.curtain(); sendOff(); },
  speed(d) { GAME.speed = +d.s; try { localStorage.setItem('hss-speed', d.s); } catch (e) {} if (GAME.theatre) GAME.theatre.speed = GAME.speed; GAME.mNode.querySelectorAll('[data-act=speed]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.s === GAME.speed))); SFX.click(); },
  skip() { skipMission(); },
  iv(d) { chooseIntervention(d.c); },
  nexttale() { SFX.click(); GAME.mNode = null; render(); $('#main').scrollTop = 0; },
  toevening() { toEvening(); },
  event(d) { resolveEvent(GAME.S, +d.i); SFX.paper(); save(); render(); },
  hire() { const h = hireRecruit(GAME.S); if (h) { SFX.coin(); toast(`${h.name} joins the guild. Already complaining.`); } save(); render(); },
  pass() { passRecruit(GAME.S); save(); render(); },
  sleep() {
    const S = GAME.S;
    const rk = rankIndex(S.renown);
    if (rk > (S.lastRank || 0)) { S.lastRank = rk; note(S, `The guild is now "${RANKS[rk].name}". Fancier clients will start writing in.`, 'big'); setTimeout(() => toast(`Rank up: ${RANKS[rk].name}! Fancier clients incoming.`), 900); }
    const r = endNight(S); save();
    if (r === 'next') { GAME.open = null; toast(`Day ${S.day}. The post has arrived.`); SFX.paper(); }
    else if (r === 'won') SFX.win(); else SFX.lose();
    render(); $('#main').scrollTop = 0;
  },
  keepgoing() { const S = GAME.S; S.day++; startDay(S); save(); render(); },
  hero(d) { SFX.paper(); heroModal(+d.id); },
  resurrect(d) { const S = GAME.S, h = S.heroes.find(x => x.id === +d.id); if (resurrect(S, h)) { SFX.heal(); closeModal(); save(); render(); toast(`${h.name} is back. Smells faintly of soil.`); } },
  upgrade(d) { if (upgrade(GAME.S, d.k)) { SFX.coin(); save(); render(); toast(`${FACILITIES[d.k].name}: ${FACILITIES[d.k].lvl[GAME.S.hall[d.k]]}.`); } }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('input', e => {
  const el = e.target; if (el.dataset.input !== 'cut') return;
  const p = GAME.S.petitions.find(x => x.uid === +el.dataset.pid); if (!p) return;
  p.cutPct = +el.value; refreshPetition(p);
});
document.addEventListener('change', e => { if (e.target.dataset.input === 'cut') save(); });
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('resize', () => { if (GAME.theatre && GAME.S && GAME.S.phase === 'missions') GAME.theatre.resize(); });

function boot(data) {
  applySettings();
  const S = data && data.S ? migrate(data.S) : null;
  if (S) { GAME.S = S; GAME.tab = data.tab || 'today'; GAME.title = null; }
  else GAME.title = true;
  render();
}
if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => (GAME.S && !GAME.title ? { S: GAME.S, tab: GAME.tab } : {}));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
</body>
</html>
