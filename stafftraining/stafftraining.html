<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<title>Staff Training</title>
<style>
:root{--paper:#f6efdc;--ink:#1f2a44;--red:#d9442e;--gold:#e0a82e;--green:#3f8f5a;--pink:#e2607f;--blue:#3f7fc4;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#141826;color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
h1,h2,.eyebrow,.sub,button,#lessonTitle,.lbl,kbd{font-family:Rockwell,"Roboto Slab","Bitter",Georgia,serif}
button{font:inherit;font-family:Rockwell,"Roboto Slab","Bitter",Georgia,serif;color:var(--ink);cursor:pointer;border:2px solid var(--ink);background:var(--paper);border-radius:10px;touch-action:manipulation}
kbd{font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:5px;opacity:.7;font-weight:400}
body.touch kbd{display:none}
/* ---------- overlays: pages of the manual ---------- */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b));background:rgba(20,24,38,.42);z-index:30;overflow:auto}
#menu{background:linear-gradient(90deg,rgba(20,24,38,.72) 0,rgba(20,24,38,.35) 60%,rgba(20,24,38,.05) 100%);justify-content:flex-start}
.page{background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:6px;padding:22px 24px 18px;width:min(520px,100%);max-height:100%;overflow:auto;position:relative;
 background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(31,42,68,.06) 27px 28px)}
.page.small{width:min(400px,100%)}
#menu .page{margin-left:max(0px,4vw)}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--red);font-weight:700}
h1{font-size:clamp(40px,9vw,64px);line-height:.92;margin:6px 0 10px;letter-spacing:.01em}
h2{font-size:clamp(22px,5vw,30px);line-height:1.05;margin:4px 0 10px}
.tag,.rule{font-style:italic;font-size:15px;line-height:1.35;margin-bottom:12px}
.rule{border-left:4px solid var(--red);padding:2px 0 2px 10px}
.sub{font-size:11px;letter-spacing:.14em;font-weight:700;margin:12px 0 4px;color:var(--red)}
.page ul{margin:0 0 6px;padding-left:20px;font-size:14px;line-height:1.36}
.page li{margin:3px 0}
ul.chk{list-style:none;padding-left:0}
ul.chk li{padding-left:26px;position:relative}
ul.chk li:before{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border:2px solid var(--ink);border-radius:3px;background:#fff}
ul.chk li.done:after{content:"\2714";position:absolute;left:4px;top:-4px;font-size:18px;color:var(--green);font-weight:700}
ul.chk li.miss{opacity:.55}
.toc{margin:10px 0 12px;display:flex;flex-direction:column;gap:6px}
.toc button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;font-size:14px;font-weight:700;border-radius:8px;box-shadow:3px 3px 0 var(--ink);background:#fffaf0}
.toc button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.toc button .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px}
.toc button .t{flex:1}
.toc button .g{flex:none;font-size:15px;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:0 6px;transform:rotate(-6deg)}
.toc button.locked{opacity:.45;box-shadow:none;background:transparent}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.row.col{flex-direction:column;align-items:stretch}
.lbl{font-size:11px;letter-spacing:.14em;font-weight:700}
#coats{display:flex;gap:8px}
#coats button{width:38px;height:38px;border-radius:50%;padding:0;position:relative;overflow:hidden}
#coats button i{position:absolute;left:0;right:0;bottom:0;height:42%}
#coats button.on{outline:3px solid var(--red);outline-offset:2px}
button.mini{font-size:12px;font-weight:700;padding:7px 10px;letter-spacing:.04em}
button.mini.ghost{border-style:dashed;opacity:.7}
button.big{font-size:17px;font-weight:700;padding:11px 18px;background:var(--red);color:#fff;box-shadow:3px 3px 0 var(--ink);letter-spacing:.04em}
button.big:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#how{font-size:13.5px;line-height:1.4;margin-top:10px;border-top:2px dashed var(--ink);padding-top:8px}
#how b{font-family:Rockwell,"Roboto Slab",Georgia,serif}
#stamp{position:absolute;right:18px;top:16px;font-family:Rockwell,"Roboto Slab",Georgia,serif;font-weight:700;font-size:46px;line-height:1;color:var(--red);border:4px solid var(--red);border-radius:10px;padding:4px 12px;transform:rotate(9deg);opacity:.9}
#stamp.fail{font-size:18px;padding:8px 10px;letter-spacing:.08em}
#report h2{padding-right:92px}
#rStaff{font-size:13.5px;line-height:1.35}
#rStaff b{font-family:Rockwell,"Roboto Slab",Georgia,serif}
#rStats{font-size:12px;opacity:.75;margin-top:8px}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud button{pointer-events:auto}
#top{position:absolute;left:8px;right:8px;top:calc(8px + var(--safe-t));display:flex;align-items:center;gap:8px}
#pauseBtn{width:40px;height:40px;font-weight:700;font-size:14px;flex:none;box-shadow:2px 2px 0 var(--ink)}
#lessonBox{flex:1;min-width:0;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:3px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:2px 2px 0 var(--ink)}
#lessonTitle{font-size:12px;font-weight:700;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
#clock.late{color:var(--red)}
#dig{flex:none;width:112px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:3px 8px 5px;box-shadow:2px 2px 0 var(--ink)}
#dig span{font-size:9px;letter-spacing:.14em;font-weight:700;display:block}
.bar{height:7px;background:rgba(31,42,68,.18);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--green);border-radius:4px;transition:width .15s linear}
#digBar{background:var(--gold)}
#staff{position:absolute;left:8px;top:calc(56px + var(--safe-t));display:flex;flex-direction:column;gap:6px;width:min(46vw,210px)}
.chip{background:rgba(246,239,220,.94);border:2px solid var(--ink);border-radius:8px;padding:4px 8px 6px;box-shadow:2px 2px 0 var(--ink)}
.chip .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.chip b{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-size:12px;letter-spacing:.04em}
.chip .st{font-size:10.5px;font-style:italic;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ln{display:flex;align-items:center;gap:5px;margin-top:3px}
.chip .ln span{font-size:8px;letter-spacing:.1em;font-weight:700;width:52px;flex:none}
.chip .ln .bar{flex:1}
.chip .b2 i{background:var(--blue)}
.chip.sleep .b2 i{background:#7b63b8}
.chip.guilt .b2 i{background:var(--pink)}
.chip.hot{animation:shake .25s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
#objs{position:absolute;right:8px;top:calc(56px + var(--safe-t));width:min(46vw,250px);background:rgba(246,239,220,.94);border:2px solid var(--ink);border-radius:8px;padding:5px 8px;font-size:11.5px;line-height:1.25;box-shadow:2px 2px 0 var(--ink)}
#objs.flash{animation:flash .5s ease 2}
@keyframes flash{50%{background:#fff3b0}}
#objs div{padding-left:17px;position:relative;margin:2px 0}
#objs div:before{content:"";position:absolute;left:1px;top:2px;width:9px;height:9px;border:1.5px solid var(--ink);border-radius:2px;background:#fff}
#objs div.done{opacity:.6;text-decoration:line-through}
#objs div.done:after{content:"\2714";position:absolute;left:2px;top:-4px;color:var(--green);font-size:14px;text-decoration:none}
#objs div.x{font-style:italic;opacity:.75}
#objs div.x:before{border-style:dashed}
#objs .xs{display:none;padding-left:0;font-style:italic;opacity:.8}
#objs .xs:before{display:none}
#objs .stat{padding-left:0;font-family:Rockwell,"Roboto Slab",Georgia,serif;font-weight:700;font-size:11px;letter-spacing:.04em;border-top:1.5px dashed var(--ink);margin-top:4px;padding-top:3px}
#objs .stat:before{display:none}
#narr{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(118px + var(--safe-b));width:min(560px,94vw);display:flex;flex-direction:column;gap:5px;align-items:center}
body.touch #narr{bottom:calc(226px + var(--safe-b));width:min(560px,96vw)}
#narr div{background:rgba(31,42,68,.9);color:#fdf6e3;border-radius:8px;padding:6px 12px;font-size:13.5px;line-height:1.3;text-align:center;font-style:italic;border-left:4px solid var(--gold)}
#toast{position:absolute;left:50%;bottom:calc(196px + var(--safe-b));transform:translateX(-50%);width:min(380px,90vw);background:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);padding:8px 12px;font-size:13px;display:none}
#toast b{display:block;font-family:Rockwell,"Roboto Slab",Georgia,serif;color:var(--blue);font-size:11px;letter-spacing:.12em}
#finishBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(66px + var(--safe-b));font-size:15px;font-weight:700;padding:10px 16px;background:var(--green);color:#fff;box-shadow:3px 3px 0 var(--ink);animation:pulse 1s ease infinite}
body.touch #finishBtn{bottom:auto;top:calc(214px + var(--safe-t))}
body.touch #toast{bottom:calc(300px + var(--safe-b))}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
#btns{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(12px + var(--safe-b));width:262px;height:196px}
#btns button{position:absolute;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
#btns button.down,#btns button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.rnd{width:62px;height:62px;border-radius:50%;font-size:12px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fffaf0}
.rnd kbd{margin:2px 0 0}
.rnd.big{width:86px;height:86px;font-size:17px;background:var(--gold)}
#bJump{right:0;bottom:0}
#bMeow{right:6px;bottom:96px}
#bZoom{right:78px;bottom:124px}
#bZoom.cd{opacity:.45}
.act{left:0;width:166px;height:54px;border-radius:12px;padding:3px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.act small{font-size:9px;letter-spacing:.14em;opacity:.85}
.act span{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.mis{bottom:62px;background:#f7c9bf}
.act.charm{bottom:0;background:#f6c7d6}
.act.off{opacity:.4;background:var(--paper)}
#touch{position:fixed;inset:0;z-index:5}
#joyBase{display:none;position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;border:2px solid rgba(246,239,220,.85);background:rgba(31,42,68,.3)}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(246,239,220,.92);border:2px solid var(--ink)}
/* ---------- world labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:12;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:min(240px,62vw);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:5px 9px;font-size:13px;line-height:1.22;text-align:center;box-shadow:2px 2px 0 rgba(31,42,68,.6)}
.bub:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bub.off:after{display:none}
.bub b{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-size:9px;letter-spacing:.12em;display:block;color:var(--red)}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:Rockwell,"Roboto Slab",Georgia,serif;font-weight:700;font-size:15px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 4px var(--ink);white-space:nowrap}
.pop.good{color:#9df0a8}.pop.bad{color:#ffb0a0}.pop.cat{color:#ffe9a8;font-style:italic}
.zz{position:absolute;transform:translate(-50%,-100%);font-family:Rockwell,Georgia,serif;font-weight:700;color:#cfd8ff;text-shadow:0 1px 0 var(--ink);font-size:15px;animation:zz 2s ease-in-out infinite}
@keyframes zz{50%{transform:translate(-40%,-130%) scale(1.15)}}
@media (max-height:480px){#staff{flex-direction:row;width:auto}.chip{width:170px}#objs{top:calc(56px + var(--safe-t))}#narr,body.touch #narr{bottom:calc(8px + var(--safe-b));width:min(360px,44vw);left:42%}.page{padding:14px 18px}h1{font-size:34px}}
@media (max-width:560px){#objs .x{display:none}#objs .xs{display:block}#objs{width:min(46vw,200px)}}
@media (max-width:420px){#dig{width:86px}#lessonTitle{font-size:10.5px}.act{width:150px}#btns{width:246px}}
@media (max-height:600px) and (max-width:560px){#btns{transform:scale(.8);transform-origin:100% 100%}body.touch #narr,#narr{bottom:calc(170px + var(--safe-b))}#narr div{font-size:12px;padding:4px 9px}.chip .st{display:none}#staff{width:min(40vw,170px);gap:4px}.chip{padding:3px 7px 4px}body.touch #finishBtn{top:calc(150px + var(--safe-t));font-size:13px;padding:7px 12px}}

</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="hud" class="hidden">
  <div id="top">
    <button id="pauseBtn" aria-label="Pause">II</button>
    <div id="lessonBox"><div id="lessonTitle"></div><div id="clock"></div></div>
    <div id="dig"><span>DIGNITY</span><div class="bar"><i id="digBar"></i></div></div>
  </div>
  <div id="staff"></div>
  <div id="objs"></div>
  <div id="narr"></div>
  <div id="toast"></div>
  <button id="finishBtn" class="hidden">FINISH LESSON &#10004;</button>
  <div id="btns">
    <button id="bMeow" class="rnd">MEOW<kbd>Q</kbd></button>
    <button id="bZoom" class="rnd">ZOOM<kbd>Shift</kbd></button>
    <button id="bMis" class="act mis"><small>MISCHIEF <kbd>E</kbd></small><span></span></button>
    <button id="bCharm" class="act charm"><small>CHARM <kbd>F</kbd></small><span></span></button>
    <button id="bJump" class="rnd big">JUMP<kbd>Space</kbd></button>
  </div>
</div>
<div id="touch"><div id="joyBase"><div id="joyKnob"></div></div></div>

<div id="menu" class="overlay">
  <div class="page">
    <div class="eyebrow">A PRACTICAL MANUAL FOR THE HOUSEHOLD CAT</div>
    <h1>STAFF<br>TRAINING</h1>
    <div class="tag">You do not have owners. You have staff. They are a couple, they mean well, and they have learned nothing.</div>
    <div class="toc" id="toc"></div>
    <div class="row"><span class="lbl">YOUR COAT</span><div id="coats"></div></div>
    <div class="row btnrow">
      <button id="sndBtn" class="mini"></button><button id="qBtn" class="mini"></button><button id="howBtn" class="mini">HOW TO PLAY</button><button id="unlockBtn" class="mini ghost">UNLOCK ALL</button>
    </div>
    <div id="how" class="hidden"></div>
  </div>
</div>
<div id="brief" class="overlay hidden"><div class="page"><div class="eyebrow" id="bNum"></div><h2 id="bTitle"></h2><div class="rule" id="bRule"></div><ul id="bTips"></ul><div class="sub">TO PASS</div><ul id="bObj" class="chk"></ul><div class="row btnrow"><button id="bBegin" class="big">BEGIN LESSON</button><button id="bBack" class="mini">BACK</button></div></div></div>
<div id="pause" class="overlay hidden"><div class="page small"><h2>PAUSED</h2><div class="rule" id="pRule"></div><ul id="pTips"></ul><div class="row btnrow col"><button id="pResume" class="big">RESUME</button><button id="pRestart" class="mini">RESTART LESSON</button><button id="pSnd" class="mini"></button><button id="pQ" class="mini"></button><button id="pQuit" class="mini">QUIT TO MANUAL</button></div></div></div>
<div id="report" class="overlay hidden"><div class="page"><div class="eyebrow">REPORT CARD</div><h2 id="rTitle"></h2><div id="stamp"></div><div class="rule" id="rText"></div><ul id="rObj" class="chk"></ul><div class="sub">EXTRA CREDIT</div><ul id="rExtra" class="chk"></ul><div class="sub">STAFF EVALUATIONS</div><div id="rStaff"></div><div id="rStats"></div><div class="row btnrow"><button id="rNext" class="big">NEXT LESSON</button><button id="rRetry" class="mini">RETRY</button><button id="rMenu" class="mini">MANUAL</button></div></div></div>
<script>
// ===== 00-util.js =====
'use strict';
// ---------- small helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(12345);
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const angWrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const hyp = Math.hypot;
const SAVE = {
  get(k, d) { try { const v = localStorage.getItem('stafftraining.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('stafftraining.' + k, JSON.stringify(v)); } catch (e) { } }
};
const URLQ = new URLSearchParams(location.search);
const TEST = URLQ.has('test');
function C(h, e = 0) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255, e]; }
function shade(c, k) { return [c[0] * k, c[1] * k, c[2] * k, c[3] || 0]; }

// ---------- mat4 (column major) ----------
const M4 = {
  ident(o = new Float32Array(16)) { o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o; },
  persp(o, fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2); o.fill(0); o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o; },
  ortho(o, l, r, b, t, n, f) { o.fill(0); o[0] = 2 / (r - l); o[5] = 2 / (t - b); o[10] = -2 / (f - n); o[12] = -(r + l) / (r - l); o[13] = -(t + b) / (t - b); o[14] = -(f + n) / (f - n); o[15] = 1; return o; },
  lookAt(o, e, c, u) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; let l = hyp(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx; l = hyp(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0; o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0; o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
    o[12] = -(xx * e[0] + xy * e[1] + xz * e[2]); o[13] = -(yx * e[0] + yy * e[1] + yz * e[2]); o[14] = -(zx * e[0] + zy * e[1] + zz * e[2]); o[15] = 1; return o;
  },
  mul(o, a, b) {
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3], a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7], a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11], a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];

  if (k < 1) { const kk = Math.max(0.16, k - 0.07); px = ox + (px - ox) * kk; pz = oz + (pz - oz) * kk; py = oy + (py - oy) * kk + (1 - kk) * 0.45; }
  py = Math.min(py, APT.H - 0.12);
  const s = CAMS.snap ? 1 : 1 - Math.exp(-9 * dt); CAMS.snap = false;
  CAM.pos = [lerp(CAM.pos[0], px, s), lerp(CAM.pos[1], py, s), lerp(CAM.pos[2], pz, s)]; CAM.tgt = [lerp(CAM.tgt[0], tx, s), lerp(CAM.tgt[1], ty, s), lerp(CAM.tgt[2], tz, s)];
}

// ---------- per-frame scene ----------
function buildScene() {
  for (const p of PRIMS) { SET.dyn[p].clear(); SET.dynN[p].clear(); SET.glass[p].clear(); }
  PARENT = null; msp = 0;
  const tod = G.tod || TOD.day;
  TGT = SET.dynN; drawWindows(tod);
  if (CAM.pos[1] < APT.H - 0.05) box(0, APT.H + 0.05, 0, 12.3, 0.1, 9.3, C('#f4efe4'));
  put('quad', -4.4, 0.95, -0.365, 0, 0, 0, 1.14, 0.68, 1, G.tvOn ? C('#ffffff', 0.85) : C('#15171c'), G.tvOn ? ATLAS.rects.tvon : undefined);
  TGT = SET.dyn; drawDoors(); drawProps();
  // laptop
  box(5.5, 0.762, 1.3, 0.26, 0.02, 0.36, C('#c9ced6'));
  if (G.laptopOpen) { put('box', 5.64, 0.89, 1.3, 0, 0, -0.18, 0.016, 0.25, 0.36, C('#c9ced6')); TGT = SET.dynN; put('quad', 5.628, 0.892, 1.3, -Math.PI / 2, -0.18, 0, 0.33, 0.22, 1, C('#ffffff', 0.8), ATLAS.rects[G.laptop]); TGT = SET.dyn; }
  else box(5.5, 0.782, 1.3, 0.26, 0.016, 0.36, C('#b9c0c6'));
  // bowls, spray bottle, box
  put('cyl', BOWL.x, 0.03, BOWL.z, 0, 0, 0, 0.24, 0.06, 0.24, C('#d9442e')); if (BOWL.food > 0) put('cyl', BOWL.x, 0.055, BOWL.z, 0, 0, 0, 0.19, 0.03, 0.19, C('#8a5a34'));
  put('cyl', BOWL.water.x, 0.03, BOWL.water.z, 0, 0, 0, 0.24, 0.06, 0.24, C('#3f7fc4')); put('cyl', BOWL.water.x, 0.052, BOWL.water.z, 0, 0, 0, 0.19, 0.02, 0.19, C('#9fd0f0'));
  if (!HUM.some(h => h.carry === 'spray')) { cyl(2.05, 0.99, -4.15, 0.035, 0.14, C('#4fb0d8')); box(2.05, 1.08, -4.12, 0.04, 0.05, 0.09, C('#e04040')); }
  { const b = G.boxAt, cc = COLS.card; box(b.x, 0.015, b.z, 0.56, 0.03, 0.46, shade(cc, 0.9)); box(b.x - 0.28, 0.15, b.z, 0.02, 0.3, 0.46, cc); box(b.x + 0.28, 0.15, b.z, 0.02, 0.3, 0.46, cc); box(b.x, 0.15, b.z - 0.23, 0.56, 0.3, 0.02, cc); box(b.x, 0.15, b.z + 0.23, 0.56, 0.3, 0.02, cc); }
  // cat bed nobody uses, by the desk
  put('cyl', 4.35, 0.04, 2.55, 0, 0, 0, 0.6, 0.08, 0.5, C('#7f9ac4')); put('cyl', 4.35, 0.07, 2.55, 0, 0, 0, 0.44, 0.06, 0.36, C('#e9eef5'));
  for (const [k, x] of [['nsW', -5.43], ['nsE', -2.57]]) put('cyl', x, 0.86, -4.28, 0, 0, 0, 0.17, 0.13, 0.17, G.lamps[k] ? C('#ffe2a0', 1) : C('#d8c9a8'));
  if (CAT.mode !== 'hidden') drawCat(CAT);
  for (const h of HUM) drawHuman(h);
  if (HUM.some(h => h.seat === 'shower')) { TGT = SET.glass; box(4.7, 1.2, -3.7, 2.36, 1.9, 0.02, C('#cfe9f2')); TGT = SET.dyn; }
  // lights
  LIGHT.key = tod.key; LIGHT.sky = tod.sky; LIGHT.gnd = tod.gnd; LIGHT.fog = tod.fog; setLightDir(tod.dir[0], tod.dir[1], tod.dir[2]);
  NPL = 0; G.lamps.tv = G.tvOn; for (const k in LAMPS) if (G.lamps[k]) for (const l of LAMPS[k]) addPL(l[0], l[1], l[2], l[3], l[4], l[5], l[6]);
  if (G.laptopOpen && tod.dark) addPL(5.3, 1.0, 1.3, 1.8, 0.3, 0.4, 0.6);
}

// ---------- loop ----------
function stepSim(dt) {
  G.time += dt; IN.update();
  if (IN.take('jump')) catJump(); if (IN.take('meow')) doMeow(); if (IN.take('zoom')) catZoom();
  buildContext();
  if (IN.take('mis') && CTX.mis && !catBusy()) CTX.mis.fn();
  if (IN.take('charm') && CTX.charm && !catBusy()) CTX.charm.fn();
  if (IN.take('finish') && G.canFinish) { finishLesson(true, 'done'); return; }
  catUpdate(dt); simCat(dt); simHumans(dt); propsUpdate(dt); doorsUpdate(dt); LESSON.update(dt);
  G.clock += LESSON.rate * dt; G.tod = LESSON.tod(G.clock);
  for (let i = G.narr.length - 1; i >= 0; i--) { if (i < 2) G.narr[i].t -= dt; if (G.narr[i].t <= 0) G.narr.splice(i, 1); }
  for (let i = G.pops.length - 1; i >= 0; i--) { G.pops[i].t -= dt; if (G.pops[i].t <= 0) G.pops.splice(i, 1); }
  for (let i = G.later.length - 1; i >= 0; i--) { const l = G.later[i]; l.t -= dt; if (l.t <= 0) { G.later.splice(i, 1); l.f(); } }
  if (G.pops.length > 12) G.pops.splice(0, G.pops.length - 12);
  if (G.phase !== 'play') return;
  if (CAT.dignity <= 0) finishLesson(false, 'dignity'); else if (G.clock >= LESSON.end) LESSON.onDeadline();
}
function idleStep(dt) { G.time += dt; for (const h of HUM) { humanPoseUpdate(h, dt); h.talkT -= dt; if (h.bubble) { h.bubble.t -= dt; if (h.bubble.t <= 0) h.bubble = null; } } const P = CAT.pose; if (G.phase === 'menu' || G.phase === 'brief') { P.loaf = 1; P.eye = 0.35 + (Math.sin(G.time * 0.7) > 0.96 ? -0.3 : 0); } }
let _last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - _last) / 1000); _last = now; RSTAT.fps = lerp(RSTAT.fps, 1 / Math.max(dt, 1e-3), 0.05);
  // one bad frame must not freeze the game: log the first error and keep going
  try {
    if (!TEST) { if (G.phase === 'play' && !G.paused) { if (G.slow > 0) G.slow -= dt; stepSim(dt * (G.slow > 0 ? 0.4 : 1)); } else if (!G.paused) idleStep(dt); }
  } catch (e) { if (!frame.err) { frame.err = e; console.error('sim step failed', e); } }
  camUpdate(dt); buildScene(); renderFrame(SETTINGS.quality); hudUpdate(dt);
}

// ---------- boot ----------
buildAtlas(); buildWorld(); navBuild(); showMenu();
requestAnimationFrame(frame);

// ---------- test API ----------
window.ST = {
  G, CAT, HUM, IN, CTX, PROPS, DOORS, BOWL, RSTAT, LESSONS, SAVE,
  start(i) { startLesson(i); }, lesson: () => LESSON,
  step(sec) { const n = Math.round(sec * 60); for (let i = 0; i < n && G.phase === 'play'; i++) { stepSim(1 / 60); camUpdate(1 / 60); } },
  render() { camUpdate(0.0001); buildScene(); renderFrame(SETTINGS.quality); hudUpdate(0.016); },
  input(o) { IN.override = o; }, press(n) { IN.press(n); },
  tp(x, z, h, y) { CAT.x = x; CAT.z = z; if (h !== undefined) CAT.h = h; CAT.y = y !== undefined ? y : topAt(x, z).y; CAT.vy = 0; CAT.vx = CAT.vz = 0; CAT.mode = 'free'; CAT.sit = null; CAT.act = null; CAT.jump = null; camSnap(); },
  setQuality(q) { SETTINGS.quality = q; }, navFree, navPath, supportAt, topAt, humanSees, finish(w) { finishLesson(w !== false, 'done'); },
  state() { return { phase: G.phase, clock: fmtClock(G.clock), cat: { x: +CAT.x.toFixed(2), z: +CAT.z.toFixed(2), y: +CAT.y.toFixed(2), h: +CAT.h.toFixed(2), mode: CAT.mode, sit: CAT.sit && CAT.sit.kind, dignity: Math.round(CAT.dignity), meals: CAT.meals }, mis: CTX.mis && CTX.mis.label, charm: CTX.charm && CTX.charm.label,
    staff: HUM.map(h => ({ n: h.name, x: +h.x.toFixed(2), z: +h.z.toFixed(2), plan: h.planName, pose: h.pose, awake: h.awake, sleep: Math.round(h.sleep), pat: Math.round(h.patience), guilt: Math.round(h.guilt), will: h.demand ? Math.round(h.demand.will) : null, say: h.bubble && h.bubble.text, seat: h.seat })),
    obj: LESSON.obj.map(o => o.id + ':' + (o.done ? 'Y' : o.n || 0)), extra: LESSON.extra.filter(e => e.done).map(e => e.id), bowl: BOWL.food, canFinish: G.canFinish, result: G.result, status: LESSON.status() }; }
};
