<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>First Light</title>
<style>
  :root { --ink:#f4ead8; --dim:#cdbfa6; --gold:#e9b65a; --panel:rgba(28,20,16,.78); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#1a1410; color:var(--ink); font:15px/1.4 Georgia,'Times New Roman',serif; overflow:hidden; overscroll-behavior:none; user-select:none; -webkit-user-select:none; touch-action:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #grain { position:fixed; inset:0; pointer-events:none; mix-blend-mode:overlay; opacity:.22; }
  #vig { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(20,10,5,.42) 100%); }
  .hud { position:fixed; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  #tl { left:max(14px,env(safe-area-inset-left)); top:12px; }
  #tl b { font-size:17px; letter-spacing:.04em; } #tl span { color:var(--dim); display:block; font-size:13px; }
  #tr { right:max(14px,env(safe-area-inset-right)); top:12px; text-align:right; }
  #tr b { font-size:22px; color:var(--gold); } #tr span { display:block; color:var(--dim); font-size:13px; }
  #ammo { right:max(14px,env(safe-area-inset-right)); bottom:14px; text-align:right; font-size:14px; }
  #ammo b { font-size:24px; }
  #toast { left:50%; top:16%; transform:translateX(-50%); text-align:center; font-size:19px; transition:opacity .5s; opacity:0; white-space:nowrap; }
  #toast small { display:block; font-size:14px; color:var(--gold); }
  #hint { left:50%; bottom:14px; transform:translateX(-50%); color:var(--dim); font-size:13px; text-align:center; white-space:nowrap; }
  #cross { left:50%; top:50%; width:0; height:0; }
  #cross i { position:absolute; display:block; }
  #cross .dot { left:-2px; top:-2px; width:4px; height:4px; border-radius:50%; background:rgba(255,245,225,.9); box-shadow:0 0 2px #000; }
  #cross .ring { left:-22px; top:-22px; width:44px; height:44px; border-radius:50%; border:1.5px solid rgba(255,245,225,.75); box-shadow:0 0 2px rgba(0,0,0,.6); }
  #cross .pin { left:-3px; width:6px; height:6px; border-radius:50%; box-shadow:0 0 3px #000; }
  #scope, #bino { position:fixed; inset:0; pointer-events:none; display:none; }
  #scope { background:radial-gradient(circle at 50% 50%, transparent 0, transparent min(40vh,44vw), rgba(0,0,0,.55) calc(min(40vh,44vw) + 3px), #000 calc(min(40vh,44vw) + 14px)); }
  #scope:before, #scope:after { content:''; position:absolute; background:rgba(10,8,6,.85); }
  #scope:before { left:50%; top:calc(50% - min(40vh,44vw)); width:1.5px; height:calc(2*min(40vh,44vw)); margin-left:-.75px; }
  #scope:after { top:50%; left:calc(50% - min(40vh,44vw)); height:1.5px; width:calc(2*min(40vh,44vw)); margin-top:-.75px; }
  #bino { background:radial-gradient(ellipse 47vw 43vh at 50% 50%, transparent 95%, #000 100%); }
  #drawbar { left:50%; top:calc(50% + 60px); width:120px; height:6px; margin-left:-60px; border:1px solid rgba(255,245,225,.6); border-radius:3px; display:none; }
  #drawbar i { display:block; height:100%; width:0; background:var(--gold); border-radius:2px; }
  .tbtn { position:fixed; display:none; align-items:center; justify-content:center; border-radius:50%; border:2px solid rgba(244,234,216,.55); background:rgba(28,20,16,.42); color:var(--ink); font:600 13px/1 Georgia,serif; letter-spacing:.05em; touch-action:none; }
  .tbtn.on { background:rgba(233,182,90,.5); }
  body.touch.play .tbtn { display:flex; }
  #bFire { right:max(18px,env(safe-area-inset-right)); bottom:64px; width:92px; height:92px; font-size:16px; }
  #bAim { right:max(124px,calc(env(safe-area-inset-right) + 106px)); bottom:40px; width:68px; height:68px; }
  #bCall { left:max(18px,env(safe-area-inset-left)); bottom:40px; width:68px; height:68px; }
  #bReload { left:max(98px,calc(env(safe-area-inset-left) + 80px)); bottom:22px; width:60px; height:60px; font-size:11px; }
  #bBino { left:max(18px,env(safe-area-inset-left)); bottom:120px; width:60px; height:60px; font-size:11px; }
  #bPause { right:max(14px,env(safe-area-inset-right)); top:64px; width:42px; height:42px; }
  body.touch #hint { display:none; } body.touch #ammo { bottom:166px; }
  .screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:14px; overflow:auto; touch-action:pan-y;
    background:radial-gradient(ellipse at 30% 20%, rgba(233,150,90,.35), transparent 60%), linear-gradient(#2a2330,#4a3328 45%,#2a1d14); }
  .screen.show { display:flex; }
  #pause, #results { background:rgba(20,14,10,.72); }
  .card { width:min(680px,100%); background:var(--panel); border:1px solid rgba(233,182,90,.35); border-radius:14px; padding:20px 22px; box-shadow:0 12px 50px rgba(0,0,0,.5); margin:auto; }
  h1 { margin:0 0 2px; font-size:34px; font-weight:normal; letter-spacing:.06em; color:var(--gold); }
  h2 { margin:16px 0 8px; font-size:14px; font-weight:normal; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  p { margin:4px 0; color:var(--dim); }
  .row { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); }
  .opt { pointer-events:auto; cursor:pointer; text-align:left; padding:10px 12px; border-radius:10px; border:1.5px solid rgba(244,234,216,.22); background:rgba(255,255,255,.04); color:var(--ink); font:inherit; }
  .opt b { display:block; font-size:16px; font-weight:normal; } .opt span { color:var(--dim); font-size:12.5px; display:block; }

  table { width:100%; border-collapse:collapse; margin-top:6px; } td { padding:3px 0; color:var(--dim); } td:last-child { text-align:right; color:var(--ink); }

<div class="screen show" id="menu"><div class="card">
  <h1>First Light</h1>

  <h2>Where</h2><div class="row" id="areaRow"></div>

  <table id="rTable"></table>
  <button class="go" id="bAgain">Hunt again</button>

</div></div>
<script>
'use strict';
/* =========================================================================
   FIRST LIGHT — painterly Gaussian-splat stand hunting
   World axes: +y up, the hunter sits at the origin looking toward -z.
   Animal-local axes: +x nose, +y up, +z right side.
   Splat record = 48 bytes: pos f32x3 | U f32x3 | V f32x3 | rgb+ao u8x4 | normal i8x4 | tier, flags, alpha, sway u8x4
   tier  0 opaque daub with a lobed edge · 1 soft brush stroke · 2 soft particle · 3 emissive
   flags 2 translucent (leaves, reeds: lit from both sides, glow when backlit) · 8 sways in the wind · 16 anchored at its base (blades)
   See ../SPLAT-GUIDE.md for the shared renderer notes and AGENTS.md here for the map of this file.
   ========================================================================= */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, PI = Math.PI, DEG = Math.PI / 180;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrap = a => { a = (a + PI) % TAU; if (a < 0) a += TAU; return a - PI; };
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
const TOUCH = matchMedia('(pointer:coarse)').matches || QS.has('touch');
const LOW = TOUCH || QS.has('low');            // phones and tablets get a lighter scene

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry32(1);                         // swapped between the scenery RNG and the gameplay RNG
const gameRnd = mulberry32((QS.get('seed') | 0) || (TEST ? 7 : (Date.now() & 0x7fffffff)));
const R = (a = 0, b = 1) => a + (b - a) * rnd();
const pick = a => a[Math.min(a.length - 1, Math.floor(rnd() * a.length))];
function gauss() { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rnd()); }

const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v); }
function fbm(x, y, o = 4) { let a = 1, f = 1, s = 0, w = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); w += a; a *= 0.5; f *= 2.03; } return s / w; }

/* ---------- mat4 (column-major) ---------- */
function m4() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; }
function m4mul(a, b) { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; }
function m4T(x, y, z) { const m = m4(); m[12] = x; m[13] = y; m[14] = z; return m; }
function m4S(s) { const m = m4(); m[0] = m[5] = m[10] = s; return m; }
function m4RX(a) { const c = Math.cos(a), s = Math.sin(a), m = m4(); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; }
function m4RY(a) { const c = Math.cos(a), s = Math.sin(a), m = m4(); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; }
function m4RZ(a) { const c = Math.cos(a), s = Math.sin(a), m = m4(); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; }
function m4chain(...ms) { let o = ms[0]; for (let i = 1; i < ms.length; i++) o = m4mul(o, ms[i]); return o; }
function m4pt(m, p) { return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13], m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14]]; }
function perspective(fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f); return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * nf, -1, 0, 0, 2 * f * n * nf, 0]); }
function viewMat(e, f) { const s = norm(cross(f, [0, 1, 0])), u = cross(s, f); return new Float32Array([s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0, -dot(s, e), -dot(u, e), dot(f, e), 1]); }

/* =========================================================================
   SPLAT BUILDER
   ========================================================================= */
class SB {
  constructor() { this.d = []; this.n = 0; }
  add(p, U, V, c, n, tier = 0, flags = 0, alpha = 1, sway = 0) {
    this.d.push(p[0], p[1], p[2], U[0], U[1], U[2], V[0], V[1], V[2], c[0], c[1], c[2], c[3] ?? 1, n[0], n[1], n[2], tier, flags, alpha, sway); this.n++;
  }
  pack() {
    const buf = new ArrayBuffer(this.n * 48), f = new Float32Array(buf), u = new Uint8Array(buf), s = new Int8Array(buf), d = this.d;
    for (let i = 0; i < this.n; i++) {
      const o = i * 20, b = i * 48, fo = i * 12;
      for (let k = 0; k < 9; k++) f[fo + k] = d[o + k];
      for (let k = 0; k < 4; k++) u[b + 36 + k] = clamp(Math.round(d[o + 9 + k] * 255), 0, 255);
      for (let k = 0; k < 3; k++) s[b + 40 + k] = clamp(Math.round(d[o + 13 + k] * 127), -127, 127);
      u[b + 44] = d[o + 16]; u[b + 45] = d[o + 17]; u[b + 46] = clamp(Math.round(d[o + 18] * 255), 0, 255); u[b + 47] = clamp(Math.round(d[o + 19]), 0, 255);
    }
    return buf;
  }
  template() {           // compact local template for per-frame transformed objects (animals, weapons)
    const f = new Float32Array(this.n * 12), c = new Uint8Array(this.n * 8), d = this.d;
    for (let i = 0; i < this.n; i++) {
      const o = i * 20;
      for (let k = 0; k < 9; k++) f[i * 12 + k] = d[o + k];
      f[i * 12 + 9] = d[o + 13]; f[i * 12 + 10] = d[o + 14]; f[i * 12 + 11] = d[o + 15];
      for (let k = 0; k < 4; k++) c[i * 8 + k] = clamp(Math.round(d[o + 9 + k] * 255), 0, 255);
      c[i * 8 + 4] = d[o + 16]; c[i * 8 + 5] = d[o + 17]; c[i * 8 + 6] = clamp(Math.round(d[o + 18] * 255), 0, 255); c[i * 8 + 7] = clamp(Math.round(d[o + 19]), 0, 255);
    }
    return { n: this.n, f, c };
  }
}
// Sample a parametric surface P(u,v) -> [x,y,z] | null into splats. col(u,v,p,n) -> [r,g,b,ao] | null.
// opt: cover, tier, flags, flip, jit, strokes (probability of a brush stroke on top), strokeAlong ('u'|'v'), sway
function surf(sb, P, nu, nv, col, opt = {}) {
  const cover = opt.cover ?? 1.0, tier = opt.tier ?? 0, flags = opt.flags ?? 0, flip = opt.flip ? -1 : 1, jit = opt.jit ?? 0.5, sway = opt.sway ?? 0;
  const eu = 0.5 / nu, ev = 0.5 / nv;
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    const u = clamp((i + 0.5 + (rnd() - 0.5) * jit) / nu, 0, 1), v = clamp((j + 0.5 + (rnd() - 0.5) * jit) / nv, 0, 1);
    const p = P(u, v); if (!p) continue;
    const u1 = Math.min(1, u + eu), u0 = Math.max(0, u - eu), v1 = Math.min(1, v + ev), v0 = Math.max(0, v - ev);
    const pa = P(u1, v) || p, pb = P(u0, v) || p, pc = P(u, v1) || p, pd = P(u, v0) || p;
    const du = u1 - u0, dv = v1 - v0; if (du <= 0 || dv <= 0) continue;
    let U = mul(sub(pa, pb), cover / (nu * du)), V = mul(sub(pc, pd), cover / (nv * dv));
    let lu = len(U), lv = len(V);
    if (lu < 1e-4 && lv < 1e-4) continue;
    const mn = opt.min ?? 0.004;                 // degenerate directions (poles) still get a small daub
    if (lu < mn) { const t = norm(cross(V, [0.3, 1, 0.2])); U = mul(t, mn); lu = mn; }
    if (lv < mn) { const t = norm(cross(U, [0.3, 1, 0.2])); V = mul(t, mn); lv = mn; }
    const n = mul(norm(cross(U, V)), flip);
    const c = col(u, v, p, n); if (!c) continue;
    sb.add(p, U, V, c, n, tier, flags, 1, sway);
    if (opt.strokes && rnd() < opt.strokes) {      // painterly stroke on top, slightly off-colour
      const k = 0.78 + rnd() * 0.5, along = opt.strokeAlong === 'v';
      const SU = along ? mul(U, 0.5) : mul(U, 1.8), SV = along ? mul(V, 1.8) : mul(V, 0.5);
      sb.add(add(p, mul(n, 0.012 + lu * 0.08)), SU, SV, [c[0] * k, c[1] * k, c[2] * (k * 0.95), c[3]], n, 1, flags, 0.9, sway);
    }
  }
}
function line(sb, a, b, w, c, flags = 0, seg = 0.4) {      // two crossed strips so it reads from any angle
  const d = sub(b, a), L = len(d); if (L < 1e-4) return;
  const dir = mul(d, 1 / L), n = Math.max(1, Math.ceil(L / seg));
  let s1 = cross(dir, [0, 1, 0]); if (len(s1) < 0.1) s1 = cross(dir, [1, 0, 0]); s1 = norm(s1);
  const s2 = norm(cross(dir, s1)), U = mul(dir, L / n * 0.62);
  for (let i = 0; i < n; i++) {
    const p = add(a, mul(d, (i + 0.5) / n));
    sb.add(p, U, mul(s1, w), c, s2, 0, flags); sb.add(p, U, mul(s2, w), c, s1, 0, flags);
  }
}
const cyl = (sb, a, b, r0, r1, col, opt = {}) => {
  const d = sub(b, a), L = len(d), dir = mul(d, 1 / L);
  let e1 = cross(dir, Math.abs(dir[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]); e1 = norm(e1); const e2 = cross(dir, e1);
  const sp = opt.sp ?? 0.22, nu = opt.nu ?? Math.max(5, Math.ceil(TAU * Math.max(r0, r1) / sp)), nv = opt.nv ?? Math.max(2, Math.ceil(L / (sp * 1.4)));
  surf(sb, (u, v) => { const a_ = u * TAU, r = lerp(r0, r1, v); return add(add(a, mul(d, v)), add(mul(e1, Math.cos(a_) * r), mul(e2, Math.sin(a_) * r))); }, nu, nv, col, { cover: 1.15, ...opt });
};
// ellipsoid centred c with radii r; taper(u) optionally scales the cross-section along x (u = 0 at -x, 1 at +x)

  let lookId = null, lx = 0, ly = 0;
  canvas.addEventListener('touchstart', e => { audio(); if (G.mode !== 'hunt') return; e.preventDefault(); if (lookId === null) { const t = e.changedTouches[0]; lookId = t.identifier; lx = t.clientX; ly = t.clientY; } }, { passive: false });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === lookId) { look((t.clientX - lx) * 2.2, (t.clientY - ly) * 2.2); lx = t.clientX; ly = t.clientY; } }, { passive: false });
  const endT = e => { for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null; };
  canvas.addEventListener('touchend', endT); canvas.addEventListener('touchcancel', endT);
  const btn = (id, down, up) => { const el = $(id); el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); audio(); down(); }, { passive: false }); el.addEventListener('touchend', e => { e.preventDefault(); up && up(); }, { passive: false }); el.addEventListener('mousedown', e => { e.stopPropagation(); down(); }); el.addEventListener('mouseup', () => up && up()); };
  btn('bFire', fireDown, fireUp); btn('bAim', () => { G.aiming = !G.aiming; if (G.aiming) G.bino = false; }); btn('bCall', useCall); btn('bReload', startReload); btn('bBino', () => { G.bino = !G.bino; if (G.bino) G.aiming = false; }); btn('bPause', pauseHunt);
  addEventListener('resize', resize);
  addEventListener('blur', () => { if (!TEST) pauseHunt(); });
}
function paintGrain() {                           // canvas-weave texture laid over the whole picture
  const c = $('grain'), n = 256; c.width = c.height = n; c.style.width = c.style.height = '100%'; c.style.imageRendering = 'auto';
  const x = c.getContext('2d'), im = x.createImageData(n, n), r = mulberry32(77);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const w = 128 + 46 * (Math.sin(i * 1.9) * 0.5 + Math.sin(j * 1.9) * 0.5) + (r() - 0.5) * 70, o = (j * n + i) * 4; im.data[o] = im.data[o + 1] = im.data[o + 2] = clamp(w, 0, 255); im.data[o + 3] = 255; }
  x.putImageData(im, 0, 0); c.style.background = 'none';
  const url = c.toDataURL(); c.replaceWith(Object.assign(document.createElement('div'), { id: 'grain', style: `background:url(${url});background-size:256px 256px` }));
}

// Test API: load with ?test (no menu, fixed seed, sim only advances through FL.step).
function targets() { const o = []; for (const b of G.beasts) if (b.state !== 'down' && b.delay <= 0 && b.spheres.length) o.push({ kind: b.kind, p: b.spheres[0].c, v: b.vel, ref: b }); for (const f of G.flocks) for (const b of f.birds) if (b.p && (b.state === 'fly' || b.state === 'swim')) o.push({ kind: f.kind, p: b.p, v: b.v, ref: b }); return o; }
window.FL = {
  start(area = 'stand', weapon = 'rifle') { startHunt(area, weapon); return this.state(); },
  step(s) { const n = Math.round(s * 60); for (let i = 0; i < n; i++) update(1 / 60); return this.state(); },
  state() { return { mode: G.mode, area: G.area, weapon: G.weapon, t: +G.t.toFixed(2), score: G.score, shots: G.shots, hits: G.shotHit.size, taken: G.taken, lost: G.lost, bag: G.bag, mag: G.mag, splats: G.splats, dyn: dn, msaa: MSAA,
    beasts: G.beasts.map(b => ({ kind: b.kind, state: b.state, x: +b.x.toFixed(1), z: +b.z.toFixed(1), dmg: +b.dmg.toFixed(1) })), flocks: G.flocks.map(f => ({ kind: f.kind, state: f.state, n: f.birds.length, pos: f.pos.map(v => +v.toFixed(1)), wi: f.wi })), toast: G.lastToast }; },
  spawn(kind, opt) { return SPECIES[kind].type === 'bird' ? !!spawnFlock(kind, opt) : !!spawnBeast(kind, opt); },
  look(yaw, pitch) { G.yaw = yaw; G.pitch = pitch; },
  aimAt(i = 0, zone = 0) {                         // ballistic lead on target i; returns the range
    const T = targets()[i]; if (!T) return -1; const w = WEAPONS[G.weapon], v = w.v * (G.weapon === 'bow' ? 1 : 1); let p = T.ref.spheres ? T.ref.spheres[zone].c : T.p, t = 0, aim = p;
    for (let k = 0; k < 5; k++) { const lead = add(p, mul(T.v, t)), o = add(EYE, mul(norm(sub(lead, EYE)), 0.7)); t = len(sub(lead, o)) / v; aim = add(lead, [0, 0.5 * 9.8 * t * t, 0]); }
    const d = norm(sub(aim, EYE)); G.yaw = Math.atan2(d[0], -d[2]); G.pitch = Math.asin(d[1]) - G.recoil; return len(sub(p, EYE));
  },
  fire(power = 1) { if (G.weapon === 'bow') { if (G.mag > 0 && G.reload <= 0) { shoot(power); return true; } return false; } const s = G.shots; fireDown(); return G.shots > s; },
  call: useCall, end: endHunt, setDay(d) { G.t = d * HUNT_LEN; setEnv(d); }, aim(on) { G.aiming = on; G.aim = on ? 1 : 0; }, bino(on) { G.bino = on; G.binoT = on ? 1 : 0; },
  cam(eye, at, fov, gun) { camOverride = eye ? { eye, at, fov: fov ? fov * DEG : 0, gun } : null; }, draw(v) { G.draw = v; G.drawing = v > 0; }, G
};
paintGrain(); buildMenu(); bindInput(); resize();
if (TEST) startHunt(QS.get('area') || 'stand', QS.get('weapon') || 'rifle');
requestAnimationFrame(frame);
