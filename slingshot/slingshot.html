<!DOCTYPE html>
<html lang="en">
<head>

<style>

<script>
'use strict';
// =====================================================================
//  SLINGSHOT — hold to draw, release to fire. Hold past full draw and the
//  band strains (more range, shakier aim) until it snaps. Ouch.
//  Rendering mix: Gaussian-splat terrain + regular mesh targets wearing
//  Gaussian-painted textures, with a toggle to render targets as splat skins.
//  Test API: window.SS   URL flags: ?test &seed=N &q=low|medium|high &touch &desktop
// =====================================================================
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
const SEED = parseInt(QS.get('seed') || '1337', 10) || 1337;
const QUAL = ['low', 'medium', 'high'].includes(QS.get('q')) ? QS.get('q') : ((('ontouchstart' in window) || navigator.maxTouchPoints > 0) && !QS.has('desktop') ? 'low' : 'medium');
const TOUCH = QS.has('touch') || (!QS.has('desktop') && (('ontouchstart' in window) || navigator.maxTouchPoints > 0));
const DENS = { low: 0.4, medium: 0.7, high: 1.0 }[QUAL];
const DEG = Math.PI / 180;
if (TOUCH) document.body.classList.add('touch');

// ---------------------------------------------------------------- rng / noise
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32(SEED);
const grand = mulberry32(SEED * 31 + 99);
const R = (a, b) => a + (b - a) * rand();
const GR = (a, b) => a + (b - a) * grand();
const PERM = new Uint8Array(512);
{ const r = mulberry32(SEED * 7 + 1); const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; }
function hash2(x, y) { return PERM[(PERM[x & 255] + y) & 255] / 255; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y); const xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); n += a; f *= 2.03; a *= 0.5; } return s / n; }
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const lerp = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------- vectors / matrices
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};
// mat3 column-major (9)
const M3 = {
  I: () => [1, 0, 0, 0, 1, 0, 0, 0, 1],
  mul(a, b) { const o = new Array(9); for (let c = 0; c < 3; c++) for (let r = 0; r < 3; r++) o[c * 3 + r] = a[r] * b[c * 3] + a[3 + r] * b[c * 3 + 1] + a[6 + r] * b[c * 3 + 2]; return o; },
  axis(ax, an) { const [x, y, z] = ax, c = Math.cos(an), s = Math.sin(an), t = 1 - c; return [t * x * x + c, t * x * y + s * z, t * x * z - s * y, t * x * y - s * z, t * y * y + c, t * y * z + s * x, t * x * z + s * y, t * y * z - s * x, t * z * z + c]; },
  rx: a => M3.axis([1, 0, 0], a), ry: a => M3.axis([0, 1, 0], a), rz: a => M3.axis([0, 0, 1], a),
  apply: (m, v) => [m[0] * v[0] + m[3] * v[1] + m[6] * v[2], m[1] * v[0] + m[4] * v[1] + m[7] * v[2], m[2] * v[0] + m[5] * v[1] + m[8] * v[2]],
  applyT: (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]],
  ortho(m) { let x = V.norm([m[0], m[1], m[2]]); let y = [m[3], m[4], m[5]]; let z = V.norm(V.cross(x, y)); y = V.cross(z, x); return [...x, ...y, ...z]; },
};
const M4 = {
  I() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(a, b) { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; },
  persp(fov, asp, n, f) { const t = 1 / Math.tan(fov / 2), m = new Float32Array(16); m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m; },
  view(eye, r, u, b) { return new Float32Array([r[0], u[0], b[0], 0, r[1], u[1], b[1], 0, r[2], u[2], b[2], 0, -V.dot(r, eye), -V.dot(u, eye), -V.dot(b, eye), 1]); },
  RT(R, t, s) { s = s || [1, 1, 1]; return new Float32Array([R[0] * s[0], R[1] * s[0], R[2] * s[0], 0, R[3] * s[1], R[4] * s[1], R[5] * s[1], 0, R[6] * s[2], R[7] * s[2], R[8] * s[2], 0, t[0], t[1], t[2], 1]); },
  T(x, y, z) { const m = M4.I(); m[12] = x; m[13] = y; m[14] = z; return m; },
  inv(m) {
    const a = m, o = new Float32Array(16);
    const b00 = a[0] * a[5] - a[1] * a[4], b01 = a[0] * a[6] - a[2] * a[4], b02 = a[0] * a[7] - a[3] * a[4], b03 = a[1] * a[6] - a[2] * a[5], b04 = a[1] * a[7] - a[3] * a[5], b05 = a[2] * a[7] - a[3] * a[6];
    const b06 = a[8] * a[13] - a[9] * a[12], b07 = a[8] * a[14] - a[10] * a[12], b08 = a[8] * a[15] - a[11] * a[12], b09 = a[9] * a[14] - a[10] * a[13], b10 = a[9] * a[15] - a[11] * a[13], b11 = a[10] * a[15] - a[11] * a[14];
    let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06; if (!det) return o; det = 1 / det;
    o[0] = (a[5] * b11 - a[6] * b10 + a[7] * b09) * det; o[1] = (a[2] * b10 - a[1] * b11 - a[3] * b09) * det; o[2] = (a[13] * b05 - a[14] * b04 + a[15] * b03) * det; o[3] = (a[10] * b04 - a[9] * b05 - a[11] * b03) * det;
    o[4] = (a[6] * b08 - a[4] * b11 - a[7] * b07) * det; o[5] = (a[0] * b11 - a[2] * b08 + a[3] * b07) * det; o[6] = (a[14] * b02 - a[12] * b05 - a[15] * b01) * det; o[7] = (a[8] * b05 - a[10] * b02 + a[11] * b01) * det;
    o[8] = (a[4] * b10 - a[5] * b08 + a[7] * b06) * det; o[9] = (a[1] * b08 - a[0] * b10 - a[3] * b06) * det; o[10] = (a[12] * b04 - a[13] * b02 + a[15] * b00) * det; o[11] = (a[9] * b02 - a[8] * b04 - a[11] * b00) * det;
    o[12] = (a[5] * b07 - a[4] * b09 - a[6] * b06) * det; o[13] = (a[0] * b09 - a[1] * b07 + a[2] * b06) * det; o[14] = (a[13] * b01 - a[12] * b03 - a[14] * b00) * det; o[15] = (a[8] * b03 - a[9] * b01 + a[10] * b00) * det;
    return o;
  },
};

// ---------------------------------------------------------------- world: terrain
const SUN = V.norm([-0.5, 0.75, 0.45]);
const SUNCOL = [1.0, 0.95, 0.85];
function H(x, z) {
  let h = (fbm(x * 0.035 + 11, z * 0.035 + 7) - 0.5) * 3.0;
  const lane = smooth(8, 26, Math.abs(x));
  h *= 0.3 + 0.7 * lane;
  h += lane * (fbm(x * 0.02, z * 0.02 + 40) - 0.3) * 4.0;
  h += smooth(-115, -230, z) * (22 + 20 * (fbm(x * 0.012 + 3, 9) - 0.5));
  h += smooth(-150, -260, z) * 10 * (fbm(x * 0.03, z * 0.03) - 0.4);
  return h;
}
function Hn(x, z) { const e = 0.4; return V.norm([H(x - e, z) - H(x + e, z), 2 * e, H(x, z - e) - H(x, z + e)]); }
function pathX(z) { return Math.sin(z * 0.07) * 1.3 + Math.sin(z * 0.023 + 1) * 1.1; }
function groundColor(x, z) {
  const n1 = fbm(x * 0.05 + 3, z * 0.05 + 9, 3), n2 = fbm(x * 0.13 + 20, z * 0.13, 3), n3 = vnoise(x * 0.7, z * 0.7);
  let r = 0.30 + 0.17 * n1, g = 0.47 + 0.14 * n1, b = 0.16 + 0.05 * n2;
  const dry = smooth(0.55, 0.72, n2) * 0.7; r += (0.64 - r) * dry; g += (0.57 - g) * dry; b += (0.30 - b) * dry;
  if (z < 9 && z > -92) { const dp = Math.abs(x - pathX(z)); const pw = 0.6 + 0.25 * n3; const k = 1 - smooth(pw * 0.55, pw, dp); r += (0.52 - r) * k; g += (0.42 - g) * k; b += (0.28 - b) * k; }
  const hill = smooth(-135, -185, z) * 0.8; r += (0.21 - r) * hill; g += (0.33 - g) * hill; b += (0.19 - b) * hill;
  const v = 0.9 + 0.2 * n3; return [r * v, g * v, b * v];
}
function onPath(x, z) { return z < 9 && z > -92 && Math.abs(x - pathX(z)) < 0.75; }
// same lighting model the mesh shader uses, baked into terrain splats
function litCol(c, n, ao = 1) {
  const d = Math.max(V.dot(n, SUN), 0), t = n[1] * 0.5 + 0.5;
  const amb = [lerp(0.36, 0.56, t), lerp(0.34, 0.62, t), lerp(0.30, 0.72, t)];
  return [c[0] * (amb[0] * 0.78 + SUNCOL[0] * d * 0.92) * ao, c[1] * (amb[1] * 0.78 + SUNCOL[1] * d * 0.92) * ao, c[2] * (amb[2] * 0.78 + SUNCOL[2] * d * 0.92) * ao];
}
const PLAYER = [0, 0, 0];
PLAYER[1] = H(0, 0) + 1.6;

// ---------------------------------------------------------------- GL setup
const cv = document.getElementById('gl');
const hud = document.getElementById('hud2d');
const hx = hud.getContext('2d');
const gl = cv.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('ovText').textContent = 'This game needs WebGL2, which this browser does not provide.'; throw new Error('no webgl2'); }
function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(vs, fs) {
  const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); for (let i = 0; i < n; i++) { const inf = gl.getActiveUniform(p, i); u[inf.name] = gl.getUniformLocation(p, inf.name); }
  return { p, u };
}
const FOGCOL = [0.80, 0.85, 0.84];
const FOGK = 0.0042;

const SPLAT_VS = `#version 300 es
layout(location=0) in vec2 aC; layout(location=1) in vec3 aP; layout(location=2) in vec3 aA; layout(location=3) in vec3 aB; layout(location=4) in vec4 aCol;
uniform mat4 uVP, uModel; uniform vec3 uCam, uSun, uTint; uniform float uLit, uTime, uFogK;
out vec2 vUv; out vec3 vCol; out float vFog;
void main(){
  vec3 p = aP + aA*aC.x*2.0 + aB*aC.y*2.0;
  float tip = max(aC.y,0.0)*aCol.a;
  p.x += sin(uTime*1.7 + aP.x*0.45 + aP.z*0.31)*0.07*tip;
  p.z += cos(uTime*1.3 + aP.x*0.23 + aP.z*0.5)*0.05*tip;
  vec4 w = uModel*vec4(p,1.0);
  gl_Position = uVP*w;
  vec3 col = aCol.rgb*uTint;
  if(uLit>0.5){
    vec3 n = normalize(mat3(uModel)*cross(aA,aB));
    float d = max(dot(n,uSun),0.0);
    vec3 amb = mix(vec3(0.36,0.34,0.30), vec3(0.56,0.62,0.72), n.y*0.5+0.5);
    col *= amb*0.78 + vec3(1.0,0.95,0.85)*d*0.92;
  }
  vCol = col; vUv = aC*2.0;
  vFog = 1.0 - exp(-length(w.xyz-uCam)*uFogK);
}`;
const SPLAT_FS = `#version 300 es
precision highp float;
in vec2 vUv; in vec3 vCol; in float vFog; uniform vec3 uFog; out vec4 o;
void main(){ float a = exp(-0.5*dot(vUv,vUv)); if(a<0.06) discard; o = vec4(mix(vCol,uFog,vFog), min(1.0,a*1.6)); }`;

const MESH_VS = `#version 300 es
layout(location=0) in vec3 aP; layout(location=1) in vec3 aN; layout(location=2) in vec2 aUV;
uniform mat4 uVP, uModel; out vec3 vN; out vec2 vUV; out vec3 vW;
void main(){ vec4 w = uModel*vec4(aP,1.0); vW = w.xyz; vN = mat3(uModel)*aN; vUV = aUV; gl_Position = uVP*w; }`;
const MESH_FS = `#version 300 es
precision highp float;
in vec3 vN; in vec2 vUV; in vec3 vW;
uniform sampler2D uTex; uniform vec3 uTint, uSun, uCam, uFog; uniform float uSpec, uFogK;
out vec4 o;
void main(){
  vec3 n = normalize(vN); vec3 v = normalize(uCam - vW); if(dot(n,v)<0.0) n = -n;

function update(dt) {

    else {

  const left = targets.filter(t => !t.scored).length; $('tgtLeft').textContent = targets.length ? `Targets left: ${left} / ${targets.length}` : '';
  $('score').textContent = G_.score;
  $('pebN').textContent = G_.pebbles;
  $('pebDots').innerHTML = Array.from({ length: LEVELS[G_.level].pebbles }, (_, i) => `<span class="${i < G_.pebbles ? '' : 'off'}"></span>`).join('');
  $('bandDots').innerHTML = Array.from({ length: BAND_MAX }, (_, i) => `<span class="${i < G_.bands ? '' : 'off'}"></span>`).join('');
  $('skinLbl').textContent = G_.skin ? 'Targets: Gaussian splat skins' : 'Targets: meshes w/ Gaussian textures';
  $('skinBtn').classList.toggle('on', G_.skin === 1); $('hintBtn').classList.toggle('on', G_.hint); $('zoomBtn').classList.toggle('on', G_.zoom);
}
function showMsg(title, sub, dur) { const m = $('msg'); m.innerHTML = `${title}${sub ? `<small>${sub}</small>` : ''}`; m.style.opacity = 1; G_.msgT = dur; }
let ovAction = null;
function showOverlay(title, html, btn, action) { $('ovTitle').textContent = title; $('ovText').innerHTML = html; $('ovBtn').textContent = btn; $('ovBtn').style.display = ''; $('ov').classList.remove('hide'); ovAction = action || null; }
function hideOverlay() { $('ov').classList.add('hide'); }
function lock() { if (TEST) return; try { const p = cv.requestPointerLock(); if (p && p.catch) p.catch(() => { }); } catch (e) { } }
function unlock() { G_.drawing = false; G_.wantDraw = false; creak(0, 400); if (document.pointerLockElement) document.exitPointerLock(); }
function overlayGo() {
  auInit();
  if (G_.mode === 'title' || G_.mode === 'win' || G_.mode === 'over') startGame();
  else if (G_.mode === 'between') loadLevel(G_.level + 1);
  else if (G_.mode === 'fail') { G_.score = G_.levelStartScore; loadLevel(G_.level); }
  else if (G_.mode === 'paused') { G_.mode = 'play'; hideOverlay(); }
  lock();
}
$('ovBtn').addEventListener('click', e => { e.stopPropagation(); overlayGo(); });
const TITLE_HTML = `<p>Hold to pull the band back — the longer you hold, the farther the pebble flies. Past <b>full draw</b> the rubber starts to <b>strain</b>: a little more range and a shakier aim, until it <b>snaps</b>. Ouch.</p>
<p>Three ranges: cans on the fence, bottles and pie tins, then long shots at bullseyes and balloons. Pebbles are limited, and so are spare bands.</p>
<p>${TOUCH ? 'Drag to aim · hold <b>HOLD</b> to draw, let go to fire · <b>Zoom</b> for long shots · <b>Skins</b> swaps target rendering · <b>Arc</b> shows the flight path.' : '<kbd>Mouse</kbd> aim · hold <kbd>Left</kbd> or <kbd>Space</kbd> to draw, release to fire · <kbd>Right</kbd>/<kbd>Z</kbd> zoom · <kbd>G</kbd> target skins (Gaussian-textured mesh / splat skin) · <kbd>H</kbd> arc hint · <kbd>R</kbd> retry level · <kbd>M</kbd> mute'}</p>`;

// ---------------------------------------------------------------- input
const SENS = 0.0022;
function look(dx, dy) { const k = SENS * (G_.fov / (60 * DEG)); G_.yaw = clamp(G_.yaw + dx * k, -75 * DEG, 75 * DEG); G_.pitch = clamp(G_.pitch - dy * k, -30 * DEG, 50 * DEG); }
document.addEventListener('mousemove', e => { if (document.pointerLockElement === cv && G_.mode === 'play') look(e.movementX, e.movementY); });
cv.addEventListener('mousedown', e => {
  if (G_.mode !== 'play') return;
  if (document.pointerLockElement !== cv) { lock(); return; }
  if (e.button === 0) pressDraw(); else if (e.button === 2) G_.zoom = true;
});
document.addEventListener('mouseup', e => { if (e.button === 0) releaseDraw(); else if (e.button === 2) G_.zoom = false; });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && G_.mode === 'play' && !TOUCH && !TEST) { G_.mode = 'paused'; unlock(); showOverlay('Paused', '<p style="text-align:center">Click to resume.</p>', 'Resume'); } });
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); pressDraw(); }
  if (k === 'z' || k === 'shift') G_.zoom = true;
  if (k === 'g') { G_.skin = 1 - G_.skin; updateHUD(); }
  if (k === 'h') { G_.hint = !G_.hint; updateHUD(); }
  if (k === 'm') { AU.muted = !AU.muted; if (AU.out) AU.out.gain.value = AU.muted ? 0 : 0.7; }
  if (k === 'r' && G_.mode === 'play') { G_.score = G_.levelStartScore; loadLevel(G_.level); }
  if (k === 'enter' && !$('ov').classList.contains('hide') && $('ovBtn').style.display !== 'none') overlayGo();
});
document.addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === ' ') releaseDraw(); if (k === 'z' || k === 'shift') G_.zoom = false; });
// touch: drag anywhere to look, buttons for draw / zoom / toggles
// Touch input uses plain Touch Events (reliable on iOS Safari and Android Chrome; pointer capture threw on phones).
// Each finger is tracked by identifier: a finger that starts on HOLD draws, one on a toggle button flips it,
// any other finger in play drags the aim. Several fingers at once are fine (aim while holding).
const tLook = new Map(); let tFire = null;
const btnOf = el => el && el.closest ? el.closest('.tbtn') : null;
function onTouchStart(e) {
  if (!$('ov').classList.contains('hide')) return; // let the overlay's button receive a normal click
  e.preventDefault(); auInit();
  for (const t of e.changedTouches) {
    const b = btnOf(document.elementFromPoint(t.clientX, t.clientY)) || btnOf(t.target);
    if (b && b.id === 'fireBtn') { if (tFire === null) { tFire = t.identifier; b.classList.add('on'); pressDraw(); } }
    else if (b && b.id === 'zoomBtn') { G_.zoom = !G_.zoom; updateHUD(); }
    else if (b && b.id === 'skinBtn') { G_.skin = 1 - G_.skin; updateHUD(); }
    else if (b && b.id === 'hintBtn') { G_.hint = !G_.hint; updateHUD(); }
    else tLook.set(t.identifier, [t.clientX, t.clientY]);
  }
}
function onTouchMove(e) {
  if (!tLook.size && tFire === null) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = tLook.get(t.identifier); if (!p) continue;
    if (G_.mode === 'play') look((t.clientX - p[0]) * 1.3, (t.clientY - p[1]) * 1.3);
    tLook.set(t.identifier, [t.clientX, t.clientY]);
  }
}
function onTouchEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === tFire) { tFire = null; $('fireBtn').classList.remove('on'); releaseDraw(); }
    tLook.delete(t.identifier);
  }
  if (tLook.size || tFire !== null || e.touches.length) e.preventDefault();
}
document.addEventListener('touchstart', onTouchStart, { passive: false });
document.addEventListener('touchmove', onTouchMove, { passive: false });
document.addEventListener('touchend', onTouchEnd, { passive: false });
document.addEventListener('touchcancel', onTouchEnd, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault()); // iOS pinch-zoom

// ---------------------------------------------------------------- loop
let last = performance.now(), frames = 0, fpsT = 0, fps = 0;
const SPEED = { run: !TEST };
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (SPEED.run && G_.mode !== 'paused' && G_.mode !== 'loading') update(dt);
  frames++; fpsT += dt; if (fpsT > 1) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  if (G_.mode !== 'loading') render();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- test API
window.SS = {
  ready: false,
  state: () => ({ mode: G_.mode, level: G_.level, score: G_.score, pebbles: G_.pebbles, bands: G_.bands, draw: +G_.d.toFixed(3), strainT: +G_.strainT.toFixed(3), drawing: G_.drawing, loaded: G_.loaded, repair: G_.repairT > 0, ouchCount: G_.ouchCount, targetsLeft: targets.filter(t => !t.scored).length, targets: targets.length, skin: G_.skin, splats: world ? world.n : 0, parts: parts.length, flying: pebblesFlying.length, fps: Math.round(fps), yaw: +(G_.yaw / DEG).toFixed(2), pitch: +(G_.pitch / DEG).toFixed(2) }),
  start() { startGame(); return this.state(); },
  level(i) { loadLevel(i); return this.state(); },
  tick(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); render(); return this.state(); },
  aim(yawDeg, pitchDeg) { G_.yaw = yawDeg * DEG; G_.pitch = pitchDeg * DEG; render(); return this.state(); },
  press() { pressDraw(); return this.state(); }, release() { releaseDraw(); return this.state(); },
  fire(d) { if (!G_.loaded || G_.pebbles <= 0) return false; fire(d); return true; },
  snap() { snapBand(); return this.state(); },
  setBreakAt(s) { G_.breakAt = s; },
  skin(m) { G_.skin = m; updateHUD(); render(); }, hint(b) { G_.hint = b; render(); }, zoom(b) { G_.zoom = b; },
  run(b) { SPEED.run = b; },
  targets: () => targets.map(t => ({ type: t.type, state: t.state, scored: t.scored, pos: t.pos.map(v => +v.toFixed(2)) })),
  solve(i, d = 1) {
    const t = targets[i]; const o = PLAYER; const dx = t.pos[0] - o[0], dz = t.pos[2] - o[2];
    const yaw = Math.atan2(dx, -dz), D = Math.hypot(dx, dz); let best = null;
    for (let p = -10; p <= 40; p += 0.05) {
      const pt = p * DEG; const { f } = camBasis(yaw, pt); let yAt = null; const org = launchOrigin(f);
      simulate(org, V.mul(f, launchSpeed(d)), 6, q => { if (Math.hypot(q[0] - org[0], q[2] - org[2]) >= D - 0.6) { yAt = q[1]; return false; } });
      if (yAt !== null) { const e = Math.abs(yAt - t.pos[1]); if (!best || e < best.e) best = { e, pitch: p }; if (best.e < 0.01) break; }
    }
    return { yaw: yaw / DEG, pitch: best ? best.pitch : 0, err: best ? best.e : 99 };
  },
  overlay: () => ({ visible: !$('ov').classList.contains('hide'), title: $('ovTitle').textContent }),
  go() { overlayGo(); return this.state(); },
};

// ---------------------------------------------------------------- boot
function boot() {
  try {
    resize();
    const t0 = performance.now();
    buildTextures(); buildMeshes(); genWorld(); buildSkins();
    console.log(`[slingshot] built in ${Math.round(performance.now() - t0)} ms, terrain splats ${world.n}, quality ${QUAL}`);
    G_.mode = 'title'; G_.level = 0; updateHUD();
    showOverlay('SLINGSHOT', TITLE_HTML, 'Play');
    SS.ready = true;
    requestAnimationFrame(t => { last = t; frame(t); });
  } catch (e) { console.error(e); $('ovText').textContent = 'Error: ' + e.message; }
}
setTimeout(boot, 30);
</script>
</body>
