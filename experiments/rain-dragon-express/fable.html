<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rain Dragon Express</title>
<style>

  #wrap{position:relative;width:min(100vw,177.778vh);aspect-ratio:16/9;background:#000}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,11,20,.5);cursor:pointer;transition:opacity .35s}
  #cover.hide{opacity:0;pointer-events:none}
  #big{width:96px;height:96px;border-radius:50%;border:2px solid var(--paper);background:rgba(239,229,207,.08);display:grid;place-items:center}
  #big svg{width:40px;height:40px;fill:var(--paper)}
  #cover h1{margin:0;font-weight:500;letter-spacing:.34em;font-size:clamp(14px,2.2vw,26px);text-indent:.34em}
  #cover p{margin:0;opacity:.7;letter-spacing:.2em;font-size:clamp(10px,1.2vw,13px);text-transform:uppercase}
  #bar{position:absolute;left:0;right:0;bottom:0;padding:26px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;background:linear-gradient(transparent,rgba(10,11,20,.86));transition:opacity .3s}
  #wrap.idle #bar{opacity:0}
  #wrap.idle{cursor:none}
  button{appearance:none;border:0;background:none;color:var(--paper);width:40px;height:40px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
  button:hover{background:rgba(239,229,207,.12)} button:focus-visible{outline:2px solid var(--amber)}
  button svg{width:22px;height:22px;fill:currentColor}
  #q{width:auto;padding:0 8px;font:600 11px system-ui,sans-serif;letter-spacing:.08em}
  #time{font-variant-numeric:tabular-nums;font-size:13px;opacity:.85;flex:none;min-width:86px;text-align:center}
  #seek{flex:1;min-width:60px;height:26px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer;--p:0%}
  #seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--amber) var(--p),rgba(239,229,207,.3) var(--p))}
  #seek::-moz-range-track{height:4px;border-radius:2px;background:rgba(239,229,207,.3)} #seek::-moz-range-progress{height:4px;border-radius:2px;background:var(--amber)}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--paper);margin-top:-5px}
  #seek::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--paper)}
  #note{position:absolute;left:14px;top:12px;font-size:12px;opacity:.6;letter-spacing:.06em;pointer-events:none}
</style>
</head>
