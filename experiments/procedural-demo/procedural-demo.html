<!doctype html><meta charset="utf-8" /><meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>
<title>Volcanic Island Walk</title>
<style>
  * {
    box-sizing: border-box;
  }
  html,
  body,
  canvas {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #88c9dd;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #ui {
    position: fixed;
    inset: 0;
    color: #f7f2e8;
    pointer-events: none;
    font: 11px system-ui;
    letter-spacing: 0.12em;
    text-shadow: 0 1px 3px #123;
  }
  h1 {
    position: absolute;
    left: 29px;
    top: 24px;
    margin: 0;
    font: 500 22px Georgia;
    letter-spacing: 0.18em;
  }
  p {
    position: absolute;
    left: 30px;
    bottom: 19px;
    margin: 0;
    font-size: 10px;
  }
  nav {
    position: absolute;
    right: 22px;
    bottom: 20px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
    pointer-events: auto;
  }
  #touch {
    display: none;
    position: absolute;
    inset: auto 0 14px;
    justify-content: space-between;
    padding: 0 16px;
    pointer-events: auto;
  }
  .pad {
    width: 92px;
    height: 92px;
    border: 1px solid #e9f3d580;
    border-radius: 50%;
    background: #174b5766;
    display: grid;
    place-items: center;
    color: #f7f2e8cc;
    font-size: 9px;
    touch-action: none;
  }
  button {
    min-width: 40px;
    min-height: 40px;
    border: 1px solid #dce9d6aa;
    border-radius: 16px;
    padding: 7px 12px;
    background: #174b57b8;
    color: #fff;
    font: 10px system-ui;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  button[aria-pressed="true"],
  button:focus-visible {
    background: #2a7484;
    border-color: #fff;
    outline: 2px solid #e9f3d5;
    outline-offset: 2px;
  }
  @media (min-width: 561px) and (max-width: 1060px) {
    #hint { bottom: 112px; max-width: calc(100% - 52px); }
  }
  #error {
    display: none;
    place-items: center;
    position: fixed;
    inset: 0;
    background: #123;
    color: #fff;
    font: 16px system-ui;
    z-index: 4;
  }
  #loading { position:fixed; inset:0; display:grid; place-items:center; color:#f7f2e8; background:#286779; font:14px system-ui; letter-spacing:.12em; z-index:3; }
  @media (max-width: 560px), (pointer: coarse) {
    p {
      bottom: 76px;
      left: 20px;
    }
    nav {
      right: 12px;
      bottom: 14px;
      gap: 4px;
    }
    #touch { display: flex; }
    nav { bottom: 116px; }
    button {
      padding: 6px 9px;
      font-size: 9px;
    }
  }</style
><canvas></canvas>
<div id="ui">
  <h1>VOLCANIC ISLAND WALK</h1>
  <p id="hint">WASD to walk · drag to look · swim inside the reef</p>
  <nav>
    <button data-view="walk" aria-pressed="true">WALK</button>
    <button data-view="0" aria-pressed="false">AERIAL</button>
    <button data-view="1" aria-pressed="false">STRAND</button>
    <button data-view="2" aria-pressed="false">REEF</button>
    <button data-view="falls" aria-pressed="false">FALLS</button>
    <button data-view="stream" aria-pressed="false">STREAM</button>
    <button data-view="grove" aria-pressed="false">GROVE</button>
    <button data-view="lava" aria-pressed="false">LAVA</button>
    <button data-view="vent" aria-pressed="false">VENT</button>
    <button data-view="storm" aria-pressed="false">STORM</button>
    <button data-view="mute" aria-pressed="false">SOUND</button>
  </nav>
  <div id="touch"><div class="pad" id="movePad">MOVE</div><div class="pad" id="lookPad">LOOK</div></div>
</div>
<div id="loading">Generating island…</div><div id="error">This island needs WebGL 2.</div>
<script>
  (() => {
    requestAnimationFrame(() => setTimeout(() => { try {
    const canvas = document.querySelector("canvas"),
      gl = canvas.getContext("webgl2", { alpha: false, antialias: true, depth: true, stencil: true }),
      error = document.querySelector("#error");
    if (!gl) {
      document.querySelector("#loading").style.display = "none";
      error.style.display = "grid";
      return;
    }
    function program(v, f) {
      const p = gl.createProgram();
      for (const [type, s] of [
        [gl.VERTEX_SHADER, v],
        [gl.FRAGMENT_SHADER, f],
      ]) {
        const q = gl.createShader(type);
        gl.shaderSource(q, s);
        gl.compileShader(q);
        if (!gl.getShaderParameter(q, gl.COMPILE_STATUS))
          throw Error(gl.getShaderInfoLog(q));
        gl.attachShader(p, q);
      }
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        throw Error(gl.getProgramInfoLog(p));
      return p;
    }
    const skyV = `#version 300 es
layout(location=0)in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`;
    const distantSeaGLSL = `vec3 farSea(vec3 ray){
  float travel=max(.06,eye.y)/max(.00002,-ray.y);vec2 p=eye.xz+ray.xz*min(travel,35000.);
  float fp=max(length(dFdx(p)),length(dFdy(p)));vec2 wind=mat2(.86,.51,-.51,.86)*p;
  vec2 large=vec2(.69,-.45)*.063*cos(dot(wind,vec2(.075,.036))-t*.58+.7*sin(wind.y*.043));
  large+=vec2(.29,.73)*.065*cos(dot(wind,vec2(-.080,.148))+t*.81+1.2*sin(wind.x*.035));
  vec2 detail=wind*vec2(.095,.165)+vec2(-t*.12,t*.066);
  vec2 rough=vec2(n(detail+vec2(.15,0.))-n(detail-vec2(.15,0.)),n(detail+vec2(0.,.15))-n(detail-vec2(0.,.15)))*.43;
  vec2 slope=large*(1.-smoothstep(2.,18.,fp))+rough*(1.-smoothstep(.8,9.,fp));
  vec3 normal=normalize(vec3(-slope.x,1.,-slope.y)),reflected=reflect(ray,normal);
  vec3 skyTint=mix(vec3(.60,.76,.81),vec3(.13,.38,.59),pow(max(0.,reflected.y),.45));
  float fres=.035+.72*pow(1.-max(0.,dot(-ray,normal)),4.2);
  vec3 ocean=mix(vec3(.029,.13,.22),skyTint,fres*.72);
  float glint=pow(max(0.,dot(normal,normalize(normalize(vec3(-.64,.48,.55))-ray))),150.);
  ocean+=vec3(.80,.72,.48)*glint*.50;
  vec3 horizon=mix(vec3(.60,.76,.81),vec3(.22,.29,.35),stormBlend);ocean=mix(ocean,ocean*vec3(.52,.62,.70),stormBlend*.7);return mix(horizon,ocean,exp(-travel*.00072));
}`;
    const skyF = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform float t, aspect, tanHalfFov, stormBlend, lightning, boltJitter;
uniform vec3 eye, forward, right, up, boltDir;
uniform sampler2D bathy;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fb(vec2 p){return .516*(n(p)+.5*n(p*2.02)+.25*n(p*4.1)+.125*n(p*8.2)+.0625*n(p*16.4));}
float field(vec2 p){return fb(p+1.5*vec2(fb(p*.55+8.),fb(p*.55-12.)));}
// A 170m cloud deck.  The anchor preserves the former default composition,
// while camera translation introduces finite-altitude parallax.
vec2 cloudCoord(vec3 d){float h=max(.065,d.y+.065);vec2 p=(eye.xz-vec2(101.,-40.)+d.xz*(170./h))*.014117647;vec2 wind=vec2(.87,.49);return p-wind*t*.018+vec2(fb(p*.48+vec2(t*.002,-t*.001)),fb(p*.48+vec2(9.-t*.0015,4.)))*.055;}

float skyBolt(vec3 d){float facing=dot(d,boltDir);if(facing<.78||d.y<.028)return 0.;vec3 side=normalize(cross(vec3(0.,1.,0.),boltDir)),vertical=normalize(cross(boltDir,side));float u=dot(d,side)/facing,v=dot(d,vertical)/facing,span=smoothstep(-.11,-.075,v)*(1.-smoothstep(.285,.40,v)),zig=.010*sin((v+.08)*(71.+31.*boltJitter)+boltJitter*17.)+.005*sin((v+.08)*(173.+43.*boltJitter)+boltJitter*31.),taper=.35+.65*smoothstep(-.10,.07,v),trunk=(1.-smoothstep(.0011,.0062*taper,abs(u-zig)))*span;float forkSpan=smoothstep(.085,.105,v)*(1.-smoothstep(.205,.225,v)),fork=zig+.30*(v-.105)*(1.+.35*boltJitter),branch=(1.-smoothstep(.0010,.0042*taper,abs(u-fork)))*forkSpan;return max(trunk,branch*.58);}float skyGlow(vec3 d){float facing=dot(d,boltDir);if(facing<.78)return 0.;vec3 side=normalize(cross(vec3(0.,1.,0.),boltDir)),vertical=normalize(cross(boltDir,side));vec2 q=vec2(dot(d,side),dot(d,vertical)-.20*facing)/facing;return 1.-smoothstep(.035,.21,length(q));}vec3 sky(vec3 d){vec3 sun=normalize(vec3(-.64,.48,.55));float hi=max(d.y,0.);vec3 c=mix(vec3(.70,.83,.87),vec3(.10,.34,.61),pow(hi,.55));vec2 p=cloudCoord(d);float den=smoothstep(.55,.72,field(p)+.07*fb(p*2.7));float light=clamp(.52+3.8*(field(p)-field(p+.18*sun.xz)),.15,1.);vec3 cloud=mix(vec3(.55,.64,.70),vec3(.99,.98,.91),light);c=mix(c,cloud,den*.74);float veil=smoothstep(.63,.82,fb(p*.27-vec2(.87,.49)*t*.002+7.));c=mix(c,vec3(.83,.88,.90),veil*.12);float shelf=smoothstep(-.10,.24,d.y)*(1.-smoothstep(.18,.62,d.y))*(.58+.42*fb(p*.55-vec2(t*.018,0.)));vec3 stormCloud=mix(vec3(.045,.070,.10),vec3(.15,.21,.27),fb(p*.72));c=mix(c,stormCloud,max(shelf,den*.54)*stormBlend);float shaft=smoothstep(.16,.72,fb(p*.65+vec2(t*.035,-t*.01)))*smoothstep(.02,.42,d.y)*(1.-smoothstep(.12,.48,d.y));c=mix(c,vec3(.16,.24,.29),shaft*stormBlend*.62);float disk=pow(max(dot(d,sun),0.),700.);c+=vec3(1.,.79,.48)*(disk*5.+pow(max(dot(d,sun),0.),18.)*.18)*(1.-stormBlend*.86);float bolt=0.,glow=0.;if(lightning>.001){bolt=skyBolt(d)*lightning;glow=skyGlow(d)*lightning;}c+=vec3(.20,.32,.48)*glow*.48+vec3(.78,.89,1.)*bolt*2.4;vec3 horizon=mix(vec3(.60,.76,.81),vec3(.22,.29,.35),stormBlend);return mix(horizon,c,smoothstep(.012,.105,max(d.y,0.)));}
${distantSeaGLSL}
void main(){vec2 screen=uv*2.-1.;vec3 ray=normalize(forward+right*screen.x*aspect*tanHalfFov+up*screen.y*tanHalfFov);if(ray.y>=0.){o=vec4(sky(ray),1.);return;}o=vec4(farSea(ray),1.);}`;
    // One shoreline field drives water, wet sand, mark removal and the CPU
    // walker.  R is signed metres (land positive); G/B are the inward normal.
    const shoreGLSL = `uniform sampler2D shore;
vec2 shoreUV(vec2 p){return clamp((p+vec2(150.,100.))/vec2(300.,200.),0.,1.)*vec2(159./160.,111./112.)+.5/vec2(160.,112.);}
float marineAt(vec2 p){vec2 raw=(p+vec2(150.,100.))/vec2(300.,200.);if(any(lessThan(raw,vec2(0.)))||any(greaterThan(raw,vec2(1.))))return 1.;return texture(shore,shoreUV(p)).a;}
vec3 shoreInfo(vec2 p){vec3 s=texture(shore,shoreUV(p)).rgb;return vec3((s.r*2.-1.)*48.,normalize(s.gb*2.-1.));}
float shoreBand(float d){return smoothstep(-16.,-6.,d)*(1.-smoothstep(2.2,6.2,d));}
float shoreSet(vec2 p,float tt){return .68+.32*sin(dot(p,vec2(.009,.014))-tt*.17);}
// The phase remains a moving train all the way across the breaker zone.  Its
// shore-normal term is slightly compressed at the beach so a set pitches,
// spills and runs up instead of flattening into a stationary lap.
float shorePhase(vec2 p,vec3 si,float tt){float sea=max(-si.x,0.),travel=-sea*(.79+.11*sea/(1.+sea)),group=.56+.44*sin(dot(p,vec2(.018,-.027))-tt*.22+.7*sin(dot(p,vec2(.006,.013))));vec2 coast=p-si.yz*si.x;return travel*(1.27+.23*shoreSet(p,tt))-tt*2.48+.82*sin(dot(coast,vec2(.071,-.046)))+.46*group;}
float shorePhase(vec2 p,float tt){return shorePhase(p,shoreInfo(p),tt);}
float breakerZone(float d){return smoothstep(-9.,-5.6,d)*(1.-smoothstep(.35,2.5,d));}
float breakerPulse(vec2 p,vec3 si,float tt){float phase=shorePhase(p,si,tt),crest=smoothstep(.18,.76,max(0.,sin(phase))),peel=.60+.40*sin(dot(p-si.yz*si.x,vec2(.19,-.13))+tt*.24+.8*sin(dot(p,vec2(.047,.063))));return crest*smoothstep(.12,.88,peel);}
float surfWave(vec2 p,vec3 si,float tt){float marine=marineAt(p),lagoon=0.;if(marine<.999){lagoon=.012*sin(dot(p,vec2(1.48,-.93))+tt*1.74)+.007*sin(dot(p,vec2(-2.37,-1.82))-tt*2.28+.7*sin(dot(p,vec2(.12,.17))));if(marine<.001)return lagoon;}float d=si.x,band=shoreBand(d),off=smoothstep(8.,28.,-d),set=shoreSet(p,tt);float swell=.20*sin(dot(p,vec2(.115,.065))-tt*1.12+.19*sin(dot(p,vec2(.021,-.037))) )+.075*sin(dot(p,vec2(.38,-.22))+tt*1.9)+.035*sin(dot(p,vec2(1.3,.9))-tt*3.2);float phase=shorePhase(p,si,tt),pulse=breakerPulse(p,si,tt),head=pow(max(0.,sin(phase)),2.)*(.10+.16*set),roll=breakerZone(d)*pulse*(.13+.12*set),run=.040*sin(phase)+head;float ocean=swell*(.24+.76*off)+band*run+roll;return marine<.999?mix(lagoon,ocean,marine):ocean;}
float surfWave(vec2 p,float tt){return surfWave(p,shoreInfo(p),tt);}
float shoreBreak(vec2 p,float tt){vec3 si=shoreInfo(p);return marineAt(p)*breakerZone(si.x)*breakerPulse(p,si,tt);}
// A finite 4.1-second run-up reconstruction: old fronts advect seaward
// along each locally sampled shore normal and shear sideways as they drain.
float crestHistory(vec2 p,float tt){float marine=marineAt(p);if(marine<.01)return 0.;float wash=0.;for(int k=1;k<=5;k++){float age=float(k)*.82;vec3 s=shoreInfo(p);vec2 side=vec2(-s.z,s.y);vec2 past=p+s.yz*(.42+.31*age)*age+side*(.18*sin(age*3.7+dot(p,vec2(.17,-.11)))+.11*sin(age*7.1+dot(p,vec2(.43,.29))));vec3 old=shoreInfo(past);float pulse=max(0.,sin(shorePhase(past,old,tt-age)));wash=max(wash,smoothstep(.16,.84,pulse)*exp(-age*.38)*(.94-.09*float(k)));}return wash*marine;}`;
    // The same wrapped, non-random gust train is inserted in every moving
    // shader. Two irregular periods leave real calm gaps but never exhaust.
    const windGLSL = `uniform sampler2D shelterMap;uniform float stormBlend;float shelterAt(vec2 p){vec2 uv=(p+vec2(150.,100.))/vec2(300.,200.);if(any(lessThan(uv,vec2(0.)))||any(greaterThan(uv,vec2(1.))))return 1.;return texture(shelterMap,uv).r;}float gustPulse(vec2 p,float tt){vec2 w=vec2(.87,.49),c=vec2(-.49,.87);float q=dot(p,w)-tt*8.4+110.;float a=abs(fract(q/148.)-.5)*148.,b=abs(fract((q+47.)/241.)-.5)*241.;float head=max(exp(-(a*a)/420.),.72*exp(-(b*b)/260.));float cross=dot(p,c)+7.*sin(q*.035);float ribbon=exp(-(cross*cross)/5200.);float teeth=.18+.82*max(0.,sin(q*.10+.4*sin(q*.027)));return clamp(head*ribbon*teeth*shelterAt(p),0.,1.);}vec2 windDrive(vec2 p,float tt,float phase){float elastic=.42*sin(tt*.83+phase+dot(p,vec2(.021,-.016)))+.16*sin(tt*1.67-phase*.7+dot(p,vec2(.049,.027)));float trade=.34+.18*sin(dot(p,vec2(.043,-.031))-tt*.43+phase)+.11*sin(dot(p,vec2(-.018,.057))+tt*.71-phase*.7)+elastic;float gust=gustPulse(p,tt);vec2 cross=vec2(-.49,.87)*(.12*sin(dot(p,vec2(.071,.029))+tt*.63+phase)+.055*sin(tt*1.7+phase*2.));return vec2(.87,.49)*(trade+gust*.72+stormBlend*(.64+gust*.92))+cross;}`;
    // Winding lanes are shared by the baked shelf and outer breaker gaps.
    const reefGLSL = `float reefGaps(float a,float r){float phase=a*3.1+r*11.+.65*sin(a*5.);return 1.-smoothstep(.10,.37,abs(sin(phase)));}`;
    const waterV = `#version 300 es
precision highp float;layout(location=0)in vec2 xz;uniform mat4 m;uniform float t;out vec3 world,N;out float crest,reef;
${windGLSL}${shoreGLSL}${reefGLSL}
float edgeFade(vec2 p){return 1.-smoothstep(.78,.99,max(abs(p.x)/600.,abs(p.y)/480.));}void main(){float e=.28,y=surfWave(xz,t)*edgeFade(xz),dx=surfWave(xz+vec2(e,0.),t)*edgeFade(xz+vec2(e,0.))-surfWave(xz-vec2(e,0.),t)*edgeFade(xz-vec2(e,0.)),dz=surfWave(xz+vec2(0.,e),t)*edgeFade(xz+vec2(0.,e))-surfWave(xz-vec2(0.,e),t)*edgeFade(xz-vec2(0.,e));world=vec3(xz.x,y,xz.y);N=normalize(vec3(-dx/(2.*e),1.,-dz/(2.*e)));float a=atan(xz.y/124.,xz.x/164.),r=length(xz/vec2(164.,124.))/(1.+.052*sin(a*3.+.45)+.025*sin(a*7.-1.2));float rock=1.-reefGaps(a,r),rim=smoothstep(.955,.982,r)*(1.-smoothstep(1.012,1.040,r))*rock;float ridgePhase=sin(r*31.-t*2.05+a*2.7+.55*sin(a*9.));float ridge=rim*(.22+.18*pow(max(0.,ridgePhase),2.))*smoothstep(.24,.72,.5+.5*sin(a*17.+r*11.));y+=ridge;world.y=y;reef=smoothstep(.76,.985,r)*rock;crest=shoreBreak(xz,t)+ridge;gl_Position=m*vec4(world,1.);}`;
    // The final water source is materialized in its own template: no GLSL
    // post-processing remains in the render path.
    const waterF = `#version 300 es
precision highp float;
in vec3 world,N;in float crest,reef;uniform vec3 eye;uniform float t;uniform sampler2D ground,bathy,reefMap;out vec4 o;${windGLSL}${shoreGLSL}${reefGLSL}
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}float fb(vec2 p){return n(p)+.5*n(p*2.02)+.25*n(p*4.1);}vec2 reefHash2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}vec3 reefSurface(vec2 p,float m){if(m<.39)return vec3(0.);vec2 q=p*9.4,i=floor(q),f=fract(q),delta=vec2(9.);float nearest=9.;for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y)),o=.18+.64*reefHash2(i+g),v=g+o-f;float d=length(v);if(d<nearest){nearest=d;delta=v;}}float u=clamp((nearest-.20)/.36,0.,1.),bud=1.-u*u*(3.-2.*u),db=-6.*u*(1.-u)/.36,maze=pow(max(0.,sin(p.x*13.7+.8*sin(p.y*6.1))*sin(p.y*11.9-.6*sin(p.x*7.7))),2.8),family=smoothstep(.64,.77,m),shape=mix(bud,max(bud*.48,maze),family),foot=smoothstep(.032,.115,max(length(dFdx(p)),length(dFdy(p))));vec2 grad=db*9.4*delta/max(nearest,.001)*(1.-family*.58);return vec3(shape*(1.-foot),grad*(1.-foot));}float field(vec2 p){return fb(p+1.5*vec2(fb(p*.55+8.),fb(p*.55-12.)));}vec2 cloudCoord(vec3 d){float hh=max(.065,d.y+.065);vec2 p=(eye.xz-vec2(101.,-40.)+d.xz*(170./hh))*.014117647;return p-vec2(.87,.49)*t*.018+vec2(fb(p*.48+vec2(t*.002,-t*.001)),fb(p*.48+vec2(9.-t*.0015,4.)))*.055;}vec3 reflectSky(vec3 d){float hi=max(d.y,0.);vec3 c=mix(vec3(.60,.76,.81),vec3(.10,.34,.61),pow(hi,.55));vec2 p=cloudCoord(d);float den=smoothstep(.55,.72,field(p)+.07*fb(p*2.7));float light=clamp(.52+3.8*(field(p)-field(p+vec2(-.115,.099))),.15,1.);return mix(c,mix(vec3(.55,.64,.70),vec3(.99,.98,.91),light),den*.74);}${distantSeaGLSL}
void main(){
  vec2 map=world.xz/vec2(300.,200.)+.5;
  float floor=texture(ground,map).r*4.-2.;
  float closeDepth=world.y-floor,bathyDepth=texture(bathy,map).r*22.;
  float depth=mix(closeDepth,bathyDepth,smoothstep(.85,2.25,closeDepth));
  if(closeDepth<-.03)discard;

  vec3 V=normalize(eye-world),sun=normalize(vec3(-.64,.48,.55));
  float marine=marineAt(world.xz);
  float gust=gustPulse(world.xz,t)*(.26+.74*marine)+stormBlend*.12*(1.-marine);
  vec2 gp=world.xz*vec2(.72,1.18)+vec2(-t*.16,t*.11)+vec2(.87,.49)*gust*.085;
  vec2 g=vec2(n(gp+vec2(.05,0.))-n(gp-vec2(.05,0.)),n(gp+vec2(0.,.05))-n(gp-vec2(0.,.05)))*(1.5+gust*.75+stormBlend*1.65)*mix(.13+.12*stormBlend,1.,marine);
  vec3 NN=normalize(N+vec3(-g.x,0.,-g.y));
  float fres=.04+.78*pow(1.-max(dot(V,NN),0.),4.);
  vec3 through=refract(-V,NN,1./1.333);

  vec2 refr=world.xz+through.xz*min(depth,5.)/max(.10,-through.y);
  vec4 habitat=texture(reefMap,refr/vec2(380.,290.)+.5);
  float coastGate=smoothstep(4.,12.,-shoreInfo(refr).x);
  float shelf=smoothstep(.012,.16,habitat.a)*coastGate;
  depth=mix(depth,habitat.r*4.,shelf);
  refr=world.xz+through.xz*(depth/max(.10,-through.y));
  habitat=texture(reefMap,refr/vec2(380.,290.)+.5);
  shelf=smoothstep(.012,.16,habitat.a)*smoothstep(4.,12.,-shoreInfo(refr).x);
