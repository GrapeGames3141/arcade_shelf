<!doctype html><meta charset="utf-8" /><meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>
<title>Volcanic Island Walk</title>
<style>
  * {
    box-sizing: border-box;
  }
  html,
  body,
  canvas {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #88c9dd;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #ui {
    position: fixed;
    inset: 0;
    color: #f7f2e8;
    pointer-events: none;
    font: 11px system-ui;
    letter-spacing: 0.12em;
    text-shadow: 0 1px 3px #123;
  }
  h1 {
    position: absolute;
    left: 29px;
    top: 24px;
    margin: 0;
    font: 500 22px Georgia;
    letter-spacing: 0.18em;
  }
  p {
    position: absolute;
    left: 30px;
    bottom: 19px;
    margin: 0;
    font-size: 10px;
  }
  nav {
    position: absolute;
    right: 22px;
    bottom: 20px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
    pointer-events: auto;
  }
  #touch {
    display: none;
    position: absolute;
    inset: auto 0 14px;
    justify-content: space-between;
    padding: 0 16px;
    pointer-events: auto;
  }
  .pad {
    width: 92px;
    height: 92px;
    border: 1px solid #e9f3d580;
    border-radius: 50%;
    background: #174b5766;
    display: grid;
    place-items: center;
    color: #f7f2e8cc;
    font-size: 9px;
    touch-action: none;
  }
  button {
    min-width: 40px;
    min-height: 40px;
    border: 1px solid #dce9d6aa;
    border-radius: 16px;
    padding: 7px 12px;
    background: #174b57b8;
    color: #fff;
    font: 10px system-ui;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  button[aria-pressed="true"],
  button:focus-visible {
    background: #2a7484;
    border-color: #fff;
    outline: 2px solid #e9f3d5;
    outline-offset: 2px;
  }
  @media (min-width: 561px) and (max-width: 1060px) {
    #hint { bottom: 112px; max-width: calc(100% - 52px); }
  }
  #error {
    display: none;
    place-items: center;
    position: fixed;
    inset: 0;
    background: #123;
    color: #fff;
    font: 16px system-ui;
    z-index: 4;
  }
  #loading { position:fixed; inset:0; display:grid; place-items:center; color:#f7f2e8; background:#286779; font:14px system-ui; letter-spacing:.12em; z-index:3; }
  @media (max-width: 560px), (pointer: coarse) {
    p {
      bottom: 76px;
      left: 20px;
    }
    nav {
      right: 12px;
      bottom: 14px;
      gap: 4px;
    }
    #touch { display: flex; }
    nav { bottom: 116px; }
    button {
      padding: 6px 9px;
      font-size: 9px;
    }
  }</style
><canvas></canvas>
<div id="ui">
  <h1>VOLCANIC ISLAND WALK</h1>
  <p id="hint">WASD to walk · drag to look · swim inside the reef</p>
  <nav>
    <button data-view="walk" aria-pressed="true">WALK</button>
    <button data-view="0" aria-pressed="false">AERIAL</button>
    <button data-view="1" aria-pressed="false">STRAND</button>
    <button data-view="2" aria-pressed="false">REEF</button>
    <button data-view="falls" aria-pressed="false">FALLS</button>
    <button data-view="stream" aria-pressed="false">STREAM</button>
    <button data-view="grove" aria-pressed="false">GROVE</button>
    <button data-view="lava" aria-pressed="false">LAVA</button>
    <button data-view="vent" aria-pressed="false">VENT</button>
    <button data-view="storm" aria-pressed="false">STORM</button>
    <button data-view="mute" aria-pressed="false">SOUND</button>
    <button data-view="trees" aria-pressed="true">GROWN TREES</button>
    <button data-view="quality" aria-pressed="false">QUALITY</button>
  </nav>
  <div id="touch"><div class="pad" id="movePad">MOVE</div><div class="pad" id="lookPad">LOOK</div></div>
</div>
<div id="loading">Generating island…</div><div id="error">This island needs WebGL 2.</div>
<script>
  (() => {

    // HDR needs a float colour target.  Without EXT_color_buffer_float every

        const h = TSmax*(k/(TSN-1))**2, o = [0, Re+h, 0], len = raySphere(o, sun, Ra), n = 40, dt = len/n, od = [0, 0, 0];

          const ct = 1-2*(a+.5)/(2*N), st = Math.sqrt(1-ct*ct), ph = (b+.5)/M*Math.PI*2, x = st*Math.cos(ph), y = ct, z = st*Math.sin(ph), dw = 4*Math.PI/(2*N*M), L = y >= 0 ? skyAt(x, y, z) : ground,
            B = [.282095, .488603*y, .488603*z, .488603*x, 1.092548*x*z, 1.092548*y*z, .315392*(3*y*y-1), 1.092548*x*y, .546274*(x*x-z*z)];

        }

      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    })();

    const LIGHT = { sunColor: new Float32Array(3), sh: new Float32Array(27), fog: new Float32Array(4), overcast: new Float32Array(SKY.overcastZenith), wet: 0 };
    function updateLight(storm, dt = 0) {
      LIGHT.wet = Math.max(0, Math.min(1, LIGHT.wet + (storm > .55 ? dt / 22 : -dt / 75)));

      for (let i = 0; i < 3; i++) LIGHT.sunColor[i] = SKY.sunColor[i]*k;
      for (let j = 0; j < 9; j++) for (let i = 0; i < 3; i++) LIGHT.sh[j*3+i] = (SKY.clearSH[j][i]*(1-storm) + SKY.overcastSH[j][i]*storm)*1.35;

    // Shared GLSL for scene fragment shaders: sky LUT, SH ambient, haze and

    const commonGLSL = `
uniform vec3 sunDir,sunColor,overcastC;uniform vec3 shA[9];uniform sampler2D skyLUT;uniform vec4 fogA,envA;uniform float exposureLDR;
float ccH(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float ccN(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(ccH(i),ccH(i+vec2(1,0)),f.x),mix(ccH(i+vec2(0,1)),ccH(i+1.),f.x),f.y);}

vec2 ccH2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}
float laceF(vec2 p){vec2 i=floor(p),f=fract(p);float d1=9.,d2=9.;for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));float d=length(g+ccH2(i+g)*.85+.075-f);if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;}float e=d2-d1,aa=fwidth(e)*1.5+.02;return mix(1.-smoothstep(0.,.16+aa,e),.62,clamp(aa*1.6,0.,1.));}

    const skyV = `#version 300 es

      lookAtBird: (k = 0) => { lifeFreeze = performance.now() * .001; buildLife(lifeFreeze, [player.x, 0, player.z]); const b = k ? lifeStats.tern : lifeStats.frigate, l = Math.hypot(b[0], b[2]) || 1, ux = b[0] / l, uz = b[2] / l; let ex = ux * 60, ez = uz * 60; for (let r = 60; r < 175; r += 1.5) { const sd = shoreline(ux * r, uz * r); if (sd.d < -3) { ex = ux * r; ez = uz * r; break; } } player.x = ex; player.z = ez; setWalk(); const ey = Math.max(gridHeight(ex, ez), 0) + 1.63; player.yaw = Math.atan2(b[0] - ex, -(b[2] - ez)); player.pitch = Math.min(1.1, Math.atan2(b[1] - ey, Math.hypot(b[0] - ex, b[2] - ez))); },
      aimAtBird: (k = 0) => { const b = k ? lifeStats.tern : lifeStats.frigate, e = RENDER.cam ? RENDER.cam.eye : [player.x, 1.6, player.z]; player.yaw = Math.atan2(b[0] - e[0], -(b[2] - e[2])); player.pitch = Math.min(1.1, Math.atan2(b[1] - e[1], Math.hypot(b[0] - e[0], b[2] - e[2]))); },
      holdCrabs: (on = true) => { crabHold = !!on; },
      seaLife: () => ({ ...seaStats, schools: schools.map((q) => ({ kind: seaKinds[q.kind].name, x: +q.tx.toFixed(1), z: +q.tz.toFixed(1), n: q.fish.length })), animals: animals.map((a) => ({ kind: seaKinds[a.kind].name, x: +a.p[0].toFixed(1), y: +a.p[1].toFixed(2), z: +a.p[2].toFixed(1) })), dolphins: pod.members.map((d) => [+d.p[0].toFixed(1), +d.p[1].toFixed(2), +d.p[2].toFixed(1)]) }),
      lookAtSea: (kind, dist = 4, az = 2.1) => { const t = seaTarget(kind); if (!t) return false; player.x = t[0] + Math.cos(az) * dist; player.z = t[2] + Math.sin(az) * dist; setWalk(); return true; },
      aimAtSea: (kind) => { const t = seaTarget(kind), e = RENDER.cam ? RENDER.cam.eye : [player.x, 1.6, player.z]; if (!t) return; player.yaw = Math.atan2(t[0] - e[0], -(t[2] - e[2])); player.pitch = Math.max(-1.1, Math.min(1.1, Math.atan2(t[1] - e[1], Math.hypot(t[0] - e[0], t[2] - e[2])))); },
      groundAt: (x, z) => gridHeight(x, z),
      creekProfile: () => { const out = []; for (let i = 0; i < streamNodes.length; i++) { const [x, z] = streamNodes[i]; out.push([+x.toFixed(2), +z.toFixed(2), +streamLengths[i].toFixed(2), +streamLevels[i].toFixed(2), +gridHeight(x, z).toFixed(2), +H(x, z).toFixed(2), +baseHeight(x, z).toFixed(2)]); } return out; },
      releaseLife: () => { lifeFreeze = null; },
      orbit: (az, el, dist, target) => { setView(0); a = az; e = el; d = dist; if (target) T = target.slice(); },
      testSpawn: (x, z) => {
        player.x = x;
        player.z = z;
        setWalk();
      },
    };
    } catch (e) { const panel=document.querySelector("#error"); panel.textContent="Island failed to generate: "+e; panel.style.display="grid"; document.querySelector("#loading").style.display="none"; console.error(e); } }, 0));
  })();
</script>
