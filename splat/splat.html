<!DOCTYPE html>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d8c9a3;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

#paper{position:fixed;inset:0;pointer-events:none;opacity:.20;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .32  0 0 0 1.1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

linear-gradient(45deg,transparent 46%,#fff 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 46% 54%,transparent 54%);-webkit-mask:radial-gradient(circle,transparent 9px,#000 10px);mask:radial-gradient(circle,transparent 9px,#000 10px)}

#bFire{right:22px;bottom:34px;width:92px;height:92px;font-size:18px;background:rgba(180,70,35,.4)}

<body>
<canvas id="c"></canvas>
<div id="paper"></div><div id="vign"></div><div id="dmg"></div>
<div id="hud">
  <div id="hpwrap"><div id="hplab">VIGOR</div><div id="hp"><div id="hpfill"></div></div></div>
  <div id="score">0</div><div id="wave">WAVE 1</div>
  <div id="cross"></div><div id="hitm"></div>
  <div id="msg"></div>
  <div id="reloadTxt">reloading</div>
  <div id="shells"></div>
</div>
<div id="touchui">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="tbtn" id="bFire">FIRE</div>
  <div class="tbtn" id="bReload">reload</div>
  <div class="tbtn" id="bJump">jump</div>
  <div class="tbtn" id="bPause">II</div>
</div>
<div id="overlay"><div id="card">
  <h1>Bug Splatter</h1>
  <div class="sub">A GAUSSIAN-SPLAT SAFARI</div>
  <p id="lead">Every blade of grass, every bug, every pellet puff here is a soft 3D Gaussian brushstroke. Giant insects are invading the meadow. Blast them apart.</p>
  <div class="ctl" id="ctl"></div>
  <button id="go" disabled>painting…</button><button type="button" data-arcade-home onclick="location.href='../index.html'" style="margin:14px 0 0 10px;font:italic 22px Georgia,serif;padding:10px 28px;border-radius:30px;border:none;background:rgba(80,50,30,.35);color:#fff6e4;cursor:pointer">Arcade Shelf</button>
  <div id="err"></div>
</div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const log = (...a) => console.log('[splat]', ...a);
function showErr(m){ const e=$('err'); e.textContent=m; e.style.display='block'; }
window.addEventListener('error', e => { console.error('[splat] ERROR', e.message, e.lineno); showErr('Error: '+e.message); });

// ---------------------------------------------------------------- config
const params = new URLSearchParams(location.search);
const TEST = params.has('test');
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || (('ontouchstart' in window) && navigator.maxTouchPoints > 0);
const QUAL = params.get('q') || (IS_TOUCH ? 'low' : 'high');
const QS = QUAL === 'low'
  ? { tufts: 9000, gsp: 0.9, D: 8192, maxIns: 6, det: 0.6, dpr: 1.25, trees: 14, leaf: 1300, bushLeaf: 160, patches: 22, singles: 700, bushes: 18, bflies: 8 }
  : { tufts: 27000, gsp: 0.6, D: 16384, maxIns: 9, det: 1.0, dpr: 1.5, trees: 22, leaf: 3400, bushLeaf: 420, patches: 40, singles: 1600, bushes: 34, bflies: 14 };
let DET = QS.det;

// ---------------------------------------------------------------- math
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function norm3(v){ const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; }
function cross(a, b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function mix3(a, b, t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function add3(a, b){ return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function sub3(a, b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function sc3(a, s){ return [a[0]*s, a[1]*s, a[2]*s]; }
function angDiff(a, b){ let d = (a - b) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; }
function turnTo(cur, tgt, step){ return cur + clamp(angDiff(tgt, cur), -step, step); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry32(90210);
const R = (a, b) => a + (b - a) * rnd();
const rr = (a, b) => a + (b - a) * Math.random();
function hash2(x, y){ let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y){ const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2(xi, yi), b = hash2(xi+1, yi), c = hash2(xi, yi+1), d = hash2(xi+1, yi+1); return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v; }
function fbm(x, y){ return vnoise(x, y)*0.5 + vnoise(x*2.03+5.2, y*2.03+1.3)*0.3 + vnoise(x*4.1+9.1, y*4.1+3.7)*0.2; }
function groundH(x, z){ return 0.9*Math.sin(x*0.045+1.3)*Math.cos(z*0.052-0.4) + 0.45*Math.sin(x*0.11+z*0.07) + 0.25*Math.cos(z*0.13-x*0.05); }
function pathDist(x, z){ return Math.abs(z - (7*Math.sin(x*0.055) + 3*Math.sin(x*0.16+1.0) - 4)); }
const SUN = norm3([0.55, 0.6, 0.42]);
// covariance helpers: [xx,xy,xz,yy,yz,zz]
function covSym(a, k, n){ return [a+k*n[0]*n[0], k*n[0]*n[1], k*n[0]*n[2], a+k*n[1]*n[1], k*n[1]*n[2], a+k*n[2]*n[2]]; }
function covDisc(s, th, n){ return covSym(s*s, th*th - s*s, n); }
function covRod(len, rad, d){ return covSym(rad*rad, len*len - rad*rad, d); }
function covBasis(d, w, n, a, b, c){ const A=a*a, B=b*b, C=c*c;
  return [A*d[0]*d[0]+B*w[0]*w[0]+C*n[0]*n[0], A*d[0]*d[1]+B*w[0]*w[1]+C*n[0]*n[1], A*d[0]*d[2]+B*w[0]*w[2]+C*n[0]*n[2],
          A*d[1]*d[1]+B*w[1]*w[1]+C*n[1]*n[1], A*d[1]*d[2]+B*w[1]*w[2]+C*n[1]*n[2], A*d[2]*d[2]+B*w[2]*w[2]+C*n[2]*n[2]]; }
// row-major 3x3, R = Ry*Rx*Rz
function euler(out, o, ry, rx, rz){ const cy=Math.cos(ry), sy=Math.sin(ry), cx=Math.cos(rx), sx=Math.sin(rx), cz=Math.cos(rz), sz=Math.sin(rz);
  out[o]=cy*cz+sy*sx*sz; out[o+1]=-cy*sz+sy*sx*cz; out[o+2]=sy*cx;
  out[o+3]=cx*sz;        out[o+4]=cx*cz;          out[o+5]=-sx;
  out[o+6]=-sy*cz+cy*sx*sz; out[o+7]=sy*sz+cy*sx*cz; out[o+8]=cy*cx; }
function mul33(out, o, A, ao, B, bo){ for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
  out[o+i*3+j] = A[ao+i*3]*B[bo+j] + A[ao+i*3+1]*B[bo+3+j] + A[ao+i*3+2]*B[bo+6+j]; }
// dst[d..d+5] = k * R Σ R^T
function covXform(R, ro, S, so, k, dst, d){
  const r00=R[ro],r01=R[ro+1],r02=R[ro+2],r10=R[ro+3],r11=R[ro+4],r12=R[ro+5],r20=R[ro+6],r21=R[ro+7],r22=R[ro+8];
  const s00=S[so],s01=S[so+1],s02=S[so+2],s11=S[so+3],s12=S[so+4],s22=S[so+5];
  const m00=r00*s00+r01*s01+r02*s02, m01=r00*s01+r01*s11+r02*s12, m02=r00*s02+r01*s12+r02*s22;
  const m10=r10*s00+r11*s01+r12*s02, m11=r10*s01+r11*s11+r12*s12, m12=r10*s02+r11*s12+r12*s22;
  const m20=r20*s00+r21*s01+r22*s02, m21=r20*s01+r21*s11+r22*s12, m22=r20*s02+r21*s12+r22*s22;
  dst[d]  =k*(m00*r00+m01*r01+m02*r02); dst[d+1]=k*(m00*r10+m01*r11+m02*r12); dst[d+2]=k*(m00*r20+m01*r21+m02*r22);
  dst[d+3]=k*(m10*r10+m11*r11+m12*r12); dst[d+4]=k*(m10*r20+m11*r21+m12*r22); dst[d+5]=k*(m20*r20+m21*r21+m22*r22); }

// ---------------------------------------------------------------- GL setup
const cv = $('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
if (!gl) { showErr('This browser does not support WebGL2.'); return; }
function shader(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const m = gl.getShaderInfoLog(s); console.error('[splat] shader', m); throw new Error('shader: ' + m); } return s; }
function program(vs, fs){ const p = gl.createProgram(); gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); } return { p, u }; }

const SPLAT_VS = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uData; uniform mat4 uView; uniform vec2 uFocal, uViewport; uniform float uTime, uMode; uniform vec3 uFogCol;
layout(location=0) in vec2 aPos; layout(location=1) in uint aIdx;
out vec4 vCol; out vec2 vPos; out float vSeed;
void main(){
  int i = int(aIdx);
  ivec2 b = ivec2((i & 511) << 2, i >> 9);
  vec4 t0 = texelFetch(uData, b, 0);
  if (!(t0.w > 0.003)) { gl_Position = vec4(0.,0.,2.,1.); return; }
  vec4 t1 = texelFetch(uData, b + ivec2(1,0), 0);
  vec4 t2 = texelFetch(uData, b + ivec2(2,0), 0);
  vec4 t3 = texelFetch(uData, b + ivec2(3,0), 0);
  vec3 c = t0.xyz;
  float sw = t2.z;
  if (sw > 0.0) {
    float ph = uTime*1.7 + c.x*0.31 + c.z*0.23;
    c.x += sw * (sin(ph) + 0.45*sin(uTime*3.3 + c.z*1.1));
    c.z += sw * 0.6 * cos(ph*0.9 + 1.3);
  }
  vec4 cam = uView * vec4(c, 1.0);
  if (cam.z < 0.06) { gl_Position = vec4(0.,0.,2.,1.); return; }
  vec2 ndc = cam.xy * uFocal * 2.0 / (uViewport * cam.z);
  if (abs(ndc.x) > 1.7 || abs(ndc.y) > 1.7) { gl_Position = vec4(0.,0.,2.,1.); return; }
  mat3 V = mat3(t1.x,t1.y,t1.z, t1.y,t1.w,t2.x, t1.z,t2.x,t2.y);
  mat3 W = mat3(uView);
  float z = cam.z, z2 = z*z;
  mat3 J = transpose(mat3(uFocal.x/z, 0., -uFocal.x*cam.x/z2,  0., uFocal.y/z, -uFocal.y*cam.y/z2,  0.,0.,0.));
  mat3 T = J * W;
  mat3 C = T * V * transpose(T);
  float a = C[0][0] + 0.3, bb = C[0][1], d = C[1][1] + 0.3;
  float mid = 0.5*(a+d), rad = length(vec2(0.5*(a-d), bb));
  float l1 = mid + rad, l2 = max(mid - rad, 0.1);
  vec2 dir = abs(bb) > 1e-6 ? normalize(vec2(bb, l1 - a)) : (a >= d ? vec2(1.,0.) : vec2(0.,1.));
  float cap = 0.75*max(uViewport.x, uViewport.y);
  vec2 M = min(sqrt(2.0*l1), cap) * dir;
  vec2 m = min(sqrt(2.0*l2), cap) * vec2(dir.y, -dir.x);
  vec3 col = t3.rgb; float alpha = t0.w;
  if (uMode < 0.5) {
    float dist = length(cam.xyz);
    float f = (1.0 - exp(-dist*0.0085)) * exp(-max(c.y - 3.0, 0.0)*0.03);
    col = mix(col, uFogCol, clamp(f, 0., 1.)*0.88);
    alpha *= smoothstep(0.12, 0.7, z);
  } else alpha *= smoothstep(0.16, 0.34, z);
  vCol = vec4(col, alpha);
  vPos = aPos;
  vSeed = fract(float(i)*0.61803398);
  gl_Position = vec4(ndc + (aPos.x*M + aPos.y*m) * 2.0 / uViewport, 0.0, 1.0);
}`;
const SPLAT_FS = `#version 300 es
precision highp float;
in vec4 vCol; in vec2 vPos; in float vSeed; out vec4 o;
void main(){
  float A = dot(vPos, vPos);
  if (A > 4.0) discard;
  float g = exp(-A);
  float br = 0.8 + 0.2*sin(vPos.y*9.0 + vSeed*37.0 + vPos.x*1.3);
  float B = min(0.99, g * br * vCol.a);
  if (B < 0.004) discard;
  o = vec4(vCol.rgb * (0.86 + 0.14*g) * B, B);
}`;
const SKY_VS = `#version 300 es
out vec2 vN; void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2))*2.0-1.0; vN = p; gl_Position = vec4(p,0.,1.); }`;
const SKY_FS = `#version 300 es
precision highp float;
uniform vec3 uR, uU, uF, uSun; uniform vec2 uTan;
in vec2 vN; out vec4 o;
void main(){
  vec3 d = normalize(uF + vN.x*uTan.x*uR + vN.y*uTan.y*uU);
  float h = d.y;
  vec3 zen = vec3(0.30,0.50,0.80), mid = vec3(0.58,0.72,0.88), hor = vec3(0.94,0.87,0.71);
  vec3 col = mix(hor, mid, smoothstep(0.0, 0.22, h)); col = mix(col, zen, smoothstep(0.2, 0.95, h));
  float s = max(dot(d, uSun), 0.);
  col += vec3(1.,0.8,0.5)*(pow(s,6.)*0.22 + pow(s,64.)*0.35) + vec3(1.,0.96,0.86)*smoothstep(0.9975,0.9986,s)*0.9;
  if (h < 0.) col = mix(hor, vec3(0.55,0.60,0.40), smoothstep(0., -0.12, h));
  float az = atan(d.x, d.z);
  col *= 0.985 + 0.03*sin(az*18.0 + sin(h*40.0)*2.5) * smoothstep(0.0, 0.3, h);
  o = vec4(col, 1.);
}`;
const splatProg = program(SPLAT_VS, SPLAT_FS);
const skyProg = program(SKY_VS, SKY_FS);

// ---------------------------------------------------------------- static scene generation
const ST = { p: [], c: [], col: [], a: [], sw: [], k: [] };
// kinds: 0 ground, 1 grass, 2 flower, 3 leaf, 4 far, 5 solid
function addS(x, y, z, c6, col, a, sw, k){ ST.p.push(x, y, z); ST.c.push(c6[0], c6[1], c6[2], c6[3], c6[4], c6[5]); ST.col.push(col[0], col[1], col[2]); ST.a.push(a); ST.sw.push(sw); ST.k.push(k); }
const shadeAt = (x, z) => 0.8 + 0.32*fbm(x*0.018+3, z*0.018+9);
function groundNormal(x, z){ const e = 0.3; return norm3([(groundH(x-e, z)-groundH(x+e, z))/(2*e), 1, (groundH(x, z-e)-groundH(x, z+e))/(2*e)]); }
function groundColor(x, z){
  const n1 = fbm(x*0.05, z*0.05), n2 = fbm(x*0.13+20, z*0.13-7);
  let c = mix3([0.30,0.47,0.16], [0.52,0.58,0.22], n1);
  c = mix3(c, [0.64,0.57,0.31], smoothstep(0.55, 0.78, n2)*0.7);
  const pd = pathDist(x, z), pw = 1.0 + 0.4*vnoise(x*0.3, z*0.3);

  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function sfxShot(){ if (!AC) return; const t = AC.currentTime; noise(t, 0.5, 'lowpass', 5000, 260, 1.1); tone(t, 0.3, 'sine', 95, 38, 0.9); noise(t, 0.06, 'highpass', 3000, 0, 0.5); }
function sfxPump(){ if (!AC) return; const t = AC.currentTime; noise(t, 0.04, 'bandpass', 1900, 0, 0.5, 3); noise(t + 0.2, 0.05, 'bandpass', 1200, 0, 0.55, 3); }
function sfxShell(){ if (!AC) return; noise(AC.currentTime, 0.04, 'bandpass', 2600, 0, 0.35, 4); }
function sfxSplat(){ if (!AC) return; const t = AC.currentTime; noise(t, 0.14, 'bandpass', 700, 300, 0.6, 2); }
function sfxDie(){ if (!AC) return; const t = AC.currentTime; tone(t, 0.45, 'sawtooth', 420, 70, 0.18); noise(t, 0.3, 'lowpass', 1200, 200, 0.7); }
function sfxHurt(){ if (!AC) return; const t = AC.currentTime; tone(t, 0.3, 'sine', 140, 55, 0.7); noise(t, 0.2, 'lowpass', 600, 100, 0.5); }
function chirp(){ if (!AC || Math.random() < 0.4) return; const t = AC.currentTime + Math.random(); const n = 2 + Math.floor(Math.random()*3);
  for (let i = 0; i < n; i++) tone(t + i*0.11, 0.08, 'sine', rr(2600, 3400), rr(3600, 4200), 0.03); }

// ---------------------------------------------------------------- HUD / overlay
function updateShells(){ const el = $('shells'); let h = ''; for (let i = 0; i < 6; i++) h += `<div class="sh${i < G.shells ? '' : ' e'}"></div>`; el.innerHTML = h; }
function showMsg(t){ const m = $('msg'); m.textContent = t; m.style.opacity = 1; G.msgT = 2.2; }
function showOverlay(title, body, btn){
  $('overlay').style.display = 'flex'; $('card').querySelector('h1').textContent = title; $('lead').innerHTML = body; $('go').textContent = btn; $('go').disabled = false;
  $('hud').style.display = 'none'; $('touchui').style.display = 'none';
}
$('ctl').innerHTML = IS_TOUCH
  ? 'Left thumb: move &nbsp;·&nbsp; Right thumb: drag to look<br>Tap anywhere on the right to fire (or hold FIRE)<br>Landscape works best.'
  : 'WASD move · Mouse look · Click fire<br>R reload · Shift sprint · Space jump · Esc pause';

// ---------------------------------------------------------------- input
let pointerLockOK = true;
function wantLock(){ if (IS_TOUCH || TEST || !pointerLockOK) return; try { const r = cv.requestPointerLock(); if (r && r.catch) r.catch(() => { pointerLockOK = false; }); } catch (e) { pointerLockOK = false; } }
document.addEventListener('pointerlockerror', () => { pointerLockOK = false; });
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && G.state === 'play' && pointerLockOK && !IS_TOUCH) pause(); });
function pause(){ G.state = 'paused'; input.fire = false; showOverlay('Paused', 'The bugs are waiting.', 'Resume'); }
function start(){
  audioInit();
  if (G.state === 'over' || G.state === 'menu') { resetGame(); G.state = 'play'; G.waveBreak = 0.8; }
  else G.state = 'play';
  $('overlay').style.display = 'none'; $('hud').style.display = 'block'; if (IS_TOUCH) $('touchui').style.display = 'block';
  wantLock();
  if (IS_TOUCH && document.documentElement.requestFullscreen && !document.fullscreenElement) { try { const r = document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
}
$('go').addEventListener('click', start);
window.addEventListener('keydown', e => {
  input.keys[e.code] = true;
  if (e.code === 'KeyR') input.reload = true;
  if (e.code === 'Space') { input.jump = true; e.preventDefault(); }
  if ((e.code === 'KeyP' || e.code === 'Escape') && G.state === 'play' && (!pointerLockOK || IS_TOUCH)) pause();
});
window.addEventListener('keyup', e => { input.keys[e.code] = false; });
let dragLook = false;
cv.addEventListener('mousedown', e => {
  if (G.state !== 'play') return;
  if (!document.pointerLockElement) wantLock();
  if (e.button === 0) input.fire = true; else if (e.button === 2) dragLook = true;
});
window.addEventListener('mouseup', e => { if (e.button === 0) input.fire = false; if (e.button === 2) dragLook = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousemove', e => { if (IS_TOUCH) return; if (document.pointerLockElement || dragLook || !pointerLockOK) { if (document.pointerLockElement || dragLook || (e.buttons & 1)) { input.dx += e.movementX; input.dy += e.movementY; } } });
// touch
const touches = new Map(); // id -> {role, x0,y0,x,y}
const btnHit = (el, x, y) => { const r = el.getBoundingClientRect(); const cx = r.left + r.width/2, cy = r.top + r.height/2; return Math.hypot(x - cx, y - cy) < r.width*0.62; };
function onTouchStart(e){
  if (G.state !== 'play') return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY; let role;
    if (btnHit($('bFire'), x, y)) { role = 'fire'; input.fire = true; }
    else if (btnHit($('bReload'), x, y)) { role = 'btn'; input.reload = true; }
    else if (btnHit($('bJump'), x, y)) { role = 'btn'; input.jump = true; }
    else if (btnHit($('bPause'), x, y)) { role = 'btn'; pause(); }
    else if (x < innerWidth*0.42 && ![...touches.values()].some(v => v.role === 'joy')) { role = 'joy'; const jb = $('joyBase'); jb.style.display = 'block'; jb.style.left = x + 'px'; jb.style.top = y + 'px'; }
    else role = 'look';
    touches.set(t.identifier, { role, x0: x, y0: y, x, y, t0: performance.now(), moved: 0 });
  }
}
function onTouchMove(e){
  e.preventDefault();
  for (const t of e.changedTouches) {
    const s = touches.get(t.identifier); if (!s) continue;
    const x = t.clientX, y = t.clientY;
    if (s.role === 'joy') {
      let dx = x - s.x0, dy = y - s.y0; const l = Math.hypot(dx, dy), m = 50; if (l > m) { dx *= m/l; dy *= m/l; }
      input.jx = dx/m; input.jy = -dy/m; $('joyKnob').style.transform = `translate(${dx}px,${dy}px)`;
    } else if (s.role === 'look' || s.role === 'fire') { input.dx += (x - s.x)*1.9; input.dy += (y - s.y)*1.9; s.moved += Math.abs(x - s.x) + Math.abs(y - s.y); }
    s.x = x; s.y = y;
  }
}
function onTouchEnd(e){
  for (const t of e.changedTouches) {
    const s = touches.get(t.identifier); if (!s) continue;
    if (s.role === 'joy') { input.jx = input.jy = 0; $('joyBase').style.display = 'none'; $('joyKnob').style.transform = ''; }
    if (s.role === 'fire') input.fire = false;
    if (s.role === 'look' && e.type === 'touchend' && performance.now() - s.t0 < 280 && s.moved < 16) G.tapQ = 0.35;
    touches.delete(t.identifier);
  }
}
window.addEventListener('touchstart', onTouchStart, { passive: false });
window.addEventListener('touchmove', onTouchMove, { passive: false });
window.addEventListener('touchend', onTouchEnd); window.addEventListener('touchcancel', onTouchEnd);
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') pause(); });

// ---------------------------------------------------------------- player update
function updatePlayer(dt){
  const sens = 0.0022;
  P.yaw -= input.dx*sens; P.pitch = clamp(P.pitch - input.dy*sens, -1.35, 1.35);
  input.dx = input.dy = 0;
  let mx = 0, mz = 0;
  if (input.keys.KeyW || input.keys.ArrowUp) mz += 1; if (input.keys.KeyS || input.keys.ArrowDown) mz -= 1;
  if (input.keys.KeyD || input.keys.ArrowRight) mx += 1; if (input.keys.KeyA || input.keys.ArrowLeft) mx -= 1;
  mx += input.jx; mz += input.jy;
  const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
  const sprint = (input.keys.ShiftLeft || input.keys.ShiftRight || Math.hypot(input.jx, input.jy) > 0.95) ? 1.6 : 1;
  const spd = 5.2*sprint, f = [Math.sin(P.yaw), Math.cos(P.yaw)], r = [-Math.cos(P.yaw), Math.sin(P.yaw)];
  P.x += (f[0]*mz + r[0]*mx)*spd*dt + P.kvx*dt; P.z += (f[1]*mz + r[1]*mx)*spd*dt + P.kvz*dt;
  P.kvx *= Math.max(0, 1 - dt*6); P.kvz *= Math.max(0, 1 - dt*6);
  for (const t of TREES) { const dx = P.x - t.x, dz = P.z - t.z, d = Math.hypot(dx, dz), m = t.r + 0.35; if (d < m && d > 1e-4) { P.x = t.x + dx/d*m; P.z = t.z + dz/d*m; } }
  const rad = Math.hypot(P.x, P.z); if (rad > 64) { P.x *= 64/rad; P.z *= 64/rad; }
  if (input.jump && P.jump <= 0 && P.vy === 0) P.vy = 5.2;
  input.jump = false;
  if (P.vy !== 0 || P.jump > 0) { P.vy -= 14*dt; P.jump += P.vy*dt; if (P.jump <= 0) { P.jump = 0; P.vy = 0; } }
  P.moving = lerp(P.moving, ml > 0.1 ? Math.min(1, ml)*sprint*0.8 : 0, Math.min(1, dt*8));
  P.bob += dt*(7 + sprint*2)*(ml > 0.1 ? 1 : 0);
  P.y = groundH(P.x, P.z);
  P.eyeY = P.y + 1.7 + P.jump + Math.sin(P.bob*2)*0.035*P.moving;
  P.lastHurt += dt; if (P.lastHurt > 4 && P.hp < 100) P.hp = Math.min(100, P.hp + 6*dt);
}

// ---------------------------------------------------------------- test autopilot
function autopilot(dt){
  let best = null, bd = 1e9;
  for (const ins of insects) { if (ins.dead) continue; const d = Math.hypot(ins.x - P.x, ins.z - P.z); if (d < bd) { bd = d; best = ins; } }
  input.fire = false;
  if (best && bd < 34) {
    const tx = best.hitW[3] - P.x, ty = best.hitW[4] - P.eyeY, tz = best.hitW[5] - P.z;
    const wy = Math.atan2(tx, tz), wp = Math.atan2(ty, Math.hypot(tx, tz));
    P.yaw = turnTo(P.yaw, wy, 3*dt); P.pitch = lerp(P.pitch, wp, Math.min(1, dt*4));
    if (Math.abs(angDiff(wy, P.yaw)) < 0.04) input.fire = true;
  } else P.yaw += dt*0.3;
}

// ---------------------------------------------------------------- render
function render(cam){
  const e = [P.x, P.eyeY, P.z];
  if (P.shake > 0) { e[0] += (Math.random() - 0.5)*P.shake*0.06; e[1] += (Math.random() - 0.5)*P.shake*0.06; }
  const fovY = (W < H ? 82 : 68)*PI/180; fpx = (H/2)/Math.tan(fovY/2);
  const { r, u, f } = cam;
  view[0] = r[0]; view[4] = r[1]; view[8] = r[2]; view[12] = -(r[0]*e[0] + r[1]*e[1] + r[2]*e[2]);
  view[1] = u[0]; view[5] = u[1]; view[9] = u[2]; view[13] = -(u[0]*e[0] + u[1]*e[1] + u[2]*e[2]);
  view[2] = f[0]; view[6] = f[1]; view[10] = f[2]; view[14] = -(f[0]*e[0] + f[1]*e[1] + f[2]*e[2]);
  view[3] = 0; view[7] = 0; view[11] = 0; view[15] = 1;
  if (!sortBusy) {
    sortBusy = true;
    const dp = new Float32Array(D*3);
    const hi = dynHigh;
    for (let j = 0; j < D; j++) { const o = dynOff(j); if (j < hi && used[j] && texData[o+3] > 0.003) { dp[j*3] = texData[o]; dp[j*3+1] = texData[o+1]; dp[j*3+2] = texData[o+2]; } else dp[j*3] = NaN; }
    sorter.postMessage({ type: 'sort', dyn: dp, e, f, r, u, tx: (W/2)/fpx*1.25, ty: (H/2)/fpx*1.25 }, [dp.buffer]);
  }
  // uploads
  gl.bindTexture(gl.TEXTURE_2D, worldTex);
  for (const row of dirtyRows) gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, row, 2048, 1, gl.RGBA, gl.FLOAT, texData, row*8192);
  dirtyRows.clear();
  const dynRows = Math.ceil(dynHigh/512);
  if (dynRows > 0) gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, S_PAD/512, 2048, dynRows, gl.RGBA, gl.FLOAT, texData, S_PAD*16);

  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(skyProg.p);
  gl.uniform3fv(skyProg.u.uR, r); gl.uniform3fv(skyProg.u.uU, u); gl.uniform3fv(skyProg.u.uF, f); gl.uniform3fv(skyProg.u.uSun, SUN);
  gl.uniform2f(skyProg.u.uTan, (W/2)/fpx, (H/2)/fpx);
  gl.bindVertexArray(null); gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(splatProg.p);
  const U = splatProg.u;
  gl.uniform2f(U.uFocal, fpx, fpx); gl.uniform2f(U.uViewport, W, H); gl.uniform1f(U.uTime, G.time); gl.uniform3f(U.uFogCol, 0.88, 0.85, 0.72);
  gl.uniform1i(U.uData, 0); gl.activeTexture(gl.TEXTURE0);
  if (drawCount > 0) {
    gl.bindTexture(gl.TEXTURE_2D, worldTex); gl.uniformMatrix4fv(U.uView, false, view); gl.uniform1f(U.uMode, 0);
    gl.bindVertexArray(worldVao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, drawCount);
  }
  if (G.state === 'play' || G.state === 'paused') {
    updateViewmodel(cam);
    gl.bindTexture(gl.TEXTURE_2D, vmTex); gl.uniformMatrix4fv(U.uView, false, ident); gl.uniform1f(U.uMode, 1);
    gl.bindVertexArray(vmVao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, GUN.n);
  }
  gl.bindVertexArray(null);
}

// ---------------------------------------------------------------- main loop
let last = performance.now(), fpsAcc = 0, fpsN = 0, logT = 0, scaleT = 0, msAvg = 16;
function frame(now){
  requestAnimationFrame(frame);
  const rawDt = (now - last)/1000; last = now;
  const dt = Math.min(0.05, rawDt);
  G.time += dt; stats.frames++;
  msAvg = lerp(msAvg, rawDt*1000, 0.05);
  if (G.state === 'play') {
    if (TEST && !window.__splat.noAuto) autopilot(dt);
    updatePlayer(dt); updateGun(dt);
    if (G.toSpawn.length) { G.spawnT -= dt; if (G.spawnT <= 0 && insects.length < QS.maxIns) { trySpawn(); G.spawnT = 1.1; } }
    else if (insects.length === 0) { G.waveBreak -= dt; if (G.waveBreak <= 0) { startWave(); G.waveBreak = 3; } }
  } else if (G.state === 'menu') {
    P.yaw += dt*0.06; P.pitch = -0.05; P.eyeY = groundH(P.x, P.z) + 1.8;
  }
  if (G.state !== 'paused') { updateInsects(G.state === 'play' ? dt : 0); updateBflies(dt); updateDebris(dt); }
  P.shake = Math.max(0, P.shake - dt*3);
  const cam = camBasis();
  render(cam);
  // HUD
  G.dmgFlash = Math.max(0, G.dmgFlash - dt*1.8); $('dmg').style.opacity = Math.max(G.dmgFlash, P.hp < 30 ? 0.25 + 0.1*Math.sin(G.time*5) : 0);
  G.hitMark = Math.max(0, G.hitMark - dt*5); $('hitm').style.opacity = G.hitMark;
  if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) $('msg').style.opacity = 0; }
  $('hpfill').style.width = P.hp + '%'; $('score').textContent = G.score;
  $('reloadTxt').style.opacity = G.reloading ? 0.9 : 0;
  if (buzzGain) { let g = 0; for (const ins of insects) if (ins.type === 'hornet' && !ins.dead) g += 1/(1 + Math.hypot(ins.x - P.x, ins.y - P.eyeY, ins.z - P.z)*0.4); buzzGain.gain.value = G.state === 'play' ? Math.min(0.12, g*0.07) : 0; }
  // adaptive resolution
  scaleT += rawDt;
  if (scaleT > 2 && !TEST) { scaleT = 0;
    if (msAvg > 24 && renderScale > 0.55) { renderScale = Math.max(0.55, renderScale - 0.12); resize(); }
    else if (msAvg < 13 && renderScale < 1) { renderScale = Math.min(1, renderScale + 0.08); resize(); } }
  fpsAcc += rawDt; fpsN++;
  if (fpsAcc > 1) { stats.fps = Math.round(fpsN/fpsAcc); fpsAcc = 0; fpsN = 0; }
  logT += rawDt;
  if (TEST && logT > 2) { logT = 0; log(JSON.stringify({ t: +G.time.toFixed(1), state: G.state, fps: stats.fps, draw: drawCount, sorts: stats.sorts, wave: G.wave, insects: insects.length, debris: debris.length, free: freeSlots.length, shots: stats.shots, kills: stats.kills, shells: G.shells, hp: Math.round(P.hp) })); }
}

// ---------------------------------------------------------------- boot
setTimeout(() => {
  try {
    buildWorld(); initDyn(); spawnBflies(); resize(); updateShells();
    window.__splat = { stats, G, P, insects, spawnInsect, TREES, setView: (x, z, yaw, pitch) => Object.assign(P, { x, z, yaw, pitch }) };
    $('go').disabled = false; $('go').textContent = 'Hunt';
    requestAnimationFrame(frame);
    if (TEST) setTimeout(start, 300);
  } catch (err) { console.error('[splat] boot', err); showErr('Failed: ' + err.message); }
}, 30);
})();
</script>
